<title>CRABDEN</title>
<style>
/* CRABDEN - the page is only a frame around one canvas. */

:root {
  color-scheme: dark;
  --sand: #e8c88d;
  --ink: #1a120c;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  background: #0a0705;
  overflow: hidden;
  overscroll-behavior: none;
  font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  color: var(--sand);
  -webkit-font-smoothing: none;
}

body {
  /* fixed rather than merely full-height: stops mobile browsers scrolling
     the page as their chrome slides in and out */
  position: fixed;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  /* a faint warm glow behind the letterboxing */
  background:
    radial-gradient(ellipse at 50% 45%, #241812 0%, #0a0705 70%);
  -webkit-user-select: none;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
  -webkit-touch-callout: none;
}

#game {
  display: block;
  image-rendering: pixelated;
  image-rendering: crisp-edges;
  touch-action: none;
  cursor: crosshair;
  box-shadow: 0 0 0 1px #2e2016, 0 12px 60px rgba(0, 0, 0, 0.75);
}

#boot {
  position: fixed;
  inset: 0;
  display: grid;
  place-content: center;
  gap: 0.6rem;
  text-align: center;
  background: #0a0705;
  z-index: 10;
}

#boot h1 {
  margin: 0;
  font-size: 2rem;
  letter-spacing: 0.35em;
  color: #6fd8ee;
}

#boot p { margin: 0; opacity: 0.6; font-size: 0.8rem; }

.crash {
  position: fixed;
  inset: 6vh 6vw;
  overflow: auto;
  padding: 1.4rem 1.6rem;
  background: #140c08;
  border: 1px solid #7a3324;
  color: #e8c0b8;
  z-index: 100;
  font-size: 0.78rem;
  line-height: 1.5;
}

.crash h1 { margin: 0 0 0.8rem; font-size: 1rem; color: #ff8a7a; letter-spacing: 0.1em; }
.crash pre { white-space: pre-wrap; color: #d8b0a8; background: #0d0705; padding: 0.8rem; border-radius: 2px; }
.crash code { color: #6fd8ee; }

/* Small screens: let the canvas fill what it can, and drop the cursor
   affordance that a finger cannot use. */
@media (max-width: 700px), (pointer: coarse) {
  #game { box-shadow: none; cursor: default; }
  #boot h1 { font-size: 1.5rem; }
}
</style>
<canvas id="game" width="960" height="540" aria-label="CRABDEN game screen"></canvas>
<div id="boot">
  <h1>CRABDEN</h1>
  <p>waking up&hellip;</p>
</div>
<noscript>
  <div class="crash"><h1>javascript is switched off</h1>
  <p>CRABDEN is a canvas game and needs JavaScript to run.</p></div>
</noscript>

    plant(plotIndex, floraId) {

      if (!plot || !plot.unlocked || plot.plant || !def3) return null;
      if (def3.needsPond && !(plot.wet && this.pond > 0.35)) return null;
      if (plot.wet && !def3.needsPond) return null;
      plot.plant = {
        id: floraId,
        def: def3,
        stage: 0,
        growth: 0,
        health: 1,

        born: this.t,

    /**
     * `supply` is how much water the crab can spare this tick; the garden
     * returns what it drank and what it fixed as nutrients.
     */
    update(dt, supply, weather) {
      this.t += dt;
      const crab = this.game.crab;
      const evap = 0.01 * (0.4 + (weather ? weather.haze : 0.4)) * (1 + (weather?.heat || 0));
      this.pond = clamp01(this.pond - evap * dt);
      this.spring = Math.max(0, this.spring - dt * 1.6);
      let drank = 0, fixed = 0, cover = 0;
      for (const plot of this.plots) {
        const pl = plot.plant;
        if (!pl) continue;
        pl.age += dt;
        const want = pl.def.upkeep * dt;
        const got = Math.min(want, Math.max(0, supply - drank));
        drank += got;
        const short = want > 0 ? 1 - got / want : 0;
        pl.thirst = clamp01(pl.thirst + (short - 0.5) * dt * 0.22);
        if (this.pond > 0.35) pl.thirst = Math.max(0, pl.thirst - dt * 0.28);
        pl.health = clamp01(pl.health + (pl.thirst > 0.7 ? -dt * 0.09 : dt * 0.06));
        if (pl.stage < GROW_STAGES - 1) {
          const rate = (1 - pl.thirst * 0.8) * (0.6 + this.pond * 0.7) * (pl.def.growBoost || 1);
          pl.growth += dt / pl.def.grow * Math.max(0.06, rate);
          if (pl.growth >= 1) {
            pl.growth = 0;
            pl.stage++;
            this.game.onPlantGrew?.(plot, pl);
          }
        } else {
          fixed += pl.def.yield * dt * pl.health * (0.65 + this.pond * 0.5);
          cover += 1;
          if (Math.random() < dt * 0.1 && this.game.fx) {
            const w = this.plotWorld(plot);
            const col = MATERIALS[pl.def.mat]?.ramp[6] || "#b6de8f";
            this.game.fx.drift(w.x, w.y - 4, pl.def.fruitMat ? "#dc6379" : col, 1);
          }
        }
      }
      this.lushness = damp(this.lushness, clamp01(cover / Math.max(3, this.plots.length * 0.6)), 0.05, dt);
      const over = this.pond > 0.88;
      const crabRef = crab;
      if (over && this.falls.length < 3 && Math.random() < dt * 6) {
        this.falls.push({ a: (Math.random() - 0.5) * 0.5, t: 0, life: 1.6 + Math.random() * 2.6, w: 1 + Math.random() * 1.4 });
      }
      for (let i = this.falls.length - 1; i >= 0; i--) {
        const f = this.falls[i];
        f.t += dt;
        if (f.t > f.life || !over && f.t > 0.6) this.falls.splice(i, 1);
      }
      if (over && crab && this.game.fx && Math.random() < dt * 22) {
        const lip = crab.shellWorldAB(0, crab.m.basin.b + crab.m.basin.r);
        const gy = this.game.terrain.surfaceY(lip.x);
        this.game.fx.splash(lip.x, gy, 1, 16);
        if (Math.random() < 0.35) this.game.fx.mist(lip.x, gy - 6, 1, 10);
        this.game.wetSand?.(lip.x, 1.4 * dt * 60);
      }
      return { drank, fixed };
    }
    /** The spring pumping: fills the basin and throws a plume. */

      this.spring = Math.min(1.6, this.spring + 0.8);

    plotWorld(plot) {
      return this.game.crab.shellWorldAB(plot.a, plot.b);

    /** Which plot is nearest a world point, for tap-to-plant. */
    pickPlot(wx, wy, maxDist = 18) {
      let best = null, bd = maxDist * maxDist;
      for (const p of this.plots) {
        if (!p.unlocked) continue;
        const w = this.plotWorld(p);
        const d = (w.x - wx) ** 2 + (w.y - wy) ** 2;
        if (d < bd) {
          bd = d;
          best = p;
        }
      }
      return best;

    // -- drawing --------------------------------------------------------------
    /** Anything rooted beyond the crown, which the shell itself occludes. */
    drawFar(ctx, crab) {
      this._drawRow(ctx, crab, 0);

    /** The basin, then everything on the near half of the dome. */
    drawNear(ctx, crab) {

    _drawRow(ctx, crab, row) {
      const wind = this.game.weather ? this.game.weather.windSpeed : 0.3;
      ctx.save();
      ctx.rotate(crab.bodyAngle + crab.roll);
      const list = this.plots.filter((p) => (p.plant || p.build) && (p.b < -0.05 ? 0 : 1) === row).sort((x, y) => x.b - y.b);
      for (const plot of list) {
        const sp = crab.rig.shellSurface(plot.a, plot.b);
        const depth = (plot.b + 1) / 2;
        const scale = lerp(0.8, 1.06, depth);
        const sway = Math.sin(this.t * (1.3 + plot.i * 0.13) + plot.sway) * (0.03 + wind * 0.06) + Math.sin(this.t * 3.1 + plot.sway) * 0.01;
        const tilt = Math.atan2(sp.nx, -sp.ny) * 0.3;
        ctx.save();
        ctx.translate(sp.x, sp.y + 1);
        ctx.rotate(tilt + sway);
        if (plot.plant) {
          const pl = plot.plant;
          const wilt = 1 - pl.thirst * 0.22;
          const art = buildPlant(
            pl.def,
            pl.stage,
            pl.variant,
            this.plantScale(crab) * scale,
            plot.b < -0.05 ? 0.3 : 0
          );
          ctx.scale(wilt, wilt);
          ctx.drawImage(art.cv, -art.ox, -art.oy);

        } else if (plot.build) {

      }

    /** The basin, the spring and the fall - all of the shell's water. */
    _drawWater(ctx, crab) {
      const m = crab.m;
      ctx.save();
      ctx.rotate(crab.bodyAngle + crab.roll);
      if (this.pond > 0.02) {
        const c = crab.rig.shellSurface(m.basin.a, m.basin.b);
        const fill = Math.pow(clamp01(this.pond), 0.55);
        const rx = m.rx * m.basin.r * 0.98 * fill;
        const ry = rx * 0.42;
        ctx.save();
        ctx.beginPath();
        ctx.ellipse(c.x, c.y, rx, ry, 0, 0, TAU);
        const g = ctx.createLinearGradient(0, c.y - ry, 0, c.y + ry);
        g.addColorStop(0, "#1d6f86");
        g.addColorStop(0.45, "#2f9db4");
        g.addColorStop(1, "#8adcea");
        ctx.fillStyle = g;
        ctx.fill();
        ctx.clip();
        ctx.fillStyle = "rgba(200,238,246,0.30)";
        ctx.fillRect(c.x - rx, c.y + ry * 0.35, rx * 2, ry);
        for (let i = 0; i < 7; i++) {
          const ph = this.t * (0.5 + i * 0.12) + i * 1.7;
          const gx = c.x + Math.sin(ph) * rx * 0.66;
          const gy = c.y + (i % 3 - 1) * ry * 0.42;
          ctx.globalAlpha = 0.55 - i % 3 * 0.14;
          ctx.fillStyle = "#eafbfd";
          ctx.fillRect(Math.round(gx - rx * 0.16), Math.round(gy), Math.max(1, rx * 0.32), 1);
        }
        if (this.spring > 0.05) {
          const org = crab.rig.sockets.organ;
          ctx.strokeStyle = "#eafbfd";
          ctx.lineWidth = 1;
          for (let i = 0; i < 3; i++) {
            const rr = (this.t * 16 + i * 6) % 18 + 1;
            ctx.globalAlpha = clamp01(this.spring) * (1 - rr / 19) * 0.7;
            ctx.beginPath();
            ctx.ellipse(org.x, org.y, rr, rr * 0.42, 0, 0, TAU);
            ctx.stroke();
          }
        }
        ctx.globalAlpha = 1;
        ctx.restore();
        ctx.strokeStyle = "rgba(230,248,252,0.5)";
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.ellipse(c.x, c.y, rx, ry, 0, Math.PI, TAU);
        ctx.stroke();
      }
      if (this.spring > 0.02) {
        const org = crab.rig.sockets.organ;
        const h = 4 + this.spring * 10;
        ctx.globalAlpha = clamp01(this.spring);
        ctx.fillStyle = "#c4ecf1";
        for (let i = 0; i < 5; i++) {
          const ph = this.t * 9 + i * 1.3;
          const w = 3 - i * 0.4;
          ctx.fillRect(
            Math.round(org.x - w / 2 + Math.sin(ph) * 1.2),
            Math.round(org.y - h * (i / 5)),
            Math.max(1, w),
            2
          );
        }
        ctx.globalAlpha = 1;
      }
      for (const fl of this.falls) {
        const spill = crab.rig.shellSurface(fl.a, m.basin.b + m.basin.r * 0.92);
        const drop = crab.standH + m.faceH * 0.4;
        const age = clamp01(fl.t / 0.4);
        ctx.globalAlpha = 0.72 * age * clamp01((fl.life - fl.t) / 0.5);
        const g = ctx.createLinearGradient(0, spill.y, 0, spill.y + drop);
        g.addColorStop(0, "#c4ecf1");
        g.addColorStop(0.3, "#5fc6d8");
        g.addColorStop(1, "rgba(120,214,228,0.16)");
        ctx.fillStyle = g;
        const wob = Math.sin(this.t * 4 + fl.a * 20) * 1.1;
        ctx.fillRect(
          Math.round(spill.x - fl.w / 2),
          Math.round(spill.y),
          Math.max(1, fl.w),
          Math.round(drop * age)
        );
        ctx.fillRect(
          Math.round(spill.x - fl.w / 2 + wob),
          Math.round(spill.y + drop * 0.55 * age),
          Math.max(1, fl.w * 0.7),
          Math.round(drop * 0.45 * age)
        );
        ctx.fillStyle = "#eafbfd";
        ctx.fillRect(
          Math.round(spill.x - fl.w / 2 - 1),
          Math.round(spill.y - 1),
          Math.max(1, fl.w) + 2,
          2
        );
        ctx.globalAlpha = 1;
      }
      ctx.restore();
    }

      const lead = this.vx * 0.16;
      const maxLift = this.bug ? 3 : 2;
      let lifting = 0;
      for (const l of this.legs) if (l.stepping) lifting++;
      for (const l of this.legs) {
        const home = this.x + l.hip.x * this.faceT + lead;
        if (l.stepping) {
          l.t += dt / (this.bug ? 0.13 : 0.19);
          if (l.t >= 1) {
            l.stepping = false;
            l.foot.x = l.to.x;
            l.foot.y = l.to.y;
            if (Math.abs(this.vx) > 22) {
              t.deform(l.foot.x, 0.4, 4);
              this.game.fx?.footPuff(l.foot.x, l.foot.y, Math.abs(this.vx) * 0.35, l.far);
            }
          } else {
            l.foot.x = lerp(l.from.x, l.to.x, l.t);
            l.foot.y = lerp(l.from.y, l.to.y, l.t) - Math.sin(l.t * Math.PI) * this.rig.standH * 0.22;

    _arm(ctx) {

      ctx.restore();

      ctx.rotate(a2);
      ctx.drawImage(a.lower.cv, -a.lower.ox, -a.lower.oy);
      ctx.restore();
    }
    _wing(ctx, art, side) {
      const so = this.rig.sockets;
      if (!so.wing) return;
      ctx.save();
      ctx.translate(so.wing.x + (side < 0 ? -1.6 * this.S : 0), so.wing.y);

      ctx.drawImage(art.cv, -art.ox, -art.oy);
      ctx.restore();
    }
    _tail(ctx, side) {
      const so = this.rig.sockets;
      const kind = this.def.tailKind;
      if (side < 0 && !kind) return;
      if (side > 0 && (kind === "plume" || kind === "sting")) return;
      ctx.save();
      ctx.translate(so.tail.x, so.tail.y);
      ctx.rotate(Math.PI + this.tailA * 0.5 + this.sway * 1.2);
      ctx.drawImage(this.rig.tail.cv, -this.rig.tail.ox, -this.rig.tail.oy);
      ctx.restore();
    }
    _shadow(ctx, cam) {
      const a = this.game.weather ? this.game.weather.shadowAlpha : 0.35;
      if (a <= 0.02) return;
      const gy = this.game.terrain.surfaceY(this.x);
      const s = cam.worldToScreen(this.x, gy);

      ctx.globalAlpha = a * 0.5;
      ctx.fillStyle = "#2a1a10";
      ctx.beginPath();
      ctx.ellipse(s.x, s.y, w * 0.5, Math.max(1, w * 0.11), 0, 0, TAU);
      ctx.fill();
      ctx.globalAlpha = 1;
    }
    _marker(ctx, cam) {
      const s = cam.worldToScreen(this.x, this.y - this.rig.body.H * 1.4);
      const t = this.game.time * 6;
      ctx.globalAlpha = 0.8;
      ctx.fillStyle = "#ffe9a8";
      ctx.fillRect(Math.round(s.x - 1), Math.round(s.y - 3 + Math.sin(t) * 1.5), 2, 4);
      ctx.globalAlpha = 1;
    }
  };

        this.seen[n.id] = this.visible(n) ? 1 : 0;
      }
      this._frame(vw, vh, true);
      this.motes = [];
      for (let i = 0; i < 70; i++) {
        this.motes.push({
          x: Math.random(),
          y: Math.random(),
          s: 0.3 + Math.random() * 0.9,
          p: Math.random() * TAU,
          r: Math.random() < 0.16 ? 1 : 0

    close() {
      this.diving = false;

    owned(n) {
      const e = this.game.economy;

      if (n.kind === "evo") return e.evolutions.has(n.data.id);
      if (n.kind === "gene") return e.genes.has(n.data.id);

    visible(n) {
      if (n.kind === "root" || n.kind === "gene" || n.kind === "label") return true;
      if (this.owned(n)) return true;
      const e = this.game.economy;
      if (n.kind === "evo") {
        const i = n.tier;
        return i === 0 || e.evolutions.has(EVOLUTIONS[i - 1].id);
      }
      return n.data.req.every((r) => e.skills.has(r));
    }
    state(n) {
      const e = this.game.economy;
      if (n.kind === "skill") return e.skillState(n.data.id);
      if (n.kind === "evo") return e.evoState(n.data.id);
      if (n.kind === "gene") return e.genes.has(n.data.id) ? "owned" : "locked";
      return "owned";

    say(msg, secs = 3.5) {
      this.toast = msg;
      this.toastT = secs;
    }
    // -------------------------------------------------------------------------
    /** Fit the camera to whatever of the tree currently exists. */
    _frame(vw, vh, snap = false) {
      let x0 = -60, x1 = 60, y0 = -40, y1 = 60;
      for (const n of this.L.nodes) {
        if (n.kind === "label") continue;
        if (n.kind === "gene" && (this.grow[n.id] ?? 0) < 0.5) continue;
        const a = Math.max(this.grow[n.id] ?? 0, (this.seen[n.id] ?? 0) * 0.9);
        if (a < 0.05) continue;
        const r = n.r + 22;
        x0 = Math.min(x0, n.x - r);
        x1 = Math.max(x1, n.x + r);
        y0 = Math.min(y0, n.y - r);
        y1 = Math.max(y1, n.y + r);
      }
      const w = Math.max(120, x1 - x0), h = Math.max(120, y1 - y0);
      const z = clamp(Math.min((vw - 40) / w, (vh - 70) / h), 0.26, 1.9);
      this.target.x = (x0 + x1) / 2;
      this.target.y = (y0 + y1) / 2;
      this.target.z = z;
      if (snap) {
        this.cam.x = this.target.x;
        this.cam.y = this.target.y;
        this.cam.z = this.target.z;
      }
    }
    update(dt, vw, vh) {
      this.t += dt;
      if (this.toastT > 0) {
        this.toastT -= dt;
        if (this.toastT <= 0) this.toast = null;
      }
      this.flash = Math.max(0, this.flash - dt * 1.6);
      this.dive = damp(this.dive, this.diving ? 1 : 0, 6e-4, dt);
      if (!this.diving && this.dive < 0.02) return false;
      for (const n of this.L.nodes) {
        const w = this.owned(n) ? 1 : 0;
        const c = this.grow[n.id] ?? 0;
        if (c !== w) this.grow[n.id] = damp(c, w, 0.02, dt);
        const v = this.visible(n) ? 1 : 0;
        const s = this.seen[n.id] ?? 0;
        if (s !== v) this.seen[n.id] = damp(s, v, 0.06, dt);
      }
      for (let i2 = this.pulses.length - 1; i2 >= 0; i2--) {
        const p = this.pulses[i2];
        p.t += dt / p.dur;
        if (p.t >= 1) this.pulses.splice(i2, 1);
      }
      const i = this.game.input;
      if (this.diving && this.dive > 0.7) {
        if (i.dragging && Math.abs(i.dragDX) + Math.abs(i.dragDY) > 0.4) {
          this.manual = true;
          this.target.x -= i.dragDX / this.cam.z;
          this.target.y -= i.dragDY / this.cam.z;
        }
        if (i.wheel) {
          this.manual = true;
          this.target.z = clamp(this.target.z * Math.pow(1.22, -i.wheel), 0.28, 2.6);
        }
        const ax = i.axis();
        if (ax.len > 0.1) {
          this.manual = true;
          this.target.x += ax.x * 220 * dt;
          this.target.y += ax.y * 220 * dt;
        }
        if (this.manual) {
          this.target.x = clamp(this.target.x, -520, 520);
          this.target.y = clamp(this.target.y, -900, 200);
        }
        if (i.justPressed("Escape") || i.justPressed("Tab")) {
          i.consumeKey("Escape");
          i.consumeKey("Tab");
          this.close();
        }
      }
      if (!this.manual) this._frame(vw, vh);
      this.cam.x = damp(this.cam.x, this.target.x, 6e-4, dt);
      this.cam.y = damp(this.cam.y, this.target.y, 6e-4, dt);
      this.cam.z = damp(this.cam.z, this.target.z, 6e-4, dt);

    _toScreen(n, vw, vh) {

        y: vh / 2 + (n.y - this.cam.y) * this.cam.z

    // -------------------------------------------------------------------------
    draw(ctx, vw, vh) {

      const k = clamp01(d);
      ctx.save();
      ctx.globalAlpha = clamp01(k * 1.6);
      ctx.fillStyle = "#050a0b";
      ctx.fillRect(0, 0, vw, vh);
      if (k < 0.62) {
        const r = lerp(10, Math.hypot(vw, vh), easeOutCubic(k / 0.62));
        const cx = lerp(this.from ? this.from.x : vw / 2, vw / 2, k / 0.62);
        const cy = lerp(this.from ? this.from.y : vh / 2, vh / 2, k / 0.62);
        ctx.globalAlpha = 1;
        const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, r);
        g.addColorStop(0, "#0a1518");
        g.addColorStop(0.72, "#0d2a2c");
        g.addColorStop(1, "rgba(10,20,22,0)");
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.arc(cx, cy, r, 0, TAU);
        ctx.fill();
        ctx.restore();

      const gy = vh / 2 + (10 - this.cam.y) * this.cam.z;
      this._drawGround(ctx, vw, vh, gy);
      this._drawHelix(ctx, vw, vh);
      this._drawBranches(ctx, vw, vh, fade);
      const hover = this._drawNodes(ctx, vw, vh, fade);
      this._drawPulses(ctx, vw, vh);
      this._drawChrome(ctx, vw, vh, fade, hover);
      ctx.restore();
    }
    /** Inside the orb: a warm green deep, with genetic motes suspended in it. */
    _drawDeep(ctx, vw, vh, fade) {

      bg.addColorStop(0, `rgb(${18 + this.flash * 40},${52 + this.flash * 46},${52 + this.flash * 30})`);
      bg.addColorStop(0.5, "#0b1d21");
      bg.addColorStop(1, "#050c0f");
      ctx.fillStyle = bg;
      ctx.fillRect(0, 0, vw, vh);
      for (const m of this.motes) {
        const y = (m.y - this.t * 0.012 * m.s + 2) % 1;
        const x = (m.x + Math.sin(this.t * 0.3 * m.s + m.p) * 0.012 + 1) % 1;
        const px = Math.round(x * vw), py = Math.round(y * vh);

        ctx.globalAlpha = fade * 0.42 * tw * m.s;
        ctx.fillStyle = m.r ? "#ffe9a8" : "#9fe8d4";
        ctx.fillRect(px, py, 1, 1);
        if (m.s > 0.9) {
          ctx.globalAlpha = fade * 0.14 * tw;
          ctx.fillRect(px - 1, py, 3, 1);
          ctx.fillRect(px, py - 1, 1, 3);

      ctx.globalAlpha = fade;

    _drawGround(ctx, vw, vh, gy) {

      g.addColorStop(0, "rgba(46,34,22,0.0)");
      g.addColorStop(0.12, "rgba(40,30,20,0.62)");
      g.addColorStop(1, "rgba(14,12,10,0.86)");
      ctx.fillStyle = g;
      ctx.fillRect(0, gy - 6, vw, vh - gy + 6);
      ctx.fillStyle = "rgba(150,124,82,0.45)";
      ctx.fillRect(0, Math.round(gy), vw, 1);
    }
    /**

    _drawHelix(ctx, vw, vh) {

      for (const n of this.L.nodes) {

        if (g > 0.05) topY = Math.min(topY, n.y * g);
      }
      topY = Math.min(topY, TRUNK_BASE * 0.72);

      const base = this._toScreen(seed, vw, vh);
      const top = this._toScreen({ x: 0, y: topY - 46 }, vw, vh);
      const h = base.y - top.y;

      const turns = h / (34 * z);

        ctx.lineTo(x1, y);
        ctx.stroke();

    /** Geometry of one branch, shared by the wood and by the sap pulses. */
    _branchPath(ln, vw, vh) {

      if (!a || !b) return null;
      const pa = this._toScreen(a, vw, vh), pb = this._toScreen(b, vw, vh);

      const mx = (pa.x + pb.x) / 2 + (b.x - a.x) * 0.09;

    _drawBranches(ctx, vw, vh, fade) {

        if (seen < 0.03) continue;

        ctx.moveTo(left[0].x, left[0].y);
        for (const p of left) ctx.lineTo(p.x, p.y);

            ctx.beginPath();

        ctx.globalAlpha = fade;

    _drawNodes(ctx, vw, vh, fade) {

        const seen = this.seen[n.id] ?? 0;

          const anyBud = SKILLS.some((s) => s.branch === n.id.slice(6) && (this.seen["skill:" + s.id] ?? 0) > 0.4);
          if (!anyBud || this.cam.z < 0.45 || this.cam.z > 1.15) continue;

        if (seen < 0.05) continue;

        if (p.x < -50 || p.x > vw + 50 || p.y < -50 || p.y > vh + 50) continue;
        const st = this.state(n);
        const g = this.grow[n.id] ?? 0;
        const on = st === "owned";
        const ready = st === "ready";
        const dim = n.kind === "gene" && !on ? 0.42 : 1;
        const r = n.r * this.cam.z * lerp(0.55, 1, Math.max(g, 0.55)) * seen * (dim < 1 ? 0.82 : 1);

        ctx.fillStyle = n.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, r * (2 + pulse * 0.5), 0, TAU);
        ctx.fill();
        ctx.globalAlpha = fade * seen * dim;
        if (on || n.kind === "root") {
          ctx.fillStyle = n.color;
          ctx.beginPath();
          ctx.arc(p.x, p.y, r, 0, TAU);
          ctx.fill();
          ctx.strokeStyle = "rgba(255,255,255,0.6)";
          ctx.lineWidth = Math.max(1, 1.4 * this.cam.z);
          ctx.beginPath();
          ctx.arc(p.x, p.y, r, 0, TAU);
          ctx.stroke();
          ctx.fillStyle = "rgba(255,255,255,0.85)";
          ctx.beginPath();
          ctx.arc(p.x - r * 0.3, p.y - r * 0.32, Math.max(1, r * 0.24), 0, TAU);
          ctx.fill();
        } else {
          const rot = -0.5 + Math.sin(this.t * 0.9 + n.x * 0.03) * 0.1;
          ctx.save();
          ctx.translate(p.x, p.y);
          ctx.rotate(rot);
          ctx.fillStyle = ready ? "#3f5c44" : "#26332e";
          ctx.beginPath();
          ctx.ellipse(0, 0, r * 0.78, r * 1.1, 0, 0, TAU);
          ctx.fill();
          ctx.strokeStyle = hot ? "#dff4e6" : ready ? "rgba(190,230,170,0.75)" : "rgba(150,182,168,0.35)";
          ctx.lineWidth = Math.max(1, 1.2 * this.cam.z);
          ctx.stroke();
          ctx.strokeStyle = ready ? `rgba(200,255,190,${0.35 + pulse * 0.5})` : "rgba(160,200,180,0.22)";
          ctx.beginPath();
          ctx.moveTo(0, -r * 0.95);
          ctx.lineTo(0, r * 0.85);
          ctx.stroke();
          ctx.restore();
        }
        if (n.kind === "evo" && this.cam.z > 0.62) {
          drawText(
            ctx,
            n.data.name,
            p.x,
            p.y + r + 4,
            { color: on ? "#e8f2d8" : "rgba(220,236,210,0.55)", align: "center", alpha: fade * seen }
          );
        }
        if (hot && i.clicked && n.kind !== "root") {

          this._buy(n);
        }
      }
      ctx.globalAlpha = fade;
      return hover;
    }
    /** Sap: a bright bead running from the roots into whatever just opened. */
    _drawPulses(ctx, vw, vh) {
      for (const p of this.pulses) {
        const ln = p.ln;
        const path = this._branchPath(ln, vw, vh);
        if (!path) continue;
        const t = clamp01(p.t);
        const c = curveAt(path.pa, path.pb, path.mx, path.my, t);
        const a = Math.sin(t * Math.PI);

        g.addColorStop(0.35, `rgba(150,236,180,${0.45 * a})`);
        g.addColorStop(1, "rgba(120,220,180,0)");

        ctx.beginPath();
        ctx.arc(c.x, c.y, r * 3.6, 0, TAU);
        ctx.fill();
        ctx.fillStyle = `rgba(255,255,255,${0.9 * a})`;
        ctx.beginPath();
        ctx.arc(c.x, c.y, r * 0.6, 0, TAU);
        ctx.fill();

    }
    _drawChrome(ctx, vw, vh, fade, hover) {
      const e = this.game.economy;
      const total = EVOLUTIONS.length + SKILLS.length;
      const open = e.evolutions.size + e.skills.size;
      drawText(ctx, "THE TREE OF LIFE", vw / 2, 8, { color: "#cfe8d8", align: "center" });
      drawText(
        ctx,
        `${Math.round(e.nutrients)} nutrients   ${e.genes.size}/${GENES.length} genes expressed   ${open}/${total} grown`,
        vw / 2,
        20,
        { color: "rgba(200,226,210,0.6)", align: "center" }
      );
      drawText(
        ctx,
        this.manual ? "drag to look around   esc to wake up" : "esc to wake up",
        vw / 2,
        vh - 12,
        { color: "rgba(200,226,210,0.4)", align: "center" }
      );

      if (this.toast) {
        const w = Math.min(vw - 30, textWidth(this.toast) + 18);
        ctx.fillStyle = "rgba(8,20,20,0.9)";
        ctx.fillRect((vw - w) / 2, vh - 42, w, 14);
        ctx.strokeStyle = "rgba(140,196,104,0.5)";

        cost = `${d.cost} nutrients`;
        body = d.desc;
        if (this.state(n) === "locked") extra = "needs " + d.req.map((r) => SKILL_BY_ID[r].name).join(", ");

        title = d.name;
        cost = `${d.nutrients} nutrients`;
        body = d.desc;
        const miss = e.missingGenes(d.genes);
        extra = miss.length ? "needs genes: " + miss.map((g) => GENE_BY_ID[g]?.name || g).join(", ") : "genes: " + d.genes.map((g) => GENE_BY_ID[g]?.name || g).join(", ");
      } else if (n.kind === "gene") {
        title = d.name;
        cost = e.genes.has(d.id) ? "expressed" : "dormant";
        body = d.desc;
        extra = "from " + d.from;

      const lines = wrapText(body, 150).concat(extra ? wrapText(extra, 150) : []);

        const node = this.L.by[cur];
        const ln = this.L.links.find((l) => l.to === cur);
        if (!ln) break;
        chain.unshift(ln);
        cur = ln.from;

      chain.forEach((ln, i) => this.pulses.push({ ln, t: -i * 0.55, dur: 0.55 }));

        return;

        if (e.buySkill(n.data.id)) {

          this._sap(n.id);
          this.game.audio?.play("grow");

      }
      if (n.kind === "evo") {

  // js/ui/ui.js

    say(text, secs = 3.6) {

    // -- on-screen controls ---------------------------------------------------
    _installTouch() {

            if (b.key) i.pulseVirtual(b.key);

    cycleMode() {

    // -- frame ----------------------------------------------------------------

      this.drawer = damp(this.drawer, this.drawerOpen ? 1 : 0, 9e-4, dt);

    _updatePlacing() {
      const g = this.game;
      const w = g.cam.screenToWorld(g.input.sx, g.input.sy);
      const wantWet = this.placing.kind === "flora" && FLORA_BY_ID[this.placing.id]?.needsPond;
      let best = null, bd = 1e9;
      for (const p of g.garden.plots) {
        if (!p.unlocked) continue;

        if (this.placing.kind === "flora" && (p.plant || p.build || !!p.wet !== !!wantWet)) continue;
        const wp = g.garden.plotWorld(p);
        const d = (wp.x - w.x) ** 2 + (wp.y - w.y) ** 2;
        if (d < bd) {

          best = p;

      this.ghostPlot = best;
      if (g.input.clicked) {

    // -- placement ------------------------------------------------------------

    drawGhost(ctx, cam) {

      const kind = this.placing.kind;
      const wantWet = kind === "flora" && FLORA_BY_ID[this.placing.id]?.needsPond;
      for (const p of g.garden.plots) {
        if (!p.unlocked) continue;
        const ok = kind === "build" ? !p.wet && !p.plant && !p.build : !p.plant && !p.build && !!p.wet === !!wantWet;
        const wp2 = g.garden.plotWorld(p);

        const pulse = 0.5 + Math.sin(this.t * 3 + p.i) * 0.5;

        ctx.drawImage(art.cv, -art.ox, -art.oy);

      ctx.strokeRect(x + 0.5, y + 0.5, w - 1, h - 1);

      lines.forEach((l, k) => drawText(ctx, l, x + 5, y + (t.title ? 15 : 4) + k * LINE_H, { color: DIM }));
    }

        hour: this.weather.hour,
        day: this.weather.day,
        economy: this.economy.toJSON(),
        garden: this.garden.toJSON(),
        wildlife: this.wildlife.toJSON(),
        seeds: this.seeds,
        taken: [...this.encounters.taken],
        tutorial: this.tutorial,
        world: this.world.toJSON(),
        research: this.research,
        mode: this.ui.mode,
        insc: this.readInscriptions
      });
    }
    load(d) {
      try {
        this.crab.setStage(d.stage || "hatchling");
        this.crab.x = d.x || 0;
        this.crab.snapToGround();
        this.crab.hp = d.hp ?? this.crab.hpMax;
        this.weather.hour = d.hour ?? 11;
        this.weather.day = d.day ?? 0;
        this.economy.fromJSON(d.economy);
        this.garden.fromJSON(d.garden);
        this.wildlife.fromJSON(d.wildlife);
        this.seeds = d.seeds || this.seeds;
        this.encounters.taken = new Set(d.taken || []);
        this.world.fromJSON(d.world);
        this.tutorial = d.tutorial || 3;
        this.research = d.research || {};
        this.readInscriptions = d.insc || 0;
        if (d.mode) this.ui.mode = d.mode;
        this.economy.recomputeGenes();
        this.economy.markDirty();
        this.cam.followEntity(this.crab, true);
      } catch (err) {
      }
    }
    reset() {
      clearSave();
      this.newRun();
    }
    // -- draw -----------------------------------------------------------------
    draw() {
      const r = this.renderer;
      const ctx = r.scene;
      const cam = this.cam;
      r.beginFrame(0);
      this.backdrop.drawSky(ctx, cam, this.weather);
      this.backdrop.drawLayer(ctx, cam, this.weather, "far", this.terrain);
      this.backdrop.drawLayer(ctx, cam, this.weather, "mid", this.terrain);
      this.backdrop.drawLayer(ctx, cam, this.weather, "near", this.terrain);
      this.world.drawProps(ctx, cam);
      this.terrain.draw(ctx, cam);
      this.world.drawWater(ctx, cam);
      this.terrain.drawSand(ctx, cam);
      this.world.drawScatter(ctx, cam, "far");
      this.encounters.draw(ctx, cam);
      this.fx.draw(ctx, cam, "far");
      this.wildlife.draw(ctx, cam, "ground");
      this.npc.draw(ctx, cam);
      this.crab.draw(ctx, cam, this.garden);
      this.ui.drawGhost(ctx, cam);
      this.wildlife.draw(ctx, cam, "shell");
      this.fx.draw(ctx, cam, "near");
      this.world.drawScatter(ctx, cam, "near");
      this.backdrop.drawForeground(ctx, cam, this.weather, this.terrain);
      r.beginLights(this.weather);
      const lightPow = this.economy.stat("light");
      if (lightPow > 0) {
        const o = this.crab.shellWorldAB(0, 0.1);
        const s = cam.worldToScreen(o.x, o.y);
        r.addLight(s.x, s.y, 90 * cam.zoom * (0.6 + lightPow * 0.5), "#ffd98a", 0.8);
      }
      for (const c of this.wildlife.list) {
        if (!c.def.glow || !c.alive) continue;
        const s = cam.worldToScreen(c.x, c.y);
        r.addLight(s.x, s.y, 40 * cam.zoom, c.def.glow, 0.7);
      }
      if (this.garden.pond > 0.3) {
        const o = this.crab.shellWorldAB(this.crab.m.basin.a, this.crab.m.basin.b);
        const s = cam.worldToScreen(o.x, o.y);
        r.addLight(s.x, s.y, 34 * cam.zoom, "#9de3ee", 0.25 * this.garden.pond);
      }
      r.endLights();
      r.drawWeatherOverlay(this.weather, this);
      r.composite(this.weather, this);
      const ui = r.ui;
      if (this.state === "intro") this._drawCutscene(ui, r);
      else this.ui.draw(ui, r);
      this.fx.drawText(ui, cam, (c, t, x, y, o) => drawText(c, t, x, y, o));
      if (this.state === "dead") this._drawDead(ui, r);
      if (this.npc.speech && this.state === "play") this._drawSpeech(ui, cam, this.npc);
      r.dctx.drawImage(r.uiC, 0, 0, r.vw, r.vh, 0, 0, r.vw * r.scale, r.vh * r.scale);
    }
    _drawSpeech(ctx, cam, who) {
      const s = cam.worldToScreen(who.x, who.y - 40);
      const lines = wrapText(who.speech, 130);
      const w = Math.max(...lines.map((l) => textWidth(l))) + 10;
      const h = lines.length * LINE_H + 6;
      const x = clamp(Math.round(s.x - w / 2), 2, this.renderer.vw - w - 2);
      const y = clamp(Math.round(s.y - h), 2, this.renderer.vh - h - 2);
      ctx.fillStyle = "rgba(18,13,9,0.9)";
      ctx.fillRect(x, y, w, h);
      ctx.strokeStyle = "rgba(226,200,150,0.4)";
      ctx.strokeRect(x + 0.5, y + 0.5, w - 1, h - 1);
      lines.forEach((l, i) => drawText(ctx, l, x + 5, y + 4 + i * LINE_H, { color: "#f2e4c2" }));
    }
    _drawCutscene(ctx, r) {
      const bar = Math.round(22 * this.letterbox);
      ctx.fillStyle = "#080604";
      ctx.fillRect(0, 0, r.vw, bar);
      ctx.fillRect(0, r.vh - bar, r.vw, bar);
      if (this.dialog) {
        const d = this.dialog;
        const nar = d.who === "narrator";
        const lines = wrapText(d.text, r.vw - 60);
        const h = lines.length * LINE_H + (nar ? 4 : 14);
        const y = r.vh - bar - h - 8;
        const x = 26;
        if (!nar) {
          ctx.fillStyle = "rgba(16,12,8,0.9)";
          ctx.fillRect(x - 6, y - 4, r.vw - 40, h + 8);
          ctx.strokeStyle = "rgba(226,200,150,0.35)";
          ctx.strokeRect(x - 5.5, y - 3.5, r.vw - 41, h + 7);
          drawText(ctx, d.who, x, y, { color: "#e2b74a" });
        }
        const cps = 48;
        const shown = Math.floor(d.t * cps);
        let used = 0;
        lines.forEach((l, i) => {
          const room = Math.max(0, shown - used);
          used += l.length;
          drawText(
            ctx,
            l.slice(0, room),
            x,
            y + (nar ? 0 : 11) + i * LINE_H,
            { color: nar ? "rgba(230,214,180,0.82)" : "#f2e4c2", outline: nar, outlineColor: "rgba(0,0,0,0.6)" }
          );
        });
      }
      drawText(
        ctx,
        "space / tap to skip",
        r.vw - 4,
        r.vh - bar - 8,
        { color: "rgba(230,214,180,0.4)", align: "right" }
      );
    }
    _drawDead(ctx, r) {
      ctx.fillStyle = "rgba(10,6,4,0.6)";
      ctx.fillRect(0, 0, r.vw, r.vh);
      drawText(
        ctx,
        "THE SAND TAKES WHAT IT TAKES",
        r.vw / 2,
        r.vh / 2 - 18,
        { color: "#f2e4c2", align: "center", scale: 2 }
      );
      const w = 110, x = (r.vw - w) / 2, y = r.vh / 2 + 8;
      const hot = this.input.sx >= x && this.input.sx <= x + w && this.input.sy >= y && this.input.sy <= y + 16;
      ctx.fillStyle = hot ? "rgba(96,74,44,0.95)" : "rgba(52,40,26,0.9)";
      ctx.fillRect(x, y, w, 16);
      ctx.strokeStyle = "rgba(226,200,150,0.4)";
      ctx.strokeRect(x + 0.5, y + 0.5, w - 1, 15);
      drawText(ctx, "PULL YOURSELF UP", x + w / 2, y + 5, { color: "#f2e4c2", align: "center" });
      if (hot && this.input.clicked) {
        this.input.clicked = false;
        this.crab.hp = this.crab.hpMax * 0.6;
        this.crab.iframe = 2.5;
        this.state = "play";
        for (const q of this.wildlife.hostiles) q.x += q.x - this.crab.x > 0 ? 200 : -200;
      }
    }
  };

  // js/main.js
  var canvas = document.getElementById("game");
  var boot = document.getElementById("boot");
  var game;
  loadPeople().then(start).catch(start);
  function start() {
    try {
      game = new Game(canvas);
      window.CRABDEN = game;
    } catch (err) {
      showError(err);
      throw err;
    }
    if (boot) boot.remove();
    requestAnimationFrame(frame2);
  }
  var kick = () => {
    game?.audio.resume();
    window.removeEventListener("pointerdown", kick);
    window.removeEventListener("keydown", kick);
  };
  window.addEventListener("pointerdown", kick);
  window.addEventListener("keydown", kick);
  var last = performance.now();
  function frame2(now) {
    requestAnimationFrame(frame2);
    if (!game) return;
    let dt = (now - last) / 1e3;
    last = now;
    if (dt > 0.25) dt = 0.25;
    if (dt <= 0) return;
    try {
      game.update(dt);
      game.draw();
      game.input.endFrame();
    } catch (err) {
      showError(err);
      throw err;
    }
  }
  document.addEventListener("visibilitychange", () => {
    last = performance.now();
  });
  window.addEventListener("orientationchange", () => {
    setTimeout(() => {
      if (!game) return;
      game.renderer.resize();
      game.input.scale = game.renderer.scale;
    }, 120);
  });
  function showError(err) {
    const box = document.createElement("div");
    box.className = "crash";
    box.innerHTML = `<h1>the crab has encountered a problem</h1><pre></pre>
    <p>reload to try again. if it keeps happening, clear the save:
    <code>localStorage.clear()</code></p>`;
    box.querySelector("pre").textContent = err && err.stack || String(err);
    document.body.appendChild(box);
  }
})();
</script>
