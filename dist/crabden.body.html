<title>CRABDEN</title>
<style>
/* CRABDEN - the page is only a frame around one canvas. */

:root {
  color-scheme: dark;
  --sand: #e8c88d;
  --ink: #1a120c;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  background: #0a0705;
  overflow: hidden;
  overscroll-behavior: none;
  font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  color: var(--sand);
  -webkit-font-smoothing: none;
}

body {
  /* fixed rather than merely full-height: stops mobile browsers scrolling
     the page as their chrome slides in and out */
  position: fixed;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  /* a faint warm glow behind the letterboxing */
  background:
    radial-gradient(ellipse at 50% 45%, #241812 0%, #0a0705 70%);
  -webkit-user-select: none;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
  -webkit-touch-callout: none;
}

#game {
  display: block;
  image-rendering: pixelated;
  image-rendering: crisp-edges;
  touch-action: none;
  cursor: crosshair;
  box-shadow: 0 0 0 1px #2e2016, 0 12px 60px rgba(0, 0, 0, 0.75);
}

#boot {
  position: fixed;
  inset: 0;
  display: grid;
  place-content: center;
  gap: 0.6rem;
  text-align: center;
  background: #0a0705;
  z-index: 10;
}

#boot h1 {
  margin: 0;
  font-size: 2rem;
  letter-spacing: 0.35em;
  color: #6fd8ee;
}

#boot p { margin: 0; opacity: 0.6; font-size: 0.8rem; }

.crash {
  position: fixed;
  inset: 6vh 6vw;
  overflow: auto;
  padding: 1.4rem 1.6rem;
  background: #140c08;
  border: 1px solid #7a3324;
  color: #e8c0b8;
  z-index: 100;
  font-size: 0.78rem;
  line-height: 1.5;
}

.crash h1 { margin: 0 0 0.8rem; font-size: 1rem; color: #ff8a7a; letter-spacing: 0.1em; }
.crash pre { white-space: pre-wrap; color: #d8b0a8; background: #0d0705; padding: 0.8rem; border-radius: 2px; }
.crash code { color: #6fd8ee; }

/* Small screens: let the canvas fill what it can, and drop the cursor
   affordance that a finger cannot use. */
@media (max-width: 700px), (pointer: coarse) {
  #game { box-shadow: none; cursor: default; }
  #boot h1 { font-size: 1.5rem; }
}
</style>
<canvas id="game" width="960" height="540" aria-label="CRABDEN game screen"></canvas>
<div id="boot">
  <h1>CRABDEN</h1>
  <p>waking up&hellip;</p>
</div>
<noscript>
  <div class="crash"><h1>javascript is switched off</h1>
  <p>CRABDEN is a canvas game and needs JavaScript to run.</p></div>
</noscript>

    /**

    update(dt, supply, weather) {
      this.t += dt;
      const crab = this.game.crab;
      const evap = 0.01 * (0.4 + (weather ? weather.haze : 0.4)) * (1 + (weather?.heat || 0));
      this.pond = clamp01(this.pond - evap * dt);

        const pl = plot.plant;
        if (!pl) continue;

        if (pl.soaked < 1) {
          const wet = this.pond > 0.06 ? 0.9 : 0;
          const spray = this.spring > 0.1 ? 0.7 : 0;
          pl.soaked = clamp01(pl.soaked + (wet + spray) * dt * 0.55);
          if (pl.soaked >= 1) this.game.onGerminate?.(plot, pl);
          continue;
        }
        const want = pl.def.upkeep * dt;
        const got = Math.min(want, Math.max(0, supply - drank));
        drank += got;
        const short = want > 0 ? 1 - got / want : 0;

        if (this.pond > 0.35) pl.thirst = Math.max(0, pl.thirst - dt * 0.28);
        const heavySide = Math.abs(trim) > 0.42 && Math.sign(plot.a) === Math.sign(trim);

          const rate = (1 - pl.thirst * 0.8) * (0.6 + this.pond * 0.7) * (pl.def.growBoost || 1) * (1 - over * 0.55);

          if (pl.growth >= 1) {
            pl.growth = 0;
            pl.stage++;
            this.game.onPlantGrew?.(plot, pl);
          }
        } else {
          cover += 1;
          if (pl.ripe < 1 && this.needMet(pl.def)) {
            const rate = (0.55 + pl.health * 0.45) * (0.8 + this.pond * 0.35) * (1 - over * 0.5) / Math.max(0.3, this.game.economy ? this.game.economy.stat("ripen") : 1);

            if (pl.ripe >= 1 && !pl.rang) {

          if (pl.ripe < 1) pl.rang = false;
          if (Math.random() < dt * 0.1 && this.game.fx) {
            const w = this.plotWorld(plot);

      const crabRef = crab;
      if (spill && this.falls.length < 3 && Math.random() < dt * 6) {
        this.falls.push({ a: (Math.random() - 0.5) * 0.5, t: 0, life: 1.6 + Math.random() * 2.6, w: 1 + Math.random() * 1.4 });

        const f = this.falls[i];
        f.t += dt;
        if (f.t > f.life || !spill && f.t > 0.6) this.falls.splice(i, 1);
      }
      if (spill && crab && this.game.fx && Math.random() < dt * 22) {
        const lip = crab.shellWorldAB(0, crab.m.basin.b + crab.m.basin.r);
        const gy = this.game.terrain.surfaceY(lip.x);
        this.game.fx.splash(lip.x, gy, 1, 16);

    pickPlot(wx, wy, maxDist = 18) {

      for (const p of this.plots) {
        if (!p.unlocked) continue;
        const w = this.plotWorld(p);
        const d = (w.x - wx) ** 2 + (w.y - wy) ** 2;

    // -- drawing --------------------------------------------------------------

    _drawRow(ctx, crab, row) {
      const wind = this.game.weather ? this.game.weather.windSpeed : 0.3;
      ctx.save();
      ctx.rotate(crab.bodyAngle + crab.roll);
      const list = this.plots.filter((p) => (p.plant || p.build) && (p.b < -0.05 ? 0 : 1) === row).sort((x, y) => x.b - y.b);
      for (const plot of list) {

    _drawWater(ctx, crab) {

        ctx.strokeStyle = "rgba(230,248,252,0.5)";
        ctx.lineWidth = 1;

      const e = easeInOutCubic(clamp01(t));

        { at: 0.34, c0: "#7a4c33", c1: "#1d1210", label: "CHITIN" },
        { at: 0.62, c0: "#b9c2d8", c1: "#2c2b33", label: "PEARL" }

        g.addColorStop(0.6, L.c0);
        g.addColorStop(1, L.c1);
        ctx.globalAlpha = a * 0.85;
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.arc(cx, cy, r, 0, TAU);
        ctx.fill();

            ctx,
            L.label,
            cx,
            cy + r * 0.62,
            { color: "#f2e4c2", align: "center", alpha: (a - 0.4) * 1.3 }

      cv.width = S;
      cv.height = S;

      ctx.globalAlpha = 1;
      for (const [rr, col, a] of [[0.3, "255,224,170", 0.16], [0.17, "255,238,200", 0.24], [0.075, "255,252,236", 0.5]]) {

        g.addColorStop(0, `rgba(${col},${a})`);
        g.addColorStop(0.5, `rgba(${col},${a * 0.5})`);
        g.addColorStop(1, `rgba(${col},0)`);

        ctx.beginPath();
        ctx.arc(0, 0, RG * rr, 0, TAU);
        ctx.fill();

      for (let i = 0; i < 2200; i++) {

      ctx.save();
      ctx.translate(R, R);
      for (let i = 0; i < 900; i++) {
        const a = rng4() * TAU, r = Math.pow(rng4(), 0.7) * R * 0.95;

      }
      for (let i = 0; i < 9; i++) {
        const a = rng4() * TAU, r = (0.35 + rng4() * 0.55) * R;
        const x = Math.cos(a) * r, y = Math.sin(a) * r * 0.8;
        const g = ctx.createRadialGradient(x, y, 0, x, y, R * 0.035);
        g.addColorStop(0, "rgba(255,240,210,0.35)");
        g.addColorStop(1, "rgba(255,220,180,0)");
        ctx.globalAlpha = 1;
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.arc(x, y, R * 0.035, 0, TAU);
        ctx.fill();
      }
      ctx.restore();
      for (const c of [
        { x: 0.14, y: 0.74, r: 0.5, c: "118,58,168" },
        { x: 0.86, y: 0.78, r: 0.4, c: "28,108,158" },
        { x: 0.3, y: 0.12, r: 0.34, c: "178,66,108" },
        { x: 0.92, y: 0.24, r: 0.3, c: "58,150,148" }

        const cx = c.x * S, cy = c.y * S, r = c.r * S * 0.5;

        g.addColorStop(0.4, `rgba(${c.c},0.08)`);
        g.addColorStop(1, "rgba(0,0,0,0)");

        ctx.fillStyle = g;

        ctx.arc(cx, cy, r, 0, TAU);
        ctx.fill();
      }

    }

      ctx.fillStyle = "#03040a";
      ctx.fillRect(0, 0, vw, vh);
      const S = plate.width;

      ctx.translate(vw * 0.8 - this.cam.x * 0.012, vh * 0.22 - this.cam.y * 0.012);
      ctx.rotate(this.t * 45e-4);

          const h1 = Math.sin(i * 12.9898 + layer * 3.7) * 43758.5453;
          const h2 = Math.sin(i * 78.233 + layer * 1.3) * 43758.5453;
          const sx = (((h1 - Math.floor(h1)) * vw - this.cam.x * par) % vw + vw) % vw;
          const sy = (((h2 - Math.floor(h2)) * vh - this.cam.y * par) % vh + vh) % vh;
          const tw = 0.4 + 0.6 * Math.sin(this.t * (0.5 + layer * 0.4) + i * 1.7);

            ctx.fillRect(X - 2, Y, 5, 1);

        const r1 = (Math.sin(seed * 91.17) * 43758.5 % 1 + 1) % 1;
        const r2 = (Math.sin(seed * 33.71) * 24634.1 % 1 + 1) % 1;
        const k = ph / 0.1;
        const x0 = r1 * vw, y0 = r2 * vh * 0.5;

    // -- the animal -----------------------------------------------------------

        y: vh / 2 + (y - this.cam.y) * this.cam.z

    }
    /**
     * The body you are standing in. Not a drawing of a crab: the crab. The same

     * around in - every leg joint, both claws, the eyestalks, the shell.

     * inside it as a ghost, so you can see your own plating through yourself.

        k: kk,
        x,
        y,
        w,

      }

    }
    // -- the tree itself ------------------------------------------------------

      }
      const maxTier = Math.max(-1, ...Object.values(deepest));

        const lv = this.armLevel(arm.id);
        const d = armDir(arm.deg);
        const a = this._S(d.x * (R_GENE + 26), d.y * (R_GENE + 26), vw, vh);
        let reach = R_TIER[0] + 40;
        let far = R_GENE + 40;
        for (const n of this.L.nodes) {
          if (n.arm !== arm.id) continue;
          if ((this.seen[n.id] ?? 0) < 0.4) continue;
          const dd = Math.hypot(n.x, n.y);
          reach = Math.max(reach, dd + 70);
          far = Math.max(far, dd + 18);
        }
        const b = this._S(d.x * reach, d.y * reach, vw, vh);
        ctx.lineCap = "round";
        ctx.globalAlpha = fade * 0.3;
        ctx.strokeStyle = "rgba(4,7,12,0.9)";
        ctx.lineWidth = Math.max(2, 13 * z);
        ctx.beginPath();
        ctx.moveTo(a.x, a.y);
        ctx.lineTo(b.x, b.y);
        ctx.stroke();
        const gr = ctx.createLinearGradient(a.x, a.y, b.x, b.y);
        gr.addColorStop(0, arm.colour);
        gr.addColorStop(1, "rgba(255,255,255,0)");
        ctx.globalAlpha = fade * (0.14 + lv * 0.26);
        ctx.strokeStyle = gr;
        ctx.lineWidth = Math.max(1, 9 * z);
        ctx.beginPath();
        ctx.moveTo(a.x, a.y);
        ctx.lineTo(b.x, b.y);
        ctx.stroke();

        const lp = this._S(d.x * far + px2 * 124, d.y * far + py2 * 124, vw, vh);

          const nw = textWidth(arm.name);
          ctx.globalAlpha = fade * 0.62;
          ctx.fillStyle = "rgba(4,7,11,0.78)";
          ctx.fillRect(Math.round(lp.x - nw / 2) - 4, Math.round(lp.y) - 10, nw + 8, 19);
          ctx.globalAlpha = fade * (0.24 + lv * 0.3);
          ctx.strokeStyle = arm.colour;
          ctx.lineWidth = 1;
          ctx.strokeRect(Math.round(lp.x - nw / 2) - 3.5, Math.round(lp.y) - 9.5, nw + 7, 18);
          ctx.globalAlpha = fade * (0.62 + lv * 0.38);
          drawText(ctx, arm.name, lp.x, lp.y - 7, { color: arm.colour, align: "center" });

          ctx.globalAlpha = fade * 0.32;
          ctx.fillStyle = "rgba(8,12,16,0.9)";
          ctx.fillRect(bx - 1, by - 1, bw + 2, 4);
          ctx.fillStyle = "rgba(150,170,175,0.45)";
          ctx.fillRect(bx, by, bw, 2);
          ctx.globalAlpha = fade * (0.55 + lv * 0.45);
          ctx.fillStyle = arm.colour;
          ctx.fillRect(bx, by, Math.max(lv > 0 ? 1 : 0, Math.round(bw * lv)), 2);

      for (const sp of this.spores) {
        const a = sp.a + this.t * sp.sp * 0.12;
        const r = sp.r + Math.sin(this.t * 0.5 + sp.p) * sp.rise;
        const p = this._S(Math.cos(a) * r, Math.sin(a) * r * 0.86, vw, vh);

        ctx.globalAlpha = fade * (0.12 + 0.16 * (0.5 + 0.5 * Math.sin(this.t * 1.4 + sp.p)));
        ctx.fillStyle = sp.c;
        ctx.fillRect(Math.round(p.x), Math.round(p.y), 1, 1);

      ctx.globalAlpha = fade;
    }
    _linkPath(ln, vw, vh) {
      const a = this.L.by[ln.from], b = this.L.by[ln.to];
      if (!a || !b) return null;
      const pa = this._toScreen(a, vw, vh), pb = this._toScreen(b, vw, vh);
      const mx = (pa.x + pb.x) / 2, my = (pa.y + pb.y) / 2;
      const nx = -(pb.y - pa.y), ny = pb.x - pa.x;
      const l = Math.hypot(nx, ny) || 1;
      const bow = (b.data && b.data.y ? b.data.y : 0) * 10 * this.cam.z;
      return { pa, pb, mx: mx + nx / l * bow, my: my + ny / l * bow };
    }
    /**
     * The connections. A grown one is a cord: a dark bed, the arm's colour laid
     * into it, a bright filament down the middle and something running out
     * along it, always away from the seed. An ungrown one is a dashed lead with
     * a chevron at the end, so an unbought choice still reads as a choice.
     */
    _drawLinks(ctx, vw, vh, fade) {
      const z = this.cam.z;
      for (const ln of this.L.links) {
        const child = this.L.by[ln.to];
        const seen = this.seen[child.id] ?? 0;
        if (seen < 0.03) continue;
        const g = this.grow[child.id] ?? 0;
        const path = this._linkPath(ln, vw, vh);
        if (!path) continue;
        const { pa, pb, mx, my } = path;
        const colour = (ARM_BY_ID[ln.arm] || {}).colour || "#c9e08a";
        const steps = 18;
        const pts = [];
        for (let i = 0; i <= steps; i++) pts.push(curveAt(pa, pb, mx, my, i / steps * Math.max(0.06, g > 0.5 ? 1 : seen)));
        const trace = () => {
          ctx.beginPath();
          pts.forEach((p, i) => i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y));
        };
        const w = Math.max(1.6, ln.w * z * lerp(0.55, 1, g));
        ctx.lineCap = "round";
        ctx.lineJoin = "round";
        if (g > 0.35) {
          ctx.globalAlpha = fade * g;
          trace();
          ctx.strokeStyle = "rgba(4,6,11,0.92)";
          ctx.lineWidth = w + 4 * z + 1.5;
          ctx.stroke();
          trace();
          ctx.strokeStyle = colour;
          ctx.lineWidth = w;
          ctx.stroke();
          ctx.globalAlpha = fade * g * 0.55;
          trace();
          ctx.strokeStyle = "rgba(255,255,255,0.85)";
          ctx.lineWidth = Math.max(1, w * 0.26);
          ctx.stroke();
          for (let k = 0; k < 2; k++) {
            const flow = (this.t * 0.3 + ln.w * 0.13 + k * 0.5) % 1;
            const bead = curveAt(pa, pb, mx, my, flow);
            const rad = Math.max(2, w * 2.4);
            ctx.globalAlpha = fade * g * (0.3 + 0.25 * Math.sin(flow * Math.PI));
            const gg = ctx.createRadialGradient(bead.x, bead.y, 0, bead.x, bead.y, rad);
            gg.addColorStop(0, "#ffffff");
            gg.addColorStop(0.35, colour);
            gg.addColorStop(1, "rgba(0,0,0,0)");
            ctx.fillStyle = gg;
            ctx.beginPath();
            ctx.arc(bead.x, bead.y, rad, 0, TAU);
            ctx.fill();
          }
        } else {
          ctx.globalAlpha = fade * seen * (0.45 + 0.18 * Math.sin(this.t * 2.2 + pb.x * 0.01));
          ctx.setLineDash([4 * z + 1, 4 * z + 2]);
          ctx.lineDashOffset = -this.t * 16 * z;
          trace();
          ctx.strokeStyle = "rgba(176,196,206,0.75)";
          ctx.lineWidth = Math.max(1, w * 0.65);
          ctx.stroke();
          ctx.setLineDash([]);
          const p1 = pts[pts.length - 1], p0 = pts[pts.length - 3] || pts[0];
          const an = Math.atan2(p1.y - p0.y, p1.x - p0.x);
          const L = Math.max(3, 5 * z);
          ctx.beginPath();
          ctx.moveTo(p1.x - Math.cos(an - 0.5) * L, p1.y - Math.sin(an - 0.5) * L);
          ctx.lineTo(p1.x, p1.y);
          ctx.lineTo(p1.x - Math.cos(an + 0.5) * L, p1.y - Math.sin(an + 0.5) * L);
          ctx.strokeStyle = "rgba(210,230,238,0.8)";
          ctx.lineWidth = 1;
          ctx.stroke();
        }
        ctx.globalAlpha = fade;
      }
    }
    /** The organ at the end of each arm, which is what the arm is growing. */
    _drawOrgans(ctx, vw, vh, fade) {
      const z = this.cam.z;
      const beat = Math.pow(1 - Math.abs(this.beat * 2 - 1), 3);
      for (const arm of ARMS) {
        if (arm.id === "form") continue;
        const lv = this.armLevel(arm.id);
        if (lv <= 1e-3) continue;
        const d = armDir(arm.deg);
        let reach = R_TIER[0];
        for (const n of this.L.nodes) {
          if (n.arm !== arm.id) continue;
          if ((this.seen[n.id] ?? 0) < 0.4) continue;
          reach = Math.max(reach, Math.hypot(n.x, n.y));
        }
        const p = this._S(d.x * (reach + ORGAN_GAP), d.y * (reach + ORGAN_GAP), vw, vh);
        if (p.x < -200 || p.x > vw + 200 || p.y < -200 || p.y > vh + 200) continue;
        const art = organArt(arm.organ, clamp(z * 1.4, 0.3, 2), lv);
        let sx = 1, sy = 1, glow = 0.08 + lv * 0.2;
        if (arm.organ === "heart") {
          const k = 1 + beat * 0.12;
          sx = k;
          sy = k;
          glow += beat * 0.3;
        }
        if (arm.organ === "spring") {
          sy = 1 + Math.sin(this.t * 1.1) * 0.03;
          sx = 1 - Math.sin(this.t * 1.1) * 0.02;
        }
        if (arm.organ === "gut") {
          sx = 1 + Math.sin(this.t * 0.8) * 0.02;
          sy = 1 + Math.sin(this.t * 0.8 + 1.7) * 0.02;
        }
        if (arm.organ === "ganglion") {
          const fire = Math.pow(0.5 + 0.5 * Math.sin(this.t * 3.1), 6);
          glow += fire * lv * 0.5;
          sx = sy = 1 + fire * 0.03;
        }
        ctx.globalAlpha = fade * glow * 0.5;
        const gg = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, art.cv.width * 0.7);
        gg.addColorStop(0, arm.colour);
        gg.addColorStop(1, "rgba(0,0,0,0)");
        ctx.fillStyle = gg;
        ctx.beginPath();
        ctx.arc(p.x, p.y, art.cv.width * 0.7, 0, TAU);
        ctx.fill();
        ctx.globalAlpha = fade * (0.4 + lv * 0.6);
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.scale(sx, sy);
        ctx.drawImage(art.cv, -art.ox, -art.oy);
        ctx.restore();
      }
      ctx.globalAlpha = fade;
    }
    // -- nodes ----------------------------------------------------------------
    _drawNodes(ctx, vw, vh, fade) {
      const i = this.game.input;
      const z = this.cam.z;
      let hover = null;
      for (const n of this.L.nodes) {
        if (n.kind !== "gene") continue;
        const p = this._toScreen(n, vw, vh);
        const on = this.owned(n);
        const r = n.r * z;
        if (r < 1.2) continue;
        const hot = Math.hypot(i.sx - p.x, i.sy - p.y) < r + 5;
        ctx.globalAlpha = fade * (on ? 0.9 : 0.3);
        if (on) {
          const gg = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, r * 3);
          gg.addColorStop(0, "rgba(127,224,200,0.55)");
          gg.addColorStop(1, "rgba(127,224,200,0)");

          ctx.beginPath();
          ctx.arc(p.x, p.y, r * 3, 0, TAU);
          ctx.fill();

        ctx.beginPath();
        ctx.arc(p.x, p.y, r, 0, TAU);
        ctx.fill();
        ctx.strokeStyle = on ? "rgba(230,255,246,0.7)" : "rgba(120,150,145,0.4)";
        ctx.lineWidth = 1;
        ctx.stroke();
        if (hot) hover = { n, p };
        ctx.globalAlpha = fade;

        if (n.kind === "gene") continue;
        const seen = this.seen[n.id] ?? 0;
        if (seen < 0.05) continue;
        const p = this._toScreen(n, vw, vh);
        const rr = n.r * z * lerp(0.6, 1, seen);
        if (p.x < -80 || p.x > vw + 80 || p.y < -80 || p.y > vh + 80) continue;
        if (n.kind === "seed") {
          const art2 = organArt("seed", clamp(z * 1.6, 0.4, 2.4), clamp01(this.game.economy.genes.size / 8));
          const b = 1 + Math.sin(this.t * 1.6) * 0.04;
          ctx.globalAlpha = fade * 0.5;
          const gg2 = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, rr * 4);
          gg2.addColorStop(0, "rgba(168,232,120,0.4)");
          gg2.addColorStop(1, "rgba(168,232,120,0)");
          ctx.fillStyle = gg2;
          ctx.beginPath();
          ctx.arc(p.x, p.y, rr * 4, 0, TAU);
          ctx.fill();
          ctx.globalAlpha = fade;
          ctx.save();
          ctx.translate(p.x, p.y);
          ctx.scale(b, b);
          ctx.drawImage(art2.cv, -art2.ox, -art2.oy);
          ctx.restore();

        const on = st === "owned";

        const hot = Math.hypot(i.sx - p.x, i.sy - p.y) < rr + 7;
        if (hot) hover = { n, p };
        const pulse = ready ? 0.5 + Math.sin(this.t * 3) * 0.5 : 0;
        const arm = ARM_BY_ID[n.arm] || {};
        const grown = this.grow[n.id] ?? 0;
        ctx.globalAlpha = fade * seen * (on ? 0.4 : ready ? 0.2 + pulse * 0.34 : 0.14);
        const gg = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, rr * 2.8);
        gg.addColorStop(0, on || ready ? n.color : "#7a8a90");
        gg.addColorStop(0.45, on || ready ? n.color : "#5a6a70");
        gg.addColorStop(1, "rgba(0,0,0,0)");
        ctx.fillStyle = gg;
        ctx.beginPath();
        ctx.arc(p.x, p.y, rr * 2.8, 0, TAU);
        ctx.fill();
        ctx.globalAlpha = fade * seen * 0.85;
        ctx.fillStyle = "rgba(5,8,12,0.85)";
        ctx.beginPath();
        ctx.arc(p.x, p.y, rr + 2.5 * z + 1, 0, TAU);
        ctx.fill();
        ctx.globalAlpha = fade * seen;
        const art = orbArt(n.color, rr * (on ? 1 : 0.86), on);
        ctx.save();

            ico,
            p.x,
            p.y,
            on ? "rgba(10,13,10,0.86)" : ready ? "rgba(246,242,226,0.92)" : "rgba(176,186,190,0.55)",

        }

          ctx.strokeStyle = n.color;

          ctx.stroke();

              const a2 = this.t * 0.7 + k / 3 * TAU + n.x * 0.01;
              const sx = p.x + Math.cos(a2) * (rr + 3.5 * z);
              const sy = p.y + Math.sin(a2) * (rr + 3.5 * z);

              ctx.fillStyle = "#f6fff0";
              ctx.fillRect(Math.round(sx), Math.round(sy), 1, 1);
            }
          }
        } else if (rr > 6) {
          const c = Math.max(1, this.cost(n));
          const k = clamp01(this.game.economy.nutrients / c);
          ctx.globalAlpha = fade * seen * 0.3;
          ctx.strokeStyle = "rgba(170,186,190,0.8)";
          ctx.lineWidth = Math.max(1, 1.6 * z);
          ctx.beginPath();
          ctx.arc(p.x, p.y, rr + 3.5 * z, 0, TAU);
          ctx.stroke();
          ctx.globalAlpha = fade * seen * (ready ? 0.95 : 0.7);
          ctx.strokeStyle = ready ? "#d8f0a4" : "#e2b74a";
          ctx.beginPath();
          ctx.arc(p.x, p.y, rr + 3.5 * z, -Math.PI / 2, -Math.PI / 2 + TAU * k);
          ctx.stroke();
        }
        if (n.big) {
          ctx.globalAlpha = fade * seen * (on ? 0.5 : 0.3);
          ctx.strokeStyle = on ? n.color : "rgba(180,190,190,0.6)";
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.arc(p.x, p.y, rr + 7.5 * z, 0, TAU);
          ctx.stroke();
          if (on) {
            for (let k = 0; k < 4; k++) {
              const a2 = -this.t * 0.35 + k / 4 * TAU;
              const sx = p.x + Math.cos(a2) * (rr + 7.5 * z);
              const sy = p.y + Math.sin(a2) * (rr + 7.5 * z);
              ctx.globalAlpha = fade * 0.7;
              ctx.fillStyle = n.color;
              ctx.fillRect(Math.round(sx) - 1, Math.round(sy) - 1, 2, 2);

          ctx.lineWidth = 1;

          const label = `${c}`;
          const tw = textWidth(label);
          ctx.globalAlpha = fade * seen * 0.8;
          ctx.fillStyle = "rgba(6,9,12,0.8)";
          ctx.fillRect(Math.round(p.x - tw / 2) - 2, Math.round(p.y + rr + 5.5 * z), tw + 4, 9);
          ctx.globalAlpha = fade * seen;
          drawText(ctx, label, p.x, p.y + rr + 6.5 * z, {
            color: ready ? "#dff0a8" : costly ? "#e08c9c" : "rgba(200,206,206,0.7)",
            align: "center"

        }
        if (n.big && (on || ready) && z > 0.45) {
          drawText(
            ctx,
            n.data.name,
            p.x,
            p.y - rr - 13 * z - 4,
            { color: arm.colour || n.color, align: "center", alpha: fade * 0.85 }
          );
        }
        if (on && this._hasMore(n) && z > 0.3) {
          const d = armDir(arm.deg ?? 0);
          const s2 = this._S(n.x + d.x * 52, n.y + d.y * 52, vw, vh);
          ctx.globalAlpha = fade * (0.22 + 0.2 * Math.sin(this.t * 2 + n.x));
          ctx.strokeStyle = n.color;
          ctx.lineWidth = Math.max(1, 2 * z);
          ctx.setLineDash([3, 3]);
          ctx.beginPath();
          ctx.moveTo(p.x, p.y);
          ctx.lineTo(s2.x, s2.y);
          ctx.stroke();
          ctx.setLineDash([]);
          ctx.globalAlpha = fade;
        }
        if (hot && i.clicked) {
          i.clicked = false;
          this._buy(n);
        }
      }
      ctx.globalAlpha = fade;
      return hover;
    }
    _drawPulses(ctx, vw, vh) {
      for (const p of this.pulses) {
        const path = this._linkPath(p.ln, vw, vh);
        if (!path) continue;
        const t = clamp01(p.t);
        const c = curveAt(path.pa, path.pb, path.mx, path.my, t);
        const a = Math.sin(t * Math.PI);
        const r = Math.max(2, 4 * this.cam.z) * (0.6 + a * 0.7);
        const g = ctx.createRadialGradient(c.x, c.y, 0, c.x, c.y, r * 3.6);
        g.addColorStop(0, `rgba(255,250,232,${0.95 * a})`);
        g.addColorStop(0.35, `rgba(150,236,180,${0.5 * a})`);
        g.addColorStop(1, "rgba(120,220,180,0)");
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.arc(c.x, c.y, r * 3.6, 0, TAU);
        ctx.fill();
        ctx.fillStyle = `rgba(255,255,255,${0.9 * a})`;
        ctx.beginPath();
        ctx.arc(c.x, c.y, r * 0.6, 0, TAU);
        ctx.fill();

        const rad = lerp(R.r0, R.r1, easeOutCubic(t)) * this.cam.z;
        const a = 1 - t;
        ctx.globalAlpha = a * a * 0.9;
        ctx.strokeStyle = R.color;
        ctx.lineWidth = Math.max(1, 3 * (1 - t) * this.cam.z);
        ctx.beginPath();
        ctx.arc(p.x, p.y, rad, 0, TAU);

        ctx.globalAlpha = a * a * 0.4;
        ctx.strokeStyle = "#ffffff";
        ctx.lineWidth = 1;

    // -- chrome ---------------------------------------------------------------
    _drawChrome(ctx, vw, vh, fade, hover) {

      const total = EVOLUTIONS.length + SKILLS.length;
      const open = e.evolutions.size + e.skills.size;
      ctx.fillStyle = "rgba(6,8,12,0.80)";
      ctx.fillRect(0, 0, vw, 20);
      ctx.fillStyle = "rgba(150,208,220,0.18)";
      ctx.fillRect(0, 20, vw, 1);
      const done = clamp01(open / Math.max(1, total));
      const grad = ctx.createLinearGradient(0, 0, vw * done, 0);
      grad.addColorStop(0, "#5fc6d8");
      grad.addColorStop(0.5, "#8cc468");
      grad.addColorStop(1, "#e2d07a");
      ctx.fillStyle = grad;
      ctx.fillRect(0, 20, Math.round(vw * done), 1);
      drawText(ctx, "YOUR GENOME", 6, 3, { color: "#cfe8d8" });

        this.selected = null;
      }
    }
    // -- drawing --------------------------------------------------------------
    draw(ctx, r) {
      this.hover = null;
      this.buttons.length = 0;
      this.stickZone = null;
      const W = r.vw, H = r.vh;
      if (this.tree.diving || this.tree.dive > 0.01) {
        this.tree.draw(ctx, W, H);
        if (this.tree.dive > 0.14) return;
      }
      this._hud(ctx, W, H);
      if (this.build > 5e-3) this._buildRail(ctx, W, H);
      if (this.placing) this._placingHud(ctx, W, H);
      if (this.drawer > 5e-3) this._panel(ctx, W, H);
      else if (this.touchEnabled) this._touchControls(ctx, W, H);
      if (this.toast) {
        const lines = wrapText(this.toast, Math.min(220, W - (this.touchEnabled ? 96 : 40)));
        const w = Math.max(...lines.map((l) => textWidth(l))) + 4;
        const y = this.touchEnabled ? Math.round(H * 0.3) : H - 46 - (lines.length - 1) * LINE_H;
        lines.forEach((l, i) => drawText(
          ctx,
          l,
          W / 2,
          y + i * LINE_H,
          { color: INK, align: "center", outline: true, outlineColor: OUT }
        ));
      }
      if (this.drag) this._drawCarried(ctx, W, H);
      if (this.hover && !this.drag) this._tooltip(ctx, W, H);
    }
    /** The thing in your claw while you are carrying it to a bed. */
    _drawCarried(ctx, W, H) {
      const g = this.game;
      const d = this.drag;
      const i = g.input;
      const def3 = d.kind === "flora" ? FLORA_BY_ID[d.id] : BUILD_BY_ID[d.id];
      if (!def3) return;
      const art = d.kind === "flora" ? buildPlant(def3, 0, 0, Math.min(1, 20 / Math.max(10, def3.h))) : buildStructure(def3, 0.5);
      const bob = Math.sin(this.t * 9) * 1.2;
      ctx.globalAlpha = 0.9;
      ctx.drawImage(art.cv, Math.round(i.sx - art.ox), Math.round(i.sy - art.oy + bob));
      ctx.globalAlpha = 1;
      drawText(
        ctx,
        this.ghostPlot ? "let go to plant" : "over a bed",
        i.sx,
        i.sy + 6,
        { color: this.ghostPlot ? "#b6de8f" : FAINT, align: "center", outline: true, outlineColor: OUT }
      );
    }
    // -- HUD ------------------------------------------------------------------
    _hud(ctx, W, H) {
      const g = this.game;
      const e = g.economy;
      const maxW = e.stat("waterMax");
      const L = this.buildOn ? this.railW(W) + 6 : 5;
      if (this.buildOn && W < 320) {
        drawText(
          ctx,
          `${Math.round(e.water)} water   ${Math.round(e.nutrients)} growth`,
          W - 5,
          4,
          { color: INK, align: "right", outline: true, outlineColor: OUT }
        );
        this._pumpStub(ctx, W, H);
        return;
      }
      const sh = drawShell(ctx, L, 4, e.water / maxW, this.t);
      drawText(
        ctx,
        `${Math.round(e.water)}`,
        L + sh.w / 2,
        4 + sh.h - 1,
        { color: INK, align: "center", outline: true, outlineColor: OUT }
      );
      if (this._hit(L, 4, sh.w, sh.h)) this.hover = { title: "Spring", body: `${Math.round(e.water)} of ${Math.round(maxW)} water. Hold space to run it.` };
      const stage = clamp(Math.round(Math.pow(clamp01(this.bloomShown / 260), 0.62) * 8), 0, 8);
      const sway = Math.sin(this.t * 1.1) * 0.04 + (g.weather ? g.weather.windSpeed * 0.02 : 0);
      const bx = L + sh.w + 2;
      drawBloom(ctx, bx, 2, stage, sway);
      drawText(
        ctx,
        `${Math.round(e.nutrients)}`,
        bx + 17,
        4 + sh.h - 1,
        { color: INK, align: "center", outline: true, outlineColor: OUT }
      );
      if (this._hit(bx, 2, 34, 40)) {
        this.hover = { title: "Growth", body: `${Math.round(e.nutrients)} nutrients. The flower opens as you bank them and drops a leaf when you spend.` };
      }
      if (e.parasites > 0) {
        const px2 = L + 1, py2 = 78;
        const pulse = 0.7 + Math.sin(this.t * 2.2) * 0.3;
        ctx.globalAlpha = pulse;
        drawGlyph(ctx, "seed", px2, py2, { color: "#c98ade" });
        ctx.globalAlpha = 1;
        drawText(
          ctx,
          `${e.parasites}   X`,
          px2 + 15,
          py2 + 3,
          { color: "#d79ae8", outline: true, outlineColor: OUT }
        );
        if (this._hit(px2, py2, 60, 12)) {
          this.hover = {
            title: "Parasites",
            body: "Fruited by a mindcap. Get close to an animal and press X to put one on it. What it takes over, you steer."
          };
        }
      }
      const fx = bx + 34;
      drawSprig(ctx, fx, 16, e.berries);
      drawText(
        ctx,
        `${e.berries}`,
        fx + 13,
        4 + sh.h - 1,
        { color: INK, align: "center", outline: true, outlineColor: OUT }
      );
      if (this._hit(fx, 16, 26, 22)) this.hover = { title: "Fruit", body: "What your mature plants set. Animals will come a long way for it." };
      const narrow = W < 320;
      const room = W - (L + 96) - 10;
      const label = narrow ? ellipsize(g.biome.name, Math.max(40, room)) : `${g.biome.name}   ${g.weather.label()}`;
      drawText(ctx, label, W - 6, 5, { color: DIM, align: "right", outline: true, outlineColor: OUT });
      this._clock(ctx, W - 15, narrow ? 22 : 25);
      if (!narrow) this._compass(ctx, W, H);
      const ox = W - 32, oy = narrow ? 42 : 48;
      const ready = this._treeReady();
      drawOrb(ctx, ox, oy, this.t, ready ? 0.5 + Math.sin(this.t * 3) * 0.5 : 0);
      drawText(
        ctx,
        `${e.genes.size}`,
        ox + 15,
        oy + 32,
        { color: "#9fe8d4", align: "center", outline: true, outlineColor: OUT }
      );
      if (this._hit(ox, oy, 30, 30)) {
        this.hover = { title: "Genome", body: `${e.genes.size} genes expressed. Look into it to see the Tree of Life.${ready ? " Something is ready to grow." : ""}` };
        if (g.input.clicked) {
          g.input.clicked = false;
          this._openTree();
        }
      }
      const fleet = g.wildlife.fleet;
      if (fleet.length) {
        for (let i = 0; i < Math.min(9, fleet.length); i++) {
          const c = fleet[i];
          const cx = W - 8 - (i + 1) * 8, cy = oy + 32;
          ctx.fillStyle = c === this.selected ? "#ffe9a8" : c.onShell ? "rgba(140,196,104,0.95)" : "rgba(226,183,74,0.9)";
          ctx.fillRect(cx, cy, 6, 6);
          ctx.strokeStyle = OUT;
          ctx.strokeRect(cx - 0.5, cy - 0.5, 7, 7);
          if (this._hit(cx, cy, 6, 6)) this.hover = { title: c.name, body: c.def.ability || c.def.desc };
        }
      }
      const gd = g.garden;
      const load = gd.load, cap = gd.capacity, trim = gd.trim;
      const bx0 = L + 1, by0 = 50;
      if (!this.buildOn) {
        drawGlyph(ctx, "scale", bx0, by0 - 1, {
          color: gd.overload > 0 ? "#e08c9c" : gd.listed ? "#e2b74a" : "#d6ba8a"
        });
        drawGauge(
          ctx,
          bx0 + 15,
          by0 + 1,
          42,
          4,
          load / Math.max(1, cap),
          gd.overload > 0 ? "#c8425c" : load > cap * 0.8 ? "#e2b74a" : "#8cc468"
        );
        const tw = 42, tx = bx0 + 15;
        ctx.fillStyle = "rgba(12,8,5,0.7)";
        ctx.fillRect(tx - 1, by0 + 6, tw + 2, 4);
        ctx.fillStyle = "rgba(90,72,48,0.9)";
        ctx.fillRect(tx, by0 + 7, tw, 2);
        ctx.fillStyle = gd.listed ? "#e2b74a" : "#d6ba8a";
        ctx.fillRect(Math.round(tx + tw / 2 + trim * tw * 0.5) - 1, by0 + 5, 2, 6);
        ctx.fillStyle = "rgba(242,228,194,0.4)";
        ctx.fillRect(Math.round(tx + tw / 2), by0 + 6, 1, 4);
        if (this._hit(bx0, by0 - 2, 60, 14)) {
          this.hover = {
            title: "Balance",
            body: `Carrying ${load.toFixed(1)} of ${cap.toFixed(1)}.
` + (gd.overload > 0 ? "Overloaded: everything grows slower and you walk slower.\n" : "") + (gd.listed ? `Listing ${trim > 0 ? "right" : "left"}. Whatever is stacked on the heavy side is suffering.` : "Evenly loaded.")
          };
        }
      }
      const ripe = gd.ripeCount;
      if (ripe) {
        const rx0 = bx0, ry0 = by0 + 14;
        const pulse = 0.6 + Math.sin(this.t * 3.2) * 0.4;
        ctx.globalAlpha = 0.7 + pulse * 0.3;
        drawGlyph(ctx, "hand", rx0, ry0, { color: "#cfe89a" });
        ctx.globalAlpha = 1;
        drawText(
          ctx,
          `${ripe} ready   R`,
          rx0 + 15,
          ry0 + 3,
          { color: "#cfe89a", outline: true, outlineColor: OUT }
        );
        if (this._hit(rx0, ry0, 70, 12)) {
          this.hover = { title: "Ready to pick", body: "Nothing pays out on its own. Press R, or tap the bead over a plant." };
          if (g.input.clicked) {
            g.input.clicked = false;
            g.harvestAll();
          }
        }
      }
      if (!this.buildOn) this._pumpButton(ctx, W, H);
      else this.valveRect = null;
      const crab = g.crab;
      if (crab.hp < crab.hpMax) {
        const w = 54, x = 6, y = H - 10;
        ctx.fillStyle = "rgba(20,10,8,0.6)";
        ctx.fillRect(x, y, w, 4);
        ctx.fillStyle = crab.hp > crab.hpMax * 0.35 ? "#c8425c" : "#e2564f";
        ctx.fillRect(x, y, Math.round(w * (crab.hp / crab.hpMax)), 4);
      }
      const modeDef = MODES.find((m) => m.id === this.mode);
      if (this.buildOn) return;
      if (this.touchEnabled) return;
      drawText(ctx, modeDef.name, 6, H - 20, { color: FAINT, outline: true, outlineColor: OUT });
      if (this._hit(4, H - 22, 34, 10)) {
        this.hover = { title: modeDef.name, body: modeDef.desc + "   (M to switch)" };
        if (this.game.input.clicked) {
          this.game.input.clicked = false;
          this.cycleMode();
        }
      }
      const hint = g.actionHint();
      if (hint && !this.touchEnabled) {
        drawText(ctx, hint, W / 2, H - 30, { color: INK, align: "center", outline: true, outlineColor: OUT });
      }
      if (!this.touchEnabled) {
        drawText(
          ctx,
          "A/D move   SPACE stroke the spring   R pick   E dig   X parasite   click yourself to build   G inside",
          W / 2,
          H - 10,
          { color: FAINT, align: "center", outline: true, outlineColor: OUT }
        );
      }
      if (this.selected) {
        drawText(
          ctx,
          `${this.selected.name} - click where to send it`,
          W / 2,
          H - 42,
          { color: "#ffe9a8", align: "center", outline: true, outlineColor: OUT }
        );
      }
    }
    /** Nothing but the escape hatch, while the rail owns a narrow screen. */
    _pumpStub(ctx, W, H) {
      if (!this.touchEnabled) return;
      const bw = 62, bh = 24, x = W - bw - 6, y = H - bh - 6;
      this.buttons.push({ x, y, w: bw, h: bh, key: "Escape" });
      ctx.fillStyle = "rgba(46,34,22,0.92)";
      ctx.fillRect(x, y, bw, bh);
      ctx.strokeStyle = "rgba(214,186,138,0.55)";
      ctx.strokeRect(x + 0.5, y + 0.5, bw - 1, bh - 1);
      drawText(ctx, "CLIMB DOWN", x + bw / 2, y + (bh - 7) / 2, { color: INK, align: "center" });
    }
    /**
     * The pump. It is a valve in your own shell, so it is drawn as one, and it
     * behaves like one: every tap is one stroke of the muscle behind it.
     */
    _pumpButton(ctx, W, H) {
      const g = this.game;
      const size = 34;
      const x = W - size - 8, y = H - size - (this.touchEnabled ? 70 : 26);
      const hold = g.pumpHold || 0;
      const hot = this._hit(x, y, size, size);
      const i = g.input;
      this.valveRect = { x, y, w: size, h: size };
      if (this.touchEnabled && g.state === "play" && !this.drawerOpen) {
        this.buttons.push({ x: x - 4, y: y - 4, w: size + 8, h: size + 8, key: " " });
      }
      const live = hot && i.down && !this.drawerOpen && g.state === "play";
      if (live && !this._valveDown) this.valveTapped = true;
      if (hot && i.clicked && g.state === "play" && !this.drawerOpen) {
        i.clicked = false;
        this.valveTapped = true;
      }
      this._valveDown = live;
      this.valveHeld = live;
      if (hot) this.hover = { title: "The spring", body: "Tap on the band. A stroke that lands pushes water; a chain of them pushes a lot more." };
      this.spray = this.spray || [];
      if (hold > 0.05) {
        const n = 2 + Math.floor(hold * 5);
        for (let k = 0; k < n; k++) {
          if (Math.random() > hold * 0.9) continue;
          const a = -Math.PI * (0.3 + Math.random() * 0.4);
          const sp = (26 + Math.random() * 54) * (0.5 + hold);
          this.spray.push({
            x: x + size / 2 + (Math.random() - 0.5) * 8,
            y: y + size / 2,
            vx: Math.cos(a) * sp * (Math.random() < 0.5 ? -1 : 1) * 0.7,
            vy: Math.sin(a) * sp,
            life: 0.55 + Math.random() * 0.55,
            t: 0,
            r: Math.random() < 0.42 ? 3 : 2
          });
        }
      }
      for (let k = this.spray.length - 1; k >= 0; k--) {
        const d = this.spray[k];
        d.t += 1 / 60;
        if (d.t > d.life) {
          this.spray.splice(k, 1);
          continue;
        }
        d.vy += 260 / 60;
        d.x += d.vx / 60;
        d.y += d.vy / 60;
        const a = clamp01(1 - d.t / d.life);
        ctx.globalAlpha = 0.4 + a * 0.6;
        ctx.fillStyle = d.r > 2 ? "#c9f2fa" : "#5fc6d8";
        ctx.fillRect(Math.round(d.x), Math.round(d.y), d.r, d.r + 1);
        ctx.globalAlpha *= 0.45;
        ctx.fillRect(Math.round(d.x - d.vx / 90), Math.round(d.y - d.vy / 90), Math.max(1, d.r - 1), Math.max(1, d.r - 1));
      }
      if (this.spray.length > 240) this.spray.splice(0, this.spray.length - 240);
      ctx.globalAlpha = hot || hold > 0 ? 1 : 0.72;
      drawValve(ctx, x, y, hold, this.t);
      if (hold > 0.05) {
        ctx.globalAlpha = 0.35 + hold * 0.45;
        ctx.strokeStyle = "#9de3ee";
        ctx.lineWidth = Math.max(1, 2 * hold);
        for (const dir of [-1, 1]) {
          ctx.beginPath();
          const jx = x + size / 2, jy = y + size / 2;
          ctx.moveTo(jx, jy);
          ctx.quadraticCurveTo(
            jx + dir * 16 * hold,
            jy - 26 * hold,
            jx + dir * 30 * hold,
            jy - 6 * hold + Math.sin(this.t * 12) * 2
          );
          ctx.stroke();
        }
      }
      if (hold > 0.1) {
        for (let k = 0; k < 5; k++) {
          const ph = (this.t * (1.4 + k * 0.3) + k * 0.7) % 1;
          ctx.globalAlpha = hold * (1 - ph) * 0.7;
          ctx.fillStyle = "#9de3ee";
          ctx.fillRect(Math.round(x + 6 + k * 6), Math.round(y + size * 0.55 + ph * size * 0.5), 1, 2 + k % 2);
        }
        ctx.globalAlpha = Math.min(0.5, hold * 0.5);
        ctx.fillStyle = "#2b7f92";
        const pw = size * (0.4 + hold * 0.7);
        ctx.beginPath();
        ctx.ellipse(x + size / 2, y + size + 3, pw, 2.5, 0, 0, TAU);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
      const e = g.economy;
      const full = e.water >= e.stat("waterMax") - 0.5;
      drawText(ctx, full ? "SPILLING" : "STROKE", x + size / 2, y + size + 1, {
        color: full ? "#9de3ee" : hold > 0 ? "#9de3ee" : FAINT,
        align: "center",
        outline: true,
        outlineColor: OUT
      });
      this._pumpGauge(ctx, W, H, x + size / 2, y - 10);
    }
    /**
     * The stroke gauge. A needle sweeping a bore, and a band where the chamber
     * is actually full. Land a stroke inside it and the spring pushes; land them
     * in a row and it pushes much harder - while the band narrows and the needle
     * speeds up, so a chain is something you have to keep earning.
     */
    _pumpGauge(ctx, W, H, cx, by) {
      const p = this.game.pump;
      if (!p || p.open < 0.01) return;
      const a = clamp01(p.open);
      const w = Math.min(140, Math.max(96, Math.round(W * 0.28)));
      const h = 13;
      const sh = p.shake > 0 ? Math.round(Math.sin(p.shake * 40) * p.shake * 2) : 0;
      const x = Math.round(clamp(cx - w / 2, 4, W - w - 4)) + sh;
      const y = Math.round(by - h);
      ctx.globalAlpha = a;
      ctx.fillStyle = "rgba(10,14,18,0.90)";
      ctx.fillRect(x, y, w, h);
      ctx.strokeStyle = "rgba(150,208,220,0.45)";
      ctx.strokeRect(x + 0.5, y + 0.5, w - 1, h - 1);
      for (let i = 1; i < 8; i++) {
        ctx.fillStyle = "rgba(150,208,220,0.14)";
        ctx.fillRect(Math.round(x + w * i / 8), y + h - 4, 1, 3);
      }
      const half = p.band / 2;
      const b0 = Math.round(x + clamp01(p.centre - half) * w);
      const b1 = Math.round(x + clamp01(p.centre + half) * w);
      const pulse = 0.6 + 0.4 * Math.sin(this.t * 5);
      ctx.globalAlpha = a * 0.35;
      ctx.fillStyle = "#6fbf6a";
      ctx.fillRect(b0, y + 2, b1 - b0, h - 4);
      const c0 = Math.round(x + clamp01(p.centre - half * 0.34) * w);
      const c1 = Math.round(x + clamp01(p.centre + half * 0.34) * w);
      ctx.globalAlpha = a * (0.55 + pulse * 0.3);
      ctx.fillStyle = "#cfe89a";
      ctx.fillRect(c0, y + 2, Math.max(1, c1 - c0), h - 4);
      const nx = Math.round(x + clamp01(p.pos) * w);
      ctx.globalAlpha = a;
      ctx.fillStyle = "#f6fbff";
      ctx.fillRect(nx - 1, y + 1, 2, h - 2);
      ctx.globalAlpha = a * 0.4;
      ctx.fillStyle = "#9de3ee";
      ctx.fillRect(nx - 3, y + 1, 6, h - 2);
      ctx.globalAlpha = a;
      for (let i = 0; i < Math.min(12, p.combo); i++) {
        ctx.fillStyle = i >= 8 ? "#e2d07a" : "#cfe89a";
        ctx.fillRect(x + 1 + i * 5, y + h + 2, 3, 2);
      }
      if (p.combo > 0) {
        drawText(
          ctx,
          `x${p.mult.toFixed(2)}`,
          x + w - 1,
          y - 9,
          { color: "#cfe89a", align: "right", outline: true, outlineColor: OUT }
        );
      }
      if (p.flash) {
        ctx.globalAlpha = a * clamp01(p.flash.t / 0.7);
        drawText(
          ctx,
          p.flash.text,
          x + w / 2 - 14,
          y - 9,
          { color: p.flash.colour, align: "center", outline: true, outlineColor: OUT }
        );
      }
      ctx.globalAlpha = 1;
    }
    /**
     * The clock. A dial with the sun and the moon actually going round it, the
     * lit part of the day drawn light and the dark part dark, so you can see how
     * long you have before the things that hunt at night come out.
     */
    _clock(ctx, cx, cy) {
      const g = this.game;
      const w = g.weather;
      const R = 9;
      const hour = w.hour;
      const day = Math.floor(w.day ?? 1);
      ctx.save();
      ctx.beginPath();
      ctx.arc(cx, cy, R, 0, TAU);
      ctx.closePath();
      ctx.clip();
      ctx.fillStyle = "rgba(120,158,196,0.55)";
      ctx.fillRect(cx - R, cy - R, R * 2, R);
      ctx.fillStyle = "rgba(26,28,54,0.78)";
      ctx.fillRect(cx - R, cy, R * 2, R);
      ctx.restore();
      ctx.strokeStyle = "rgba(214,186,138,0.6)";
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.arc(cx, cy, R, 0, TAU);
      ctx.stroke();
      ctx.fillStyle = "rgba(214,186,138,0.35)";
      ctx.fillRect(cx - R, Math.round(cy), R * 2, 1);
      const a = (hour - 6) / 24 * TAU;
      const sx = cx + Math.cos(a) * (R - 2.6), sy = cy + Math.sin(a) * (R - 2.6);
      const mx = cx - Math.cos(a) * (R - 2.6), my = cy - Math.sin(a) * (R - 2.6);
      ctx.fillStyle = "rgba(190,190,210,0.85)";
      ctx.beginPath();
      ctx.arc(mx, my, 1.8, 0, TAU);
      ctx.fill();
      ctx.fillStyle = "#ffe9a8";
      ctx.beginPath();
      ctx.arc(sx, sy, 2.4, 0, TAU);
      ctx.fill();
      ctx.fillStyle = "rgba(255,246,196,0.35)";
      ctx.beginPath();
      ctx.arc(sx, sy, 4.2, 0, TAU);
      ctx.fill();
      drawText(
        ctx,
        `DAY ${day}`,
        cx - R - 4,
        cy - 8,
        { color: INK, align: "right", outline: true, outlineColor: OUT }
      );
      drawText(
        ctx,
        `${String(Math.floor(hour)).padStart(2, "0")}:${String(Math.floor(hour % 1 * 60)).padStart(2, "0")}`,
        cx - R - 4,
        cy + 1,
        { color: DIM, align: "right", outline: true, outlineColor: OUT }
      );
      if (this._hit(cx - R - 44, cy - R, R * 2 + 44, R * 2)) {
        const toNight = hour < 20 ? 20 - hour : 24 - hour + 20;
        this.hover = {
          title: `Day ${day}`,
          body: hour >= 20 || hour < 5 ? "Night. Things come up out of the sand at night." : `${toNight.toFixed(1)} hours of light left.`
        };
      }
    }
    /** A mark at the edge of the screen for the next place you have not been. */
    _compass(ctx, W, H) {
      const g = this.game;
      const lm = g.world.nextUnfound(g.crab.x);
      drawText(
        ctx,
        `${g.world.found.size} places found`,
        W - 6,
        38,
        { color: FAINT, align: "right", outline: true, outlineColor: OUT }
      );
      if (!lm) return;
      const d = lm.x - g.crab.x;

          ctx,
          `${Math.round(Math.abs(d) / 10)}`,
          x - dir * 6,
          y + 6,
          { color: FAINT, align: dir > 0 ? "right" : "left", outline: true, outlineColor: OUT }

      } else {

          lm.name,
          x,
          y - 12,
          { color: INK, align: "center", outline: true, outlineColor: OUT }

    _treeReady() {

    // -- placement ------------------------------------------------------------

      for (const plot of g.garden.plots) {
        const pl = plot.plant;
        if (!pl || pl.stage < 3) continue;
        const w = g.garden.plotWorld(plot);
        const s = cam.worldToScreen(w.x, w.y - 9);
        if (s.x < -20 || s.x > g.renderer.vw + 20) continue;
        const ripe = pl.ripe;
        const met = g.garden.needMet(pl.def);
        const hot = Math.hypot(i.sx - s.x, i.sy - s.y) < 12;

          gr.addColorStop(1, "rgba(140,196,104,0)");

          ctx.beginPath();
          ctx.arc(s.x, s.y + bob, r * 3, 0, TAU);
          ctx.fill();
          ctx.fillStyle = hot ? "#f6ffd8" : "#cfe89a";
          ctx.beginPath();
          ctx.arc(s.x, s.y + bob, r, 0, TAU);
          ctx.fill();
          ctx.strokeStyle = "rgba(20,30,10,0.8)";
          ctx.lineWidth = 1;
          ctx.stroke();
          ctx.globalAlpha = 1;
        } else if (cam.zoom > 1.4) {
          ctx.globalAlpha = met ? 0.75 : 0.5;
          drawGauge(ctx, s.x - 6, s.y, 12, 2, ripe, met ? "#8cc468" : "#7a6a52");
          if (!met) {
            ctx.fillStyle = "#e2b74a";
            ctx.fillRect(Math.round(s.x - 1), Math.round(s.y - 5), 2, 3);
            ctx.fillRect(Math.round(s.x - 1), Math.round(s.y - 1), 2, 1);
          }
          ctx.globalAlpha = 1;
        }

    /** Called from the game draw so the ghost sits in the world, not on the HUD. */
    drawGhost(ctx, cam) {
      if (!this.placing) return;
      const g = this.game;
      const crab = g.crab;
      const kind = this.placing.kind;
      const wantWet = kind === "flora" && FLORA_BY_ID[this.placing.id]?.needsPond;
      for (const p of g.garden.plots) {
        if (!p.unlocked) continue;
        const ok = kind === "build" ? !p.wet && !p.plant && !p.build : !p.plant && !p.build && !!p.wet === !!wantWet;
        const wp2 = g.garden.plotWorld(p);
        const s2 = cam.worldToScreen(wp2.x, wp2.y);
        const pulse = 0.5 + Math.sin(this.t * 3 + p.i) * 0.5;
        const r = (2.6 + pulse * 0.8) * cam.zoom;
        ctx.globalAlpha = ok ? 0.55 + pulse * 0.35 : 0.16;
        ctx.strokeStyle = ok ? "#b6de8f" : "#c8425c";
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.ellipse(s2.x, s2.y, r * 1.5, r * 0.7, 0, 0, TAU);
        ctx.stroke();

          ctx.globalAlpha = 0.25 + pulse * 0.25;
          ctx.fillStyle = "#b6de8f";
          ctx.beginPath();
          ctx.ellipse(s2.x, s2.y, r * 1.2, r * 0.55, 0, 0, TAU);
          ctx.fill();
        }
        ctx.globalAlpha = 1;
      }
      const plot = this.ghostPlot;
      if (!plot) return;
      const wp = g.garden.plotWorld(plot);
      const s = cam.worldToScreen(wp.x, wp.y);
      const sp = crab.rig.shellSurface(plot.a, plot.b);
      ctx.save();
      ctx.translate(Math.round(s.x), Math.round(s.y));
      ctx.scale(cam.zoom, cam.zoom);
      ctx.rotate(Math.atan2(sp.nx, -sp.ny) * 0.3);
      const bob = Math.sin(this.t * 4) * 0.6;
      ctx.translate(0, bob);
      ctx.globalAlpha = 0.62 + Math.sin(this.t * 5) * 0.12;

        const art = buildPlant(def3, 3, plot.i % 3, g.garden.plantScale(crab));
        ctx.drawImage(art.cv, -art.ox, -art.oy);

        const art = buildStructure(def3, clamp(crab.m.rx / 52, 0.24, 1.1));
        ctx.drawImage(art.cv, -art.ox, -art.oy);

      ctx.globalAlpha = 1;
      const k = 5 * cam.zoom;
      ctx.strokeStyle = "#f2e4c2";
      ctx.lineWidth = 1;

        ctx.lineTo(s.x + dx * k - dx * k * 0.55, s.y + dy * k);
        ctx.stroke();
      }
    }
    _placingHud(ctx, W, H) {

    // -- the drawer -----------------------------------------------------------
    /**

      const py = Math.round((H - ph) / 2 + (1 - k) * 26);

      ctx.globalAlpha = k;

      const tabW = Math.floor(inW / TABS.length);
      TABS.forEach((t, i) => {
        const tx = inX + i * tabW;
        const on = this.tab === t.id;
        const hot = this._hit(tx, inY, tabW, 20);
        if (on) {
          ctx.fillStyle = "rgba(104,80,48,0.95)";
          ctx.fillRect(tx, inY, tabW - 1, 20);
          ctx.fillStyle = "#d6ba8a";
          ctx.fillRect(tx, inY + 19, tabW - 1, 1);

          ctx.fillRect(tx, inY, tabW - 1, 20);
        }
        ctx.globalAlpha = k * (on ? 1 : 0.62);
        const lw = tabW >= 58 ? textWidth(t.name) : 0;
        const gx = tx + Math.round((tabW - 1 - (18 + (lw ? 2 + lw : 0))) / 2);
        drawTab(ctx, t.icon, gx, inY + 3);
        if (lw) drawText(ctx, t.name, gx + 20, inY + 7, { color: on ? INK : DIM });
        ctx.globalAlpha = k;
        if (hot && this.game.input.clicked) {

          this.tab = t.id;

      ctx.fillStyle = "rgba(0,0,0,0.35)";

      ctx.fillStyle = "rgba(226,204,160,0.14)";

      let row = 0;
      for (const c of all) {
        const by = y + row * (ch + gap) - this.scroll;
        row++;
        if (by > y + h || by + ch < y) continue;
        const on = this.driving === c;
        const puppet = !!c.puppet;
        const hot = this._hit(x, by, w, ch);
        ctx.fillStyle = on ? "rgba(104,80,48,0.95)" : hot ? "rgba(80,62,38,0.95)" : "rgba(44,34,22,0.9)";
        ctx.fillRect(x, by, w, ch);
        ctx.fillStyle = puppet ? "#b46ad0" : c.onShell ? "#8cc468" : "#e2b74a";
        ctx.fillRect(x, by, 2, ch);
        drawText(ctx, ellipsize(c.name, w - 60), x + 6, by + 3, { color: INK });
        drawText(
          ctx,
          puppet ? "RIDDEN" : c.onShell ? "aboard" : "out there",
          x + w - 4,
          by + 3,
          { color: puppet ? "#d79ae8" : c.onShell ? "#b6de8f" : DIM, align: "right" }
        );
        drawText(ctx, ellipsize(c.def.ability || c.def.role || "", w - 8), x + 6, by + 13, { color: FAINT });
        const d = Math.round(Math.abs(c.x - g.crab.x) / 10);
        drawText(ctx, `${d}m away`, x + 6, by + 23, { color: FAINT });
        drawText(
          ctx,
          on ? "DRIVING" : "click to drive",
          x + w - 4,
          by + 23,
          { color: on ? "#ffe9a8" : FAINT, align: "right" }
        );
        if (hot) {
          this.hover = { title: c.name, body: c.def.desc };
          if (g.input.clicked) {
            g.input.clicked = false;
            if (on) this.release();
            else this.drive(c);
          }
        }
      }
      this.scroll = clamp(this.scroll, 0, Math.max(0, row * (ch + gap) - h));
    }
    /**
     * The map. One long strip of the basin with everything you have found on it,
     * because the world is one long strip of the basin.
     */
    _mapTab(ctx, x, y, w, h) {
      const g = this.game;
      const span = 16e3;
      if (this.mapX === null) this.mapX = g.crab.x;
      this.mapX = damp(this.mapX, g.crab.x, 0.02, 1 / 60);
      const cx = x + w / 2;
      const toX = (wx) => cx + (wx - this.mapX) * (w / span);
      ctx.fillStyle = "rgba(14,10,7,0.9)";
      ctx.fillRect(x, y, w, h);
      ctx.fillStyle = "rgba(214,186,138,0.055)";
      for (let ry2 = y + 12; ry2 < y + h; ry2 += 9) ctx.fillRect(x, ry2, w, 1);
      const bandH = 7;
      for (let i = 0; i < w; i += 4) {
        const wx = this.mapX + (i - w / 2) * (span / w);
        const b = biomeAt(wx);
        ctx.fillStyle = b.sky && b.sky[2] || "#8a5f38";
        ctx.globalAlpha = 0.55;
        ctx.fillRect(x + i, y, 4, bandH);
        ctx.globalAlpha = 1;
      }
      ctx.fillStyle = "rgba(214,186,138,0.25)";
      ctx.fillRect(x, y + bandH, w, 1);
      drawText(
        ctx,
        biomeAt(this.mapX).name.toUpperCase(),
        cx,
        y + 1,
        { color: "#f2e4c2", align: "center" }
      );
      const gy = y + Math.round(h * 0.74);
      const here = g.terrain.surfaceY(this.mapX);
      ctx.beginPath();
      ctx.moveTo(x, y + h);
      for (let i = 0; i <= w; i += 2) {
        const wx = this.mapX + (i - w / 2) * (span / w);
        const sy = gy + (g.terrain.surfaceY(wx) - here) * 0.13;
        ctx.lineTo(x + i, clamp(sy, y + bandH + 10, y + h - 2));
      }
      ctx.lineTo(x + w, y + h);
      ctx.closePath();
      ctx.fillStyle = "rgba(112,84,50,0.62)";
      ctx.fill();
      ctx.strokeStyle = "rgba(214,175,112,0.85)";
      ctx.lineWidth = 1;
      ctx.stroke();
      for (let m = Math.floor((this.mapX - span / 2) / 2e3) * 2e3; m < this.mapX + span / 2; m += 2e3) {
        const tx = toX(m);
        if (tx < x + 14 || tx > x + w - 14) continue;
        ctx.fillStyle = "rgba(214,186,138,0.16)";
        ctx.fillRect(Math.round(tx), y + bandH + 2, 1, gy - y - bandH - 2);
        drawText(ctx, `${Math.round(m / 10)}m`, tx, gy + 3, { color: FAINT, align: "center" });
      }
      const marks = g.world.marksNear(this.mapX, span);
      const labelled = [];
      for (const m of marks) {
        const mx = toX(m.x);
        if (mx < x - 6 || mx > x + w + 6) continue;
        const found = g.world.found.has(m.key);
        const col = m.kind === "oasis" ? "#5fc6d8" : m.kind === "ruin" ? "#d6ba8a" : m.kind === "wreck" ? "#c39163" : m.kind === "bonefield" ? "#c8c0ae" : "#e2b74a";
        const mxr = Math.round(mx);
        ctx.globalAlpha = found ? 1 : 0.4;
        ctx.fillStyle = "rgba(20,14,9,0.85)";
        ctx.fillRect(mxr, gy - 15, 1, 15);
        ctx.fillStyle = col;
        switch (m.kind) {
          case "oasis":
            ctx.beginPath();
            ctx.arc(mxr, gy - 18, 3.2, 0, TAU);
            ctx.fill();
            ctx.fillStyle = "rgba(255,255,255,0.5)";
            ctx.fillRect(mxr - 1, gy - 19, 1, 1);
            break;
          case "ruin":
            ctx.fillRect(mxr - 4, gy - 20, 2, 6);
            ctx.fillRect(mxr - 1, gy - 23, 2, 9);
            ctx.fillRect(mxr + 2, gy - 19, 2, 5);
            ctx.fillRect(mxr - 5, gy - 14, 10, 1);
            break;
          case "wreck":
            ctx.fillRect(mxr - 5, gy - 17, 10, 2);
            ctx.fillRect(mxr - 3, gy - 19, 7, 2);
            ctx.fillRect(mxr, gy - 26, 1, 7);
            ctx.fillRect(mxr + 1, gy - 25, 3, 3);
            break;
          case "bonefield":
            ctx.fillRect(mxr - 4, gy - 17, 9, 1);
            ctx.fillRect(mxr - 3, gy - 20, 1, 3);
            ctx.fillRect(mxr, gy - 21, 1, 4);
            ctx.fillRect(mxr + 3, gy - 19, 1, 2);
            break;
          default:
            ctx.fillRect(mxr - 1, gy - 26, 3, 12);
            ctx.fillRect(mxr - 2, gy - 16, 5, 2);
        }
        ctx.globalAlpha = 1;
        const hot = Math.abs(this.game.input.sx - mx) < 8 && this.game.input.sy > gy - 30 && this.game.input.sy < gy + 6;
        if (hot) {
          const d = Math.round(Math.abs(m.x - g.crab.x) / 10);
          this.hover = {
            title: found ? m.name : "Something out there",
            body: found ? `${m.note}
${d}m ${m.x > g.crab.x ? "east" : "west"}` : `${d}m ${m.x > g.crab.x ? "east" : "west"}. You have not stood in it.`
          };
        }
        labelled.push({ mx, col, found, name: m.name, hot });
      }
      let lastX = -1e9;
      for (const L of labelled.sort((p, q) => p.mx - q.mx)) {
        if (!L.hot && L.mx - lastX < 52) continue;
        lastX = L.mx;
        drawText(
          ctx,
          L.found ? L.name : "?",
          L.mx,
          gy - 34,
          { color: L.found ? L.col : "rgba(226,183,74,0.55)", align: "center" }
        );
      }
      const you = toX(g.crab.x);
      ctx.fillStyle = "#f2e4c2";
      ctx.fillRect(Math.round(you) - 2, gy - 9, 5, 2);
      ctx.fillRect(Math.round(you), gy - 7, 1, 7);
      ctx.fillRect(Math.round(you) - 3, gy - 11, 2, 2);
      ctx.fillRect(Math.round(you) + 2, gy - 11, 2, 2);
      drawText(ctx, `${g.world.found.size} places found`, x, y + h - 9, { color: FAINT });
      drawText(
        ctx,
        `${Math.round(g.crab.x / 10)}m from where you woke`,
        x + w,
        y + h - 9,
        { color: FAINT, align: "right" }
      );
    }
    // -- field notes ----------------------------------------------------------
    _codexTab(ctx, x, y, w, h) {
      const g = this.game;
      if (!g.vessClose) {
        const d = Math.round(Math.abs(g.npc.x - g.crab.x) / 10);
        drawText(ctx, "HER NOTEBOOK IS NOT HERE", x, y + 6, { color: "#e2b74a" });
        wrapText(`The field notes are Dr. Vess's, and she is carrying them. Get to her - she is ${d}m ${g.npc.x > g.crab.x ? "east" : "west"} - and read over her shoulder.`, w - 4).forEach((l, i) => drawText(ctx, l, x, y + 20 + i * LINE_H, { color: DIM }));
        wrapText("F calls her over. She will follow you, and ride on you once you are big enough to carry her.", w - 4).forEach((l, i) => drawText(ctx, l, x, y + 62 + i * LINE_H, { color: FAINT }));
        return;
      }
      if (this.codexPick) return this._codexEntry(ctx, x, y, w, h);
      drawText(ctx, "VESS'S FIELD NOTES", x, y, { color: DIM });
      drawText(ctx, "watch a thing for long enough and she writes it down", x, y + 9, { color: FAINT });
      let ry = y + 22 - this.scroll;
      let total = 0;
      if (ry > y - 12 && ry < y + h) drawText(ctx, "THE BASIN", x, ry, { color: "#7fd0dd" });
      ry += 11;
      total += 11;
      const found = g.world.found.size;
      for (const [name, body] of WORLD_NOTES) {
        const lines = wrapText(body, w - 6);
        if (ry > y - 30 && ry < y + h) {
          drawText(ctx, name, x + 2, ry, { color: INK });
          lines.forEach((l, i) => drawText(ctx, l, x + 2, ry + 9 + i * LINE_H, { color: FAINT }));
        }
        const dh = 11 + lines.length * LINE_H;
        ry += dh;
        total += dh;
      }
      ry += 4;
      total += 4;
      if (ry > y - 12 && ry < y + h) drawText(ctx, "WHAT HAPPENED", x, ry, { color: "#e2b74a" });
      ry += 11;
      total += 11;
      ERAS.forEach((e, i) => {
        const open = found >= i * 2;
        const lines = wrapText(open ? e.text : "Not pieced together yet.", w - 6);
        if (ry > y - 40 && ry < y + h) {
          drawText(ctx, open ? e.name : "???", x + 2, ry, { color: open ? INK : FAINT });
          lines.forEach((l, k) => drawText(ctx, l, x + 2, ry + 9 + k * LINE_H, { color: open ? DIM : FAINT }));
        }
        const dh = 11 + lines.length * LINE_H + 3;
        ry += dh;
        total += dh;
      });
      ry += 6;
      total += 6;
      for (const cl of CLADES) {
        const list = FAUNA.filter((f) => f.clade === cl.id);
        if (!list.length) continue;
        if (ry > y - 12 && ry < y + h) drawText(ctx, cl.name.toUpperCase(), x, ry, { color: "#e2b74a" });
        ry += 11;
        total += 11;
        for (const f of list) {
          const seen = g.wildlife.seen.has(f.id);
          const obs = g.research[f.id] || 0;
          const level = OBSERVE_STEPS.filter((s) => obs >= s).length;
          if (ry > y - 12 && ry < y + h) {
            const hot = this._hit(x, ry - 1, w, 10);
            if (hot && seen) {
              ctx.fillStyle = "rgba(88,68,40,0.6)";
              ctx.fillRect(x, ry - 1, w, 10);
            }
            drawText(
              ctx,
              seen ? ellipsize(f.name, w - 40) : "???????",
              x + 2,
              ry,
              { color: seen ? INK : FAINT }
            );
            for (let i = 0; i < OBSERVE_STEPS.length; i++) {
              ctx.fillStyle = i < level ? "#8cc468" : "rgba(140,120,90,0.35)";
              ctx.fillRect(x + w - 30 + i * 6, ry + 1, 4, 4);
            }
            if (hot && seen) {
              this.hover = { title: f.name, body: `${f.sci}
${level}/${OBSERVE_STEPS.length} notes written` };
              if (g.input.clicked) {
                g.input.clicked = false;
                this.codexPick = f.id;
                this.scroll = 0;
              }
            }
          }
          ry += 10;
          total += 10;
        }
        ry += 4;
        total += 4;
      }
      this.scroll = clamp(this.scroll, 0, Math.max(0, total - h + 30));
    }
    _codexEntry(ctx, x, y, w, h) {
      const g = this.game;
      const f = FAUNA_BY_ID[this.codexPick];
      if (!f) {
        this.codexPick = null;
        return;
      }
      if (this._hit(x, y, 22, 10)) {
        this.hover = { title: "Back", body: null };
        if (g.input.clicked) {
          g.input.clicked = false;
          this.codexPick = null;
          this.scroll = 0;
          return;
        }
      }
      drawText(ctx, "< back", x, y, { color: DIM });
      let ry = y + 14 - this.scroll;
      drawText(ctx, f.name, x, ry, { color: INK });
      ry += 10;
      drawText(ctx, f.sci, x, ry, { color: FAINT });
      ry += 12;
      const obs = g.research[f.id] || 0;
      const level = OBSERVE_STEPS.filter((s) => obs >= s).length;
      drawText(ctx, `${f.clade}   observed ${Math.round(obs)}s`, x, ry, { color: "#e2b74a" });
      ry += 12;
      wrapText(f.desc, w).forEach((l) => {
        drawText(ctx, l, x, ry, { color: DIM });
        ry += LINE_H;
      });
      ry += 6;
      f.notes.forEach((n, i) => {
        const got = i < level;
        const lines = wrapText(got ? n : "Not yet observed closely enough.", w - 8);
        ctx.fillStyle = got ? "#8cc468" : "rgba(140,120,90,0.5)";
        ctx.fillRect(x, ry + 1, 3, lines.length * LINE_H - 2);
        lines.forEach((l) => {
          drawText(ctx, l, x + 7, ry, { color: got ? DIM : FAINT });
          ry += LINE_H;
        });
        ry += 4;
      });
      if (level < OBSERVE_STEPS.length) {
        const next = OBSERVE_STEPS[level];
        drawText(ctx, `watch ${Math.max(1, Math.round(next - obs))}s more`, x, ry, { color: FAINT });
        ry += LINE_H;
      }
      this.scroll = clamp(this.scroll, 0, Math.max(0, ry + this.scroll - y - h + 20));
    }
    // -- touch ----------------------------------------------------------------
    /**
     * The controls you actually get on a phone. A thumbstick big enough to find
     * without looking, and a column of buttons on the other side that only
     * exist when there is something to press - a row of dead dashes teaches you
     * nothing and eats the space the spring needs.
     */
    _touchControls(ctx, W, H) {
      const g = this.game;
      const narrow = W < 320;
      if (this.buildOn) {
        this.stickZone = null;
        this.stick = null;
        return;
      }
      const R = narrow ? 30 : 27;
      const off = this.buildOn ? this.railW(W) + 4 : 0;
      const sx = 8 + off, sy = H - 2 * R - 10;
      this.stickZone = { x: off, y: H - 2 * R - 20, w: 2 * R + 26, h: 2 * R + 20 };
      const cx = this.stick ? this.stick.ox : sx + R;
      const cy = this.stick ? this.stick.oy : sy + R;
      ctx.globalAlpha = this.stick ? 0.55 : 0.3;
      ctx.strokeStyle = INK;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(cx, cy, R, 0, TAU);
      ctx.stroke();
      ctx.globalAlpha = this.stick ? 0.22 : 0.12;
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.arc(cx, cy, R - 5, 0, TAU);
      ctx.stroke();
      ctx.globalAlpha = 0.3;
      ctx.fillStyle = INK;
      for (const d of [-1, 1]) {
        const ax = cx + d * (R - 7);
        ctx.beginPath();
        ctx.moveTo(ax + d * 3, cy);
        ctx.lineTo(ax - d * 2, cy - 4);
        ctx.lineTo(ax - d * 2, cy + 4);
        ctx.closePath();
        ctx.fill();
      }
      ctx.globalAlpha = this.stick ? 0.75 : 0.3;
      const dx = this.stick ? clamp(this.stick.x - this.stick.ox, -R, R) : 0;
      ctx.beginPath();
      ctx.arc(cx + dx, cy, this.stick ? 11 : 10, 0, TAU);
      ctx.fill();
      ctx.globalAlpha = 1;
      const bw = narrow ? 58 : 52, bh = narrow ? 26 : 23;
      const v = this.valveRect;
      const rightEdge = (v ? v.x : W - 6) - 8;
      const leftEdge = (this.stickZone ? this.stickZone.x + this.stickZone.w : 0) + 6;
      const bottom = H - bh - 6;
      let bx = rightEdge - bw;
      let by = bottom;
      const add = (label, key2, colour) => {
        if (bx < leftEdge) {
          bx = rightEdge - bw;
          by -= bh + 5;
        }
        this.buttons.push({ x: bx, y: by, w: bw, h: bh, key: key2 });
        const hot = this._hit(bx, by, bw, bh);
        ctx.globalAlpha = hot ? 0.95 : 0.8;
        ctx.fillStyle = "rgba(46,34,22,0.92)";
        ctx.fillRect(bx, by, bw, bh);
        ctx.fillStyle = "rgba(88,66,42,0.9)";
        ctx.fillRect(bx, by, bw, 2);
        ctx.strokeStyle = colour || "rgba(214,186,138,0.55)";
        ctx.strokeRect(bx + 0.5, by + 0.5, bw - 1, bh - 1);
        ctx.globalAlpha = 1;
        drawText(
          ctx,
          label,
          bx + bw / 2,
          by + (bh - 7) / 2,
          { color: colour || INK, align: "center" }
        );
        if (hot && this.game.input.clicked) {
          this.game.input.clicked = false;
          if (key2) this.game.input.pulseVirtual(key2);
        }
        bx -= bw + 6;
      };
      const hint = g.actionHint();
      if (g.garden.ripeCount) add(`PICK ${g.garden.ripeCount}`, "r", "#cfe89a");
      if (hint) add("ACT", "e");
      add("MODE", "m");
      if (hint) {
        drawText(
          ctx,
          hint,
          rightEdge,
          by - 10,
          { color: INK, align: "right", outline: true, outlineColor: OUT }
        );
      }
    }
    // -- helpers --------------------------------------------------------------
    _hit(x, y, w, h) {
      const i = this.game.input;
      return i.sx >= x && i.sx <= x + w && i.sy >= y && i.sy <= y + h;
    }
    _tooltip(ctx, W, H) {
      const t = this.hover;
      const lines = t.body ? wrapText(t.body, 150) : [];
      const w = Math.min(162, Math.max(textWidth(t.title) + 10, ...lines.map((l) => textWidth(l) + 10), 40));
      const h = (t.title ? 11 : 0) + lines.length * LINE_H + 6;
      const i = this.game.input;
      const x = clamp(i.sx + 8, 2, W - w - 2);
      const y = clamp(i.sy - h - 4, 2, H - h - 2);
      ctx.fillStyle = "rgba(14,10,7,0.94)";
      ctx.fillRect(x, y, w, h);
      ctx.strokeStyle = "rgba(214,186,138,0.4)";
      ctx.strokeRect(x + 0.5, y + 0.5, w - 1, h - 1);
      if (t.title) drawText(ctx, t.title, x + 5, y + 4, { color: INK });
      lines.forEach((l, k) => drawText(ctx, l, x + 5, y + (t.title ? 15 : 4) + k * LINE_H, { color: DIM }));
    }
  };

  // js/game.js
