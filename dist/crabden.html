<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="description" content="Wake up as a thousand-year-old crab in a world with no ocean. Make water, restore the desert, and collect the strange things that survived.">
<meta name="theme-color" content="#0a0705">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' fill='%23e8c88d'/><rect x='4' y='6' width='8' height='5' fill='%23b8543a'/><rect x='5' y='3' width='2' height='2' fill='%231b1016'/><rect x='9' y='3' width='2' height='2' fill='%231b1016'/><rect x='6' y='4' width='4' height='2' fill='%2357c8d8'/></svg>">
<title>CRABDEN</title>
<style>
/* CRABDEN - the page is only a frame around one canvas. */

:root {
  color-scheme: dark;
  --sand: #e8c88d;
  --ink: #1a120c;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  background: #0a0705;
  overflow: hidden;
  overscroll-behavior: none;
  font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  color: var(--sand);
  -webkit-font-smoothing: none;
}

body {
  /* fixed rather than merely full-height: stops mobile browsers scrolling
     the page as their chrome slides in and out */
  position: fixed;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  /* a faint warm glow behind the letterboxing */
  background:
    radial-gradient(ellipse at 50% 45%, #241812 0%, #0a0705 70%);
  -webkit-user-select: none;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
  -webkit-touch-callout: none;
}

#game {
  display: block;
  image-rendering: pixelated;
  image-rendering: crisp-edges;
  touch-action: none;
  cursor: crosshair;
  box-shadow: 0 0 0 1px #2e2016, 0 12px 60px rgba(0, 0, 0, 0.75);
}

#boot {
  position: fixed;
  inset: 0;
  display: grid;
  place-content: center;
  gap: 0.6rem;
  text-align: center;
  background: #0a0705;
  z-index: 10;
}

#boot h1 {
  margin: 0;
  font-size: 2rem;
  letter-spacing: 0.35em;
  color: #6fd8ee;
}

#boot p { margin: 0; opacity: 0.6; font-size: 0.8rem; }

.crash {
  position: fixed;
  inset: 6vh 6vw;
  overflow: auto;
  padding: 1.4rem 1.6rem;
  background: #140c08;
  border: 1px solid #7a3324;
  color: #e8c0b8;
  z-index: 100;
  font-size: 0.78rem;
  line-height: 1.5;
}

.crash h1 { margin: 0 0 0.8rem; font-size: 1rem; color: #ff8a7a; letter-spacing: 0.1em; }
.crash pre { white-space: pre-wrap; color: #d8b0a8; background: #0d0705; padding: 0.8rem; border-radius: 2px; }
.crash code { color: #6fd8ee; }

/* Small screens: let the canvas fill what it can, and drop the cursor
   affordance that a finger cannot use. */
@media (max-width: 700px), (pointer: coarse) {
  #game { box-shadow: none; cursor: default; }
  #boot h1 { font-size: 1.5rem; }
}
</style>
</head>
<body>
<canvas id="game" width="960" height="540" aria-label="CRABDEN game screen"></canvas>
<div id="boot">
  <h1>CRABDEN</h1>
  <p>waking up&hellip;</p>
</div>
<noscript>
  <div class="crash"><h1>javascript is switched off</h1>
  <p>CRABDEN is a canvas game and needs JavaScript to run.</p></div>
</noscript>
<script>

    // -- named game sounds ----------------------------------------------------
    play(name, opts = {}) {

    update(dt, supply, weather) {
      this.t += dt;
      const crab = this.game.crab;
      const evap = 0.01 * (0.4 + (weather ? weather.haze : 0.4)) * (1 + (weather?.heat || 0));

      for (const plot of this.plots) {
        const pl = plot.plant;
        if (!pl) continue;
        pl.age += dt;
        const want = pl.def.upkeep * dt;
        const got = Math.min(want, Math.max(0, supply - drank));
        drank += got;
        const short = want > 0 ? 1 - got / want : 0;
        pl.thirst = clamp01(pl.thirst + (short - 0.5) * dt * 0.22);
        if (this.pond > 0.35) pl.thirst = Math.max(0, pl.thirst - dt * 0.28);
        pl.health = clamp01(pl.health + (pl.thirst > 0.7 ? -dt * 0.09 : dt * 0.06));

          const rate = (1 - pl.thirst * 0.8) * (0.6 + this.pond * 0.7) * (pl.def.growBoost || 1);
          pl.growth += dt / pl.def.grow * Math.max(0.06, rate);
          if (pl.growth >= 1) {
            pl.growth = 0;
            pl.stage++;
            this.game.onPlantGrew?.(plot, pl);
          }
        } else {
          fixed += pl.def.yield * dt * pl.health * (0.65 + this.pond * 0.5);
          cover += 1;
          if (Math.random() < dt * 0.1 && this.game.fx) {
            const w = this.plotWorld(plot);
            const col = MATERIALS[pl.def.mat]?.ramp[6] || "#b6de8f";
            this.game.fx.drift(w.x, w.y - 4, pl.def.fruitMat ? "#dc6379" : col, 1);
          }
        }
      }
      this.lushness = damp(this.lushness, clamp01(cover / Math.max(3, this.plots.length * 0.6)), 0.05, dt);
      const over = this.pond > 0.88;
      const crabRef = crab;
      if (over && this.falls.length < 3 && Math.random() < dt * 6) {
        this.falls.push({ u: (crab && crab.m.spillU || 0.045) + Math.random() * 0.03, t: 0, life: 1.6 + Math.random() * 2.6, w: 1 + Math.random() * 1.4 });
      }
      for (let i = this.falls.length - 1; i >= 0; i--) {
        const f = this.falls[i];
        f.t += dt;
        if (f.t > f.life || !over && f.t > 0.6) this.falls.splice(i, 1);
      }
      if (over && crab && this.game.fx && Math.random() < dt * 22) {
        const lip = crab.shellWorld(0.07);
        const gy = this.game.terrain.surfaceY(lip.x);
        this.game.fx.splash(lip.x, gy, 1, 16);
        if (Math.random() < 0.35) this.game.fx.mist(lip.x, gy - 6, 1, 10);

    pickPlot(wx, wy, maxDist = 18) {

    /** Plants on the far side of the shell, behind the crab's body. */
    drawFar(ctx, crab) {

    _drawRow(ctx, crab, row) {
      const m = crab.m;
      const f = crab.faceT < 0 ? -1 : 1;
      const wind = this.game.weather ? this.game.weather.windSpeed : 0.3;
      ctx.save();
      ctx.rotate(crab.bodyAngle);
      const list = this.plots.filter((p) => p.row === row && p.plant);
      list.sort((a, b) => (a.u - b.u) * f);
      for (const plot of list) {

    /** The basin, the spring and the fall - all of the shell's water. */
    _drawWater(ctx, crab) {
      const m = crab.m;
      const f = crab.faceT < 0 ? -1 : 1;
      const [b0, b1] = m.basin;
      ctx.save();
      ctx.rotate(crab.bodyAngle);
      if (this.pond > 0.02) {
        const dip = (b0 + b1) * 0.5;
        const uAt = (u) => crab.rig.shellPoint(u);
        const floorY = uAt(dip).y;
        const spillY = Math.max(uAt(b0 - 0.045).y, uAt(b1 + 0.035).y);
        const level = lerp(floorY - 0.4, spillY, clamp01(this.pond));
        if (level < floorY - 0.2) {

          for (let u = dip; u >= 0.01; u -= 6e-3) {

          }
          for (let u = dip; u <= 0.99; u += 6e-3) {
            if (uAt(u).y < level) break;
            uR = u;

          const N = 30;
          const pts = [];
          for (let i = 0; i <= N; i++) pts.push(uAt(lerp(uL, uR, i / N)));

          ctx.moveTo(pts[0].x * f, level);
          for (const sp of pts) ctx.lineTo(sp.x * f, Math.max(sp.y, level));
          ctx.lineTo(pts[pts.length - 1].x * f, level);
          ctx.closePath();
          const deep = Math.max(...pts.map((q) => q.y));
          const grad = ctx.createLinearGradient(0, level - 1, 0, deep + 1);
          grad.addColorStop(0, "#8adcea");
          grad.addColorStop(0.35, "#2d93a9");
          grad.addColorStop(1, "#0f3b49");

          const x0 = Math.min(xa, xb), wpx = Math.max(2, Math.abs(xb - xa));

          for (let i = 0; i < 6; i++) {

            ctx.globalAlpha = 0.5 - i % 3 * 0.13;
            ctx.fillStyle = "#eafbfd";
            ctx.fillRect(Math.round(gx - 2), Math.round(level + 1 + i % 3), 3 + i % 2 * 2, 1);

            }
          }

          ctx.restore();

          g.addColorStop(0.3, "#5fc6d8");

      this.crab.pump();
      const gain = this.economy.stat("pumpGain");
      this.economy.water = clamp(this.economy.water + gain, 0, this.economy.stat("waterMax"));
      this.garden.pumpInto(0.055);
      const o = this.crab.shellWorld(this.crab.m.organU);
      this.fx.spring(o.x, o.y, o.nx, o.ny, 1);
      this.fx.popup(o.x, o.y - 8, `+${gain}`, "#9de3ee");
      this.audio.play("water");
      if (this.tutorial === 1) {
        this.tutorial = 2;
        this.ui.say("Open PLANT (1) and put something on your back.", 6);
      }
    }
    /** What E does right now, and what the prompt says. */
    actionHint() {
      if (this.state !== "play") return null;
      const c = this.crab;
      const foe = this.wildlife.nearest(c.x, c.y, 44, (q) => q.hostile);
      if (foe) return `Strike ${foe.def.name}`;
      const wildOne = this.wildlife.nearest(c.x, c.y, 40, (q) => !q.hostile && !q.tamed && q.trust > 0.45);
      if (wildOne) {
        const need = wildOne.def.tame;
        return `Offer to ${wildOne.def.name} (${need.berries} berries, ${need.water} water)`;
      }
      if (this.encounters.hint) return this.encounters.hint;
      if (Math.abs(this.npc.x - c.x) < 46) return "Talk to Dr. Vess";
      return null;
    }
    act() {
      const c = this.crab;
      const foe = this.wildlife.nearest(c.x, c.y, 44, (q) => q.hostile);
      if (foe) {
        this.attack();
        return;
      }
      const wildOne = this.wildlife.nearest(c.x, c.y, 40, (q) => !q.hostile && !q.tamed && q.trust > 0.45);
      if (wildOne) {
        const res = this.wildlife.tryTame(wildOne);
        this.ui.say(res.ok ? `${wildOne.def.name} joins you.` : `${wildOne.def.name} ${res.why}.`);
        return;
      }
      if (this.encounters.active) {
        const line = this.encounters.interact();
        if (line) this.ui.say(line, 5);
        return;
      }
      if (Math.abs(this.npc.x - c.x) < 46) this.talkToVess();
    }
    talkToVess() {
      const lines = this._vessLines();
      const l = lines[Math.floor(Math.random() * lines.length)];
      this.npc.say(l, 5);
      this.npc.facing = Math.sign(this.crab.x - this.npc.x) || 1;
    }
    _vessLines() {
      const e = this.economy;
      const out = [];
      if (this.garden.planted.length === 0) {
        out.push("Your back is bare rock. Put something in it. Anything. I have seeds.");
      }
      if (this.garden.pond > 0.8) out.push("You have a pond. On your back. I've written four pages about it.");
      if (e.genes.size >= 4) out.push(`Four genes expressed. You are rewriting yourself in real time and I am taking notes.`);
      if (this.wildlife.fleet.length) out.push("They follow you now. I don't think they know why either.");
      if (this.weather.nightMix > 0.5) out.push("Things come out at night that were not here in the day. Stay lit.");
      out.push("Eleven years I mapped this basin. You made it in an afternoon. I am fine.");
      out.push("Every ruin out here was built by people who thought the water would come back.");
      out.push("Keep the spring running. Everything downstream of you depends on it, including me.");
      return out;
    }
    attack() {
      if (this.attackT > 0) return;
      this.attackT = 0.55;
      const c = this.crab;
      c.clawOpen = 1;
      const reach = c.m.shellW * 0.7;
      const fx = c.x + (c.facing || 1) * reach * 0.6;
      let hit = 0;
      for (const q of this.wildlife.hostiles) {
        if (Math.abs(q.x - fx) < reach * 0.7 && Math.abs(q.y - c.y) < 60) {
          q.hurt(this.economy.stat("dmg"), c.x);
          hit++;
        }
      }
      if (hit) {
        this.cam.shake(3);
        this.audio.play("hit");
      } else this.audio.play("claw");
      this.fx.dust(fx, c.y + c.standH * 0.6, 1);
    }
    tryPlant(id) {
      const def3 = FLORA_BY_ID[id];
      if (!def3) return "No such seed.";
      const plot = this.garden.freeFor(def3);
      if (!plot) return def3.needsPond ? "No free pool bed - both are taken." : "No free plot. Terrace for more.";
      if (def3.needsPond && this.garden.pond < 0.35) return "That one needs standing water. Pump first.";
      if (this.economy.water < def3.cost) return `Needs ${def3.cost} water.`;
      if (!this.garden.plant(plot.i, id)) return "It will not take there.";
      this.economy.water -= def3.cost;
      const w = this.garden.plotWorld(plot);
      this.fx.spark(w.x, w.y, "#8cc468", 8, 26);
      this.economy.markDirty();
      if (this.tutorial === 2) {
        this.tutorial = 3;
        this.ui.say("It grows while you walk. Keep the water up.", 5);
      }
      return `${def3.name} planted.`;
    }
    tryBuild(id) {
      const b = BUILD_BY_ID[id];
      if (!b) return "No such structure.";
      const plot = this.garden.plots.find((p) => p.unlocked && !p.plant && !p.build && !p.wet);
      if (!plot) return "No free plot to build on.";
      if (!this.economy.canBuild(id)) return `Needs ${b.cost} water and ${b.nut} nutrients.`;
      if (!this.economy.build(plot.i, id)) return "It will not sit there.";
      const w = this.garden.plotWorld(plot);
      this.fx.dust(w.x, w.y, 2);
      return `${b.name} built into the shell.`;
    }
    growCrab(stage) {
      const keepX = this.crab.x;
      this.crab.setStage(stage);
      this.crab.x = keepX;
      this.crab.snapToGround();
      this.cam.shake(7);
      this.fx.dust(this.crab.x, this.crab.y, 6);
      this.fx.spark(this.crab.x, this.crab.y, "#b6de8f", 22, 70);
    }
    wetSand(x, amount) {
      this.terrain.deform(x, -amount * 0.04, 9);
    }
    attraction(def3) {
      return this.wildlife.attraction(def3) * this.economy.stat("attract");
    }
    nearestHostile(x, r) {
      return this.wildlife.nearestHostile(x, r);
    }
    // -- hooks ----------------------------------------------------------------
    onCreatureAttack(c) {
      const crab = this.crab;
      if (this.state !== "play") return;
      if (Math.abs(c.x - crab.x) > 24 + crab.m.shellW * 0.34) return;
      if ((crab.iframe || 0) > 0) return;
      crab.iframe = 0.55;
      const dmg = c.def.dmg * (1 - this.economy.stat("armour"));
      crab.hp = Math.max(0, crab.hp - dmg);
      this.cam.shake(4);
      this.audio.play("hurt");
      this.fx.blood(crab.x + (c.x - crab.x) * 0.4, crab.y, 5);
      if (crab.hp <= 0) this.onDown();
    }
    onDown() {
      if (this.state === "dead") return;
      this.state = "dead";
      this.ui.say("You pull in and stop. The desert takes what it takes.", 8);
    }
    onCreatureDown(c) {
      if (!c.hostile) return;
      this.economy.berries += 1;
      this.economy.nutrients += 4;
      this.fx.popup(c.x, c.y - 8, "+4n", "#8cc468");
    }
    onGene(g) {
      this.ui.say(`New gene expressed: ${g.name}.`, 5);
      this.economy.markDirty();
    }
    onTamed(c) {
      this.economy.markDirty();
    }
    onBoard() {
    }
    onSkill(s) {
      this.economy.markDirty();
    }
    onEvolve(e) {
      this.ui.say(`${e.name}. Something in you unfolds.`, 6);
      this.economy.markDirty();
    }
    onBuilt() {
      this.economy.markDirty();
    }
    onPlantGrew(plot, pl) {
      if (pl.stage >= 3) {
        this.economy.recomputeGenes();
        const w = this.garden.plotWorld(plot);
        this.fx.spark(w.x, w.y - 4, "#b6de8f", 10, 30);
        this.ui.say(`${pl.def.name} is mature.`, 3.5);
      }
    }
    onFirstSighting(def3) {
      if (!def3.hostile) this.ui.say(`${def3.name} - first sighting.`, 4);
    }
    onAmbush(def3, n) {
      this.ui.say(n > 1 ? `${def3.name}s! ${n} of them, out of the sand.` : `${def3.name}! Out of the sand.`, 4);
      this.cam.shake(5);
    }
    onNewDay() {
    }
    onDusk() {
      this.ui.say("The light is going.", 3);
    }
    onDawn() {
    }
    onWeather() {
    }
    // -- save -----------------------------------------------------------------
    save() {
      writeSave({
        v: 1,
        x: this.crab.x,
        stage: this.crab.stage,
        hp: this.crab.hp,
        hour: this.weather.hour,
        day: this.weather.day,
        economy: this.economy.toJSON(),
        garden: this.garden.toJSON(),
        wildlife: this.wildlife.toJSON(),
        seeds: this.seeds,
        taken: [...this.encounters.taken],
        tutorial: this.tutorial
      });
    }
    load(d) {
      try {
        this.crab.setStage(d.stage || "juvenile");
        this.crab.x = d.x || 0;
        this.crab.snapToGround();
        this.crab.hp = d.hp ?? this.crab.hpMax;
        this.weather.hour = d.hour ?? 11;
        this.weather.day = d.day ?? 0;
        this.economy.fromJSON(d.economy);
        this.garden.fromJSON(d.garden);
        this.wildlife.fromJSON(d.wildlife);
        this.seeds = d.seeds || this.seeds;
        this.encounters.taken = new Set(d.taken || []);
        this.tutorial = d.tutorial || 3;
        this.economy.recomputeGenes();
        this.economy.markDirty();
        this.cam.followEntity(this.crab, true);
      } catch (err) {
      }
    }
    reset() {
      clearSave();
      this.newRun();
    }
    // -- draw -----------------------------------------------------------------
    draw() {
      const r = this.renderer;
      const ctx = r.scene;
      const cam = this.cam;
      r.beginFrame(0);
      this.backdrop.drawSky(ctx, cam, this.weather);
      this.backdrop.drawLayer(ctx, cam, this.weather, "far", this.terrain);
      this.backdrop.drawLayer(ctx, cam, this.weather, "mid", this.terrain);
      this.backdrop.drawLayer(ctx, cam, this.weather, "near", this.terrain);
      this.terrain.draw(ctx, cam);
      this.terrain.drawSand(ctx, cam);
      this.encounters.draw(ctx, cam);
      this.fx.draw(ctx, cam, "far");
      this.wildlife.draw(ctx, cam, "ground");
      this.npc.draw(ctx, cam);
      this.crab.draw(ctx, cam, this.garden);
      this._drawStructures(ctx, cam);
      this.wildlife.draw(ctx, cam, "shell");
      this.fx.draw(ctx, cam, "near");
      this.backdrop.drawForeground(ctx, cam, this.weather, this.terrain);
      r.beginLights(this.weather);
      const lightPow = this.economy.stat("light");
      if (lightPow > 0) {
        const o = this.crab.shellWorld(0.5);
        const s = cam.worldToScreen(o.x, o.y);
        r.addLight(s.x, s.y, 90 * cam.zoom * (0.6 + lightPow * 0.5), "#ffd98a", 0.8);
      }
      for (const c of this.wildlife.list) {
        if (!c.def.glow || !c.alive) continue;
        const s = cam.worldToScreen(c.x, c.y);
        r.addLight(s.x, s.y, 40 * cam.zoom, c.def.glow, 0.7);
      }
      if (this.garden.pond > 0.3) {
        const o = this.crab.shellWorld(0.24);
        const s = cam.worldToScreen(o.x, o.y);
        r.addLight(s.x, s.y, 34 * cam.zoom, "#9de3ee", 0.25 * this.garden.pond);
      }
      r.endLights();
      r.drawWeatherOverlay(this.weather, this);
      r.composite(this.weather, this);
      const ui = r.ui;
      if (this.state === "intro") this._drawCutscene(ui, r);
      else this.ui.draw(ui, r);
      this.fx.drawText(ui, cam, (c, t, x, y, o) => drawText(c, t, x, y, o));
      if (this.state === "dead") this._drawDead(ui, r);
      if (this.npc.speech && this.state === "play") this._drawSpeech(ui, cam, this.npc);
      r.dctx.drawImage(r.uiC, 0, 0, r.vw, r.vh, 0, 0, r.vw * r.scale, r.vh * r.scale);
    }
    _drawStructures(ctx, cam) {
      const crab = this.crab;
      const f = crab.faceT < 0 ? -1 : 1;
      const built = this.garden.plots.filter((p) => p.build);
      if (!built.length) return;
      const p0 = cam.worldToScreen(crab.x, crab.y + crab.bob);
      ctx.save();
      ctx.translate(Math.round(p0.x * 2) / 2, Math.round(p0.y * 2) / 2);
      ctx.scale(cam.zoom, cam.zoom);
      ctx.rotate(crab.bodyAngle);
      for (const plot of built) {
        const sp = crab.rig.shellPoint(plot.u);
        const art = buildStructure(plot.build.def, clamp(crab.m.shellH / 96, 0.3, 1.1));
        ctx.save();
        ctx.translate(sp.x * f, sp.y + 1);
        ctx.rotate(Math.atan2(sp.nx, -sp.ny) * 0.3 * f);
        ctx.scale(f, 1);
        ctx.drawImage(art.cv, -art.ox, -art.oy);
        ctx.restore();
      }
      ctx.restore();
    }
    _drawSpeech(ctx, cam, who) {
      const s = cam.worldToScreen(who.x, who.y - 26);
      const lines = wrapText(who.speech, 130);
      const w = Math.max(...lines.map((l) => textWidth(l))) + 10;
      const h = lines.length * LINE_H + 6;
      const x = clamp(Math.round(s.x - w / 2), 2, this.renderer.vw - w - 2);
      const y = clamp(Math.round(s.y - h), 2, this.renderer.vh - h - 2);
      ctx.fillStyle = "rgba(18,13,9,0.9)";
      ctx.fillRect(x, y, w, h);
      ctx.strokeStyle = "rgba(226,200,150,0.4)";
      ctx.strokeRect(x + 0.5, y + 0.5, w - 1, h - 1);
      lines.forEach((l, i) => drawText(ctx, l, x + 5, y + 4 + i * LINE_H, { color: "#f2e4c2" }));
    }
    _drawCutscene(ctx, r) {
      const bar = Math.round(22 * this.letterbox);
      ctx.fillStyle = "#080604";
      ctx.fillRect(0, 0, r.vw, bar);
      ctx.fillRect(0, r.vh - bar, r.vw, bar);
      if (this.dialog) {
        const d = this.dialog;
        const nar = d.who === "narrator";
        const lines = wrapText(d.text, r.vw - 60);
        const h = lines.length * LINE_H + (nar ? 4 : 14);
        const y = r.vh - bar - h - 8;
        const x = 26;
        if (!nar) {
          ctx.fillStyle = "rgba(16,12,8,0.9)";
          ctx.fillRect(x - 6, y - 4, r.vw - 40, h + 8);
          ctx.strokeStyle = "rgba(226,200,150,0.35)";
          ctx.strokeRect(x - 5.5, y - 3.5, r.vw - 41, h + 7);
          drawText(ctx, d.who, x, y, { color: "#e2b74a" });
        }
        const cps = 48;
        const shown = Math.floor(d.t * cps);
        let used = 0;
        lines.forEach((l, i) => {
          const room = Math.max(0, shown - used);
          used += l.length;
          drawText(
            ctx,
            l.slice(0, room),
            x,
            y + (nar ? 0 : 11) + i * LINE_H,
            { color: nar ? "rgba(230,214,180,0.82)" : "#f2e4c2", outline: nar, outlineColor: "rgba(0,0,0,0.6)" }
          );
        });
      }
      drawText(
        ctx,
        "space / tap to skip",
        r.vw - 4,
        r.vh - bar - 8,
        { color: "rgba(230,214,180,0.4)", align: "right" }
      );
    }
    _drawDead(ctx, r) {
      ctx.fillStyle = "rgba(10,6,4,0.6)";
      ctx.fillRect(0, 0, r.vw, r.vh);
      drawText(
        ctx,
        "THE SAND TAKES WHAT IT TAKES",
        r.vw / 2,
        r.vh / 2 - 18,
        { color: "#f2e4c2", align: "center", scale: 2 }
      );
      const w = 110, x = (r.vw - w) / 2, y = r.vh / 2 + 8;
      const hot = this.input.sx >= x && this.input.sx <= x + w && this.input.sy >= y && this.input.sy <= y + 16;
      ctx.fillStyle = hot ? "rgba(96,74,44,0.95)" : "rgba(52,40,26,0.9)";
      ctx.fillRect(x, y, w, 16);
      ctx.strokeStyle = "rgba(226,200,150,0.4)";
      ctx.strokeRect(x + 0.5, y + 0.5, w - 1, 15);
      drawText(ctx, "PULL YOURSELF UP", x + w / 2, y + 5, { color: "#f2e4c2", align: "center" });
      if (hot && this.input.clicked) {
        this.input.clicked = false;
        this.crab.hp = this.crab.hpMax * 0.6;
        this.crab.iframe = 2.5;
        this.state = "play";
        for (const q of this.wildlife.hostiles) q.x += q.x - this.crab.x > 0 ? 200 : -200;
      }
    }
  };

  // js/main.js
  var canvas = document.getElementById("game");
  var boot = document.getElementById("boot");
  var game;
  try {
    game = new Game(canvas);
    window.CRABDEN = game;
  } catch (err) {
    showError(err);
    throw err;
  }
  if (boot) boot.remove();
  var kick = () => {
    game.audio.resume();
    window.removeEventListener("pointerdown", kick);
    window.removeEventListener("keydown", kick);
  };
  window.addEventListener("pointerdown", kick);
  window.addEventListener("keydown", kick);
  var last = performance.now();
  function frame(now) {
    requestAnimationFrame(frame);
    let dt = (now - last) / 1e3;
    last = now;
    if (dt > 0.25) dt = 0.25;
    if (dt <= 0) return;
    try {
      game.update(dt);
      game.draw();
      game.input.endFrame();
    } catch (err) {
      showError(err);
      throw err;
    }
  }
  requestAnimationFrame(frame);
  document.addEventListener("visibilitychange", () => {
    last = performance.now();
  });
  window.addEventListener("orientationchange", () => {
    setTimeout(() => {
      game.renderer.resize();
      game.input.scale = game.renderer.scale;
    }, 120);
  });
  function showError(err) {
    const box = document.createElement("div");
    box.className = "crash";
    box.innerHTML = `<h1>the crab has encountered a problem</h1><pre></pre>
    <p>reload to try again. if it keeps happening, clear the save:
    <code>localStorage.clear()</code></p>`;
    box.querySelector("pre").textContent = err && err.stack || String(err);
    document.body.appendChild(box);
  }
})();
</script>
</body>
</html>
