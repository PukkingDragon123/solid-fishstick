<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="description" content="Wake up as a thousand-year-old crab in a world with no ocean. Make water, restore the desert, and collect the strange things that survived.">
<meta name="theme-color" content="#0a0705">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' fill='%23e8c88d'/><rect x='4' y='6' width='8' height='5' fill='%23b8543a'/><rect x='5' y='3' width='2' height='2' fill='%231b1016'/><rect x='9' y='3' width='2' height='2' fill='%231b1016'/><rect x='6' y='4' width='4' height='2' fill='%2357c8d8'/></svg>">
<title>CRABDEN</title>
<style>
/* CRABDEN - the page is only a frame around one canvas. */

:root {
  color-scheme: dark;
  --sand: #e8c88d;
  --ink: #1a120c;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  background: #0a0705;
  overflow: hidden;
  overscroll-behavior: none;
  font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  color: var(--sand);
  -webkit-font-smoothing: none;
}

body {
  /* fixed rather than merely full-height: stops mobile browsers scrolling
     the page as their chrome slides in and out */
  position: fixed;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  /* a faint warm glow behind the letterboxing */
  background:
    radial-gradient(ellipse at 50% 45%, #241812 0%, #0a0705 70%);
  -webkit-user-select: none;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
  -webkit-touch-callout: none;
}

#game {
  display: block;
  image-rendering: pixelated;
  image-rendering: crisp-edges;
  touch-action: none;
  cursor: crosshair;
  box-shadow: 0 0 0 1px #2e2016, 0 12px 60px rgba(0, 0, 0, 0.75);
}

#boot {
  position: fixed;
  inset: 0;
  display: grid;
  place-content: center;
  gap: 0.6rem;
  text-align: center;
  background: #0a0705;
  z-index: 10;
}

#boot h1 {
  margin: 0;
  font-size: 2rem;
  letter-spacing: 0.35em;
  color: #6fd8ee;
}

#boot p { margin: 0; opacity: 0.6; font-size: 0.8rem; }

.crash {
  position: fixed;
  inset: 6vh 6vw;
  overflow: auto;
  padding: 1.4rem 1.6rem;
  background: #140c08;
  border: 1px solid #7a3324;
  color: #e8c0b8;
  z-index: 100;
  font-size: 0.78rem;
  line-height: 1.5;
}

.crash h1 { margin: 0 0 0.8rem; font-size: 1rem; color: #ff8a7a; letter-spacing: 0.1em; }
.crash pre { white-space: pre-wrap; color: #d8b0a8; background: #0d0705; padding: 0.8rem; border-radius: 2px; }
.crash code { color: #6fd8ee; }

/* Small screens: let the canvas fill what it can, and drop the cursor
   affordance that a finger cannot use. */
@media (max-width: 700px), (pointer: coarse) {
  #game { box-shadow: none; cursor: default; }
  #boot h1 { font-size: 1.5rem; }
}
</style>
</head>
<body>
<canvas id="game" width="960" height="540" aria-label="CRABDEN game screen"></canvas>
<div id="boot">
  <h1>CRABDEN</h1>
  <p>waking up&hellip;</p>
</div>
<noscript>
  <div class="crash"><h1>javascript is switched off</h1>
  <p>CRABDEN is a canvas game and needs JavaScript to run.</p></div>
</noscript>
<script>
(() => {
  // js/lib/math.js
  var TAU = Math.PI * 2;
  var clamp = (v, a, b) => v < a ? a : v > b ? b : v;
  var clamp01 = (v) => v < 0 ? 0 : v > 1 ? 1 : v;
  var lerp = (a, b, t) => a + (b - a) * t;
  var smoothstep = (t) => {
    t = clamp01(t);
    return t * t * (3 - 2 * t);
  };
  var damp = (a, b, rate, dt) => lerp(a, b, 1 - Math.pow(rate, dt));
  var dist = (ax, ay, bx, by) => Math.hypot(bx - ax, by - ay);
  var dist2 = (ax, ay, bx, by) => {
    const dx = bx - ax, dy = by - ay;
    return dx * dx + dy * dy;
  };
  function angleLerp(a, b, t) {
    let d = ((b - a + Math.PI) % TAU + TAU) % TAU - Math.PI;
    return a + d * t;
  }
  function angleDelta(a, b) {
    return ((b - a + Math.PI) % TAU + TAU) % TAU - Math.PI;
  }
  var easeOutCubic = (t) => 1 - Math.pow(1 - t, 3);
  var easeInOutCubic = (t) => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
  var easeOutBack = (t) => {
    const c = 1.70158, c3 = c + 1;
    return 1 + c3 * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2);
  };
  var easeOutElastic = (t) => {
    if (t === 0 || t === 1) return t;
    const c4 = TAU / 3;
    return Math.pow(2, -10 * t) * Math.sin((t * 10 - 0.75) * c4) + 1;
  };
  function hashStr(str) {
    let h = 2166136261 >>> 0;
    for (let i = 0; i < str.length; i++) {
      h ^= str.charCodeAt(i);
      h = Math.imul(h, 16777619);
    }
    return h >>> 0;
  }
  function mulberry32(seed) {
    let a = seed >>> 0;
    return function() {
      a |= 0;
      a = a + 1831565813 | 0;
      let t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  var Rng = class {
    constructor(seed) {
      this.next = mulberry32(typeof seed === "string" ? hashStr(seed) : seed | 0);
    }
    float(a = 1, b) {
      return b === void 0 ? this.next() * a : a + this.next() * (b - a);
    }
    int(a, b) {
      return b === void 0 ? Math.floor(this.next() * a) : a + Math.floor(this.next() * (b - a + 1));
    }
    bool(p = 0.5) {
      return this.next() < p;
    }
    pick(arr) {
      return arr[Math.floor(this.next() * arr.length)];
    }
    sign() {
      return this.next() < 0.5 ? -1 : 1;
    }
    /** Gaussian-ish via sum of uniforms. */
    gauss(mean = 0, sd = 1) {
      const u = (this.next() + this.next() + this.next() + this.next() - 2) * 0.8660254;
      return mean + u * sd;
    }
    shuffle(arr) {
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(this.next() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }
    weighted(entries) {
      let total = 0;
      for (const e of entries) total += e.w || 1;
      let r = this.next() * total;
      for (const e of entries) {
        r -= e.w || 1;
        if (r <= 0) return e;
      }
      return entries[entries.length - 1];
    }
  };
  function hash2(x, y, seed) {
    let h = seed ^ Math.imul(x | 0, 668265261) ^ Math.imul(y | 0, 374761393);
    h = Math.imul(h ^ h >>> 15, 739982445);
    h = Math.imul(h ^ h >>> 12, 695872825);
    return ((h ^ h >>> 15) >>> 0) / 4294967296;
  }
  function valueNoise2(x, y, seed = 0) {
    const xi = Math.floor(x), yi = Math.floor(y);
    const xf = x - xi, yf = y - yi;
    const u = xf * xf * (3 - 2 * xf);
    const v = yf * yf * (3 - 2 * yf);
    const a = hash2(xi, yi, seed);
    const b = hash2(xi + 1, yi, seed);
    const c = hash2(xi, yi + 1, seed);
    const d = hash2(xi + 1, yi + 1, seed);
    return lerp(lerp(a, b, u), lerp(c, d, u), v);
  }
  function fbm2(x, y, octaves = 4, seed = 0, lacunarity = 2, gain = 0.5) {
    let amp = 1, freq = 1, sum = 0, norm = 0;
    for (let i = 0; i < octaves; i++) {
      sum += amp * valueNoise2(x * freq, y * freq, seed + i * 1013);
      norm += amp;
      amp *= gain;
      freq *= lacunarity;
    }
    return sum / norm;
  }
  function ridge2(x, y, octaves = 4, seed = 0) {
    let amp = 1, freq = 1, sum = 0, norm = 0;
    for (let i = 0; i < octaves; i++) {
      const n = 1 - Math.abs(valueNoise2(x * freq, y * freq, seed + i * 7717) * 2 - 1);
      sum += amp * n * n;
      norm += amp;
      amp *= 0.5;
      freq *= 2;
    }
    return sum / norm;
  }
  function wobble(t, seed = 0) {
    return Math.sin(t * 1.7 + seed) * 0.6 + Math.sin(t * 3.1 + seed * 2.3) * 0.3 + Math.sin(t * 6.7 + seed * 5.1) * 0.1;
  }
  function hexToRgb(hex) {
    const h = hex.replace("#", "");
    const n = parseInt(h.length === 3 ? h.split("").map((c) => c + c).join("") : h, 16);
    return [n >> 16 & 255, n >> 8 & 255, n & 255];
  }
  function rgbToHex(r, g, b) {
    return "#" + (1 << 24 | clamp(r | 0, 0, 255) << 16 | clamp(g | 0, 0, 255) << 8 | clamp(b | 0, 0, 255)).toString(16).slice(1);
  }
  function mixHex(a, b, t) {
    const A = hexToRgb(a), B = hexToRgb(b);
    return rgbToHex(lerp(A[0], B[0], t), lerp(A[1], B[1], t), lerp(A[2], B[2], t));
  }
  function shadeHex(hex, amt) {
    const [r, g, b] = hexToRgb(hex);
    if (amt >= 0) return rgbToHex(lerp(r, 255, amt), lerp(g, 255, amt), lerp(b, 255, amt));
    return rgbToHex(lerp(r, 0, -amt), lerp(g, 0, -amt), lerp(b, 0, -amt));
  }
  function rgba(hex, a) {
    const [r, g, b] = hexToRgb(hex);
    return `rgba(${r},${g},${b},${a})`;
  }
  function formatTime(hour) {
    const h = Math.floor(hour) % 24;
    const m = Math.floor(hour % 1 * 60);
    const ampm = h < 12 ? "am" : "pm";
    const h12 = h % 12 === 0 ? 12 : h % 12;
    return `${h12}:${m < 10 ? "0" : ""}${m}${ampm}`;
  }

  // js/lib/audio.js
  var NOTES = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 };
  function noteHz(name) {
    const m = /^([A-G])(#|b)?(-?\d)$/.exec(name);
    if (!m) return 440;
    let semi = NOTES[m[1]] + (m[2] === "#" ? 1 : m[2] === "b" ? -1 : 0);
    const oct = parseInt(m[3], 10);
    return 440 * Math.pow(2, (semi - 9) / 12 + (oct - 4));
  }
  var Audio = class {
    constructor() {
      this.ctx = null;
      this.enabled = true;
      this.masterVol = 0.7;
      this.musicVol = 0.45;
      this.sfxVol = 0.8;
      this._noiseBuf = null;
      this._windNodes = null;
      this._musicTimer = 0;
      this._musicStep = 0;
      this._mood = "calm";
      this._targetWind = 0.25;
    }
    /** Must be called from a user gesture. */
    resume() {
      if (!this.ctx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) {
          this.enabled = false;
          return;
        }
        this.ctx = new AC();
        this.master = this.ctx.createGain();
        this.master.gain.value = this.masterVol;
        this.master.connect(this.ctx.destination);
        this.musicBus = this.ctx.createGain();
        this.musicBus.gain.value = this.musicVol;
        this.musicBus.connect(this.master);
        this.sfxBus = this.ctx.createGain();
        this.sfxBus.gain.value = this.sfxVol;
        this.sfxBus.connect(this.master);
        this.verb = this.ctx.createConvolver();
        this.verb.buffer = this._impulse(1.6, 2.4);
        this.verbGain = this.ctx.createGain();
        this.verbGain.gain.value = 0.22;
        this.verb.connect(this.verbGain);
        this.verbGain.connect(this.master);
        this._startWind();
      }
      if (this.ctx.state === "suspended") this.ctx.resume();
    }
    setMuted(m) {
      this.enabled = !m;
      if (this.master) this.master.gain.value = m ? 0 : this.masterVol;
    }
    _impulse(dur, decay) {
      const rate = this.ctx.sampleRate;
      const len = Math.max(1, rate * dur | 0);
      const buf = this.ctx.createBuffer(2, len, rate);
      for (let c = 0; c < 2; c++) {
        const d = buf.getChannelData(c);
        for (let i = 0; i < len; i++) {
          d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, decay);
        }
      }
      return buf;
    }
    _noise() {
      if (!this._noiseBuf) {
        const rate = this.ctx.sampleRate;
        const buf = this.ctx.createBuffer(1, rate * 2, rate);
        const d = buf.getChannelData(0);
        let last2 = 0;
        for (let i = 0; i < d.length; i++) {
          const white = Math.random() * 2 - 1;
          last2 = (last2 + 0.02 * white) / 1.02;
          d[i] = white * 0.6 + last2 * 3;
        }
        this._noiseBuf = buf;
      }
      const src = this.ctx.createBufferSource();
      src.buffer = this._noiseBuf;
      src.loop = true;
      return src;
    }
    // -- ambient wind ---------------------------------------------------------
    _startWind() {
      const src = this._noise();
      const filt = this.ctx.createBiquadFilter();
      filt.type = "bandpass";
      filt.frequency.value = 520;
      filt.Q.value = 0.6;
      const gain = this.ctx.createGain();
      gain.gain.value = 0;
      src.connect(filt);
      filt.connect(gain);
      gain.connect(this.master);
      src.start();
      this._windNodes = { src, filt, gain };
    }
    /** strength 0..1, gustiness modulates filter */
    setWind(strength, sandiness = 0) {
      if (!this._windNodes) return;
      const t = this.ctx.currentTime;
      const g = Math.min(0.35, strength * 0.3 + sandiness * 0.18);
      this._windNodes.gain.gain.setTargetAtTime(g, t, 0.8);
      this._windNodes.filt.frequency.setTargetAtTime(320 + strength * 900 + sandiness * 700, t, 1.2);
      this._windNodes.filt.Q.setTargetAtTime(0.5 + sandiness * 1.5, t, 1.2);
    }
    // -- one-shot synth helpers ----------------------------------------------
    _env(node2, t, a, d, peak, sustain = 0, rel = 0.05) {
      const g = node2.gain;
      g.cancelScheduledValues(t);
      g.setValueAtTime(1e-4, t);
      g.exponentialRampToValueAtTime(Math.max(2e-4, peak), t + a);
      if (sustain > 0) {
        g.exponentialRampToValueAtTime(Math.max(2e-4, peak * 0.6), t + a + d);
        g.exponentialRampToValueAtTime(1e-4, t + a + d + sustain + rel);
      } else {
        g.exponentialRampToValueAtTime(1e-4, t + a + d);
      }
    }
    tone(freq, { type = "sine", dur = 0.18, vol = 0.3, attack = 5e-3, slide = 0, delay = 0, verb = 0.1, detune = 0 } = {}) {
      if (!this.ctx || !this.enabled) return;
      const t = this.ctx.currentTime + delay;
      const osc = this.ctx.createOscillator();
      const g = this.ctx.createGain();
      osc.type = type;
      osc.detune.value = detune;
      osc.frequency.setValueAtTime(freq, t);
      if (slide) osc.frequency.exponentialRampToValueAtTime(Math.max(20, freq * slide), t + dur);
      this._env(g, t, attack, dur, vol);
      osc.connect(g);
      g.connect(this.sfxBus);
      if (verb > 0) {
        const vg = this.ctx.createGain();
        vg.gain.value = verb;
        g.connect(vg);
        vg.connect(this.verb);
      }
      osc.start(t);
      osc.stop(t + dur + 0.1);
    }
    noiseBurst({ dur = 0.15, vol = 0.25, freq = 900, q = 1, type = "bandpass", delay = 0, sweep = 1 } = {}) {
      if (!this.ctx || !this.enabled) return;
      const t = this.ctx.currentTime + delay;
      const src = this._noise();
      const filt = this.ctx.createBiquadFilter();
      filt.type = type;
      filt.frequency.setValueAtTime(freq, t);
      filt.Q.value = q;
      if (sweep !== 1) filt.frequency.exponentialRampToValueAtTime(Math.max(40, freq * sweep), t + dur);
      const g = this.ctx.createGain();
      this._env(g, t, 4e-3, dur, vol);
      src.connect(filt);
      filt.connect(g);
      g.connect(this.sfxBus);
      src.start(t);
      src.stop(t + dur + 0.05);
    }
    // -- named game sounds ----------------------------------------------------
    play(name, opts = {}) {
      if (!this.ctx || !this.enabled) return;
      const p = opts.pitch || 1;
      switch (name) {
        case "step":
          this.noiseBurst({ dur: 0.06, vol: 0.05 + Math.random() * 0.03, freq: 1400 + Math.random() * 900, q: 0.8, sweep: 0.4, verb: 0 });
          break;
        case "drip":
          this.tone(880 * p, { type: "sine", dur: 0.16, vol: 0.28, slide: 2.6, verb: 0.5 });
          break;
        case "water":
          this.noiseBurst({ dur: 0.28, vol: 0.16, freq: 500, q: 0.7, sweep: 3.2 });
          this.tone(300 * p, { type: "sine", dur: 0.3, vol: 0.15, slide: 2.2, verb: 0.4 });
          break;
        case "splash":
          this.noiseBurst({ dur: 0.5, vol: 0.3, freq: 2200, q: 0.5, sweep: 0.15 });
          this.tone(220, { type: "sine", dur: 0.4, vol: 0.2, slide: 0.5, verb: 0.6 });
          break;
        case "grow":
          [0, 4, 7, 12].forEach((s, i) => this.tone(392 * Math.pow(2, s / 12) * p, { type: "triangle", dur: 0.25, vol: 0.13, delay: i * 0.055, verb: 0.35 }));
          break;
        case "pickup":
          this.tone(659 * p, { type: "square", dur: 0.07, vol: 0.12 });
          this.tone(988 * p, { type: "square", dur: 0.1, vol: 0.11, delay: 0.06 });
          break;
        case "ui":
          this.tone(660, { type: "square", dur: 0.04, vol: 0.07, verb: 0 });
          break;
        case "uiBig":
          this.tone(523, { type: "square", dur: 0.06, vol: 0.1, verb: 0 });
          this.tone(784, { type: "square", dur: 0.09, vol: 0.09, delay: 0.05, verb: 0 });
          break;
        case "deny":
          this.tone(180, { type: "square", dur: 0.12, vol: 0.12, slide: 0.7, verb: 0 });
          break;
        case "claw":
          this.noiseBurst({ dur: 0.11, vol: 0.16, freq: 2600, q: 1.4, sweep: 0.25 });
          this.tone(300 * p, { type: "sawtooth", dur: 0.1, vol: 0.09, slide: 0.5 });
          break;
        case "hit":
          this.noiseBurst({ dur: 0.14, vol: 0.24, freq: 420, q: 0.9, sweep: 0.3 });
          this.tone(140, { type: "square", dur: 0.13, vol: 0.16, slide: 0.5 });
          break;
        case "hurt":
          this.tone(320, { type: "sawtooth", dur: 0.25, vol: 0.2, slide: 0.35 });
          this.noiseBurst({ dur: 0.2, vol: 0.14, freq: 700, q: 0.6, sweep: 0.4 });
          break;
        case "evolve":
          [0, 3, 7, 10, 12, 15].forEach((s, i) => this.tone(261.6 * Math.pow(2, s / 12), { type: "triangle", dur: 0.6, vol: 0.13, delay: i * 0.09, verb: 0.7 }));
          this.noiseBurst({ dur: 1.2, vol: 0.1, freq: 300, q: 0.4, sweep: 6, delay: 0.1 });
          break;
        case "chirp":
          for (let i = 0; i < 3; i++) this.tone((1800 + Math.random() * 900) * p, { type: "sine", dur: 0.05, vol: 0.09, delay: i * 0.07, slide: 1.5, verb: 0.4 });
          break;
        case "growl":
          this.tone(70, { type: "sawtooth", dur: 0.55, vol: 0.2, slide: 1.4, verb: 0.4 });
          this.noiseBurst({ dur: 0.5, vol: 0.09, freq: 240, q: 2, sweep: 1.6 });
          break;
        case "discover":
          [0, 5, 9, 12].forEach((s, i) => this.tone(440 * Math.pow(2, s / 12), { type: "sine", dur: 0.5, vol: 0.15, delay: i * 0.11, verb: 0.6 }));
          break;
        case "talk":
          this.tone((420 + Math.random() * 260) * p, { type: "square", dur: 0.035, vol: 0.045, verb: 0 });
          break;
        case "thunder":
          this.noiseBurst({ dur: 1.8, vol: 0.3, freq: 160, q: 0.4, sweep: 0.4 });
          this.tone(48, { type: "sine", dur: 1.6, vol: 0.24, slide: 0.6, verb: 0.6 });
          break;
        case "night":
          this.tone(196, { type: "sine", dur: 2.2, vol: 0.08, verb: 0.9 });
          this.tone(233, { type: "sine", dur: 2.4, vol: 0.06, delay: 0.3, verb: 0.9 });
          break;
        case "dawn":
          [0, 4, 7, 11].forEach((s, i) => this.tone(329.6 * Math.pow(2, s / 12), { type: "sine", dur: 1.4, vol: 0.09, delay: i * 0.16, verb: 0.8 }));
          break;
        default:
          break;
      }
    }
    // -- generative score -----------------------------------------------------
    // A slow modal loop. Mood swaps the scale and instrument colour.
    setMood(mood) {
      this._mood = mood;
    }
    updateMusic(dt) {
      if (!this.ctx || !this.enabled) return;
      this._musicTimer -= dt;
      if (this._musicTimer > 0) return;
      const moods = {
        calm: { root: "D3", scale: [0, 2, 5, 7, 9, 12, 14], step: 1.05, wave: "sine", vol: 0.12 },
        hopeful: { root: "F3", scale: [0, 2, 4, 7, 9, 11, 12], step: 0.9, wave: "triangle", vol: 0.13 },

    // -- update ---------------------------------------------------------------
    update(dt, game2) {

      this.dashT = Math.max(0, this.dashT - dt);

      this.hurtFlash = Math.max(0, this.hurtFlash - dt * 2.4);

      if (this.emoteT <= 0) this.emote = null;

      if (!this.pumping) this.vigor = clamp01(this.vigor + dt * 0.24 * s.vigorEff);
      this.pumpAmount = Math.max(0, this.pumpAmount - dt * 2.2);
      this.organSquash = Math.max(0, this.organSquash - dt * 2.4);
      if (!this.pumping) this.addWater(s.waterRate * s.passiveMult * dt);
      this.organPulse += dt * (1.6 + this.pumpAmount * 5);

      if (drain > 0) {

          this.mode = "move";

          ay = (this.moveTarget.y - this.y) / d;

      this.y += this.vy * dt;

          this.y -= (d.y - this.y) / dd * push;
        }
      }

      if (this.targetFacingOverride !== void 0) {
        want = this.targetFacingOverride;
        this.targetFacingOverride = void 0;
      } else if (sp > 6) {
        want = Math.atan2(this.vy, this.vx);
      } else if (this.lookAt) {
        want = Math.atan2(this.lookAt.y - this.y, this.lookAt.x - this.x);
      }
      this.facing = angleLerp(this.facing, want, 1 - Math.pow(9e-4, dt));
      this.bodyAngle = angleLerp(this.bodyAngle, this.facing, 1 - Math.pow(0.02, dt));

      this._updateBody(dt, game2, sp);
      this._updateClaws(dt, game2);
      this._updateEyes(dt, game2, sp);

    markPouring() {
      this._pourHeld = true;

    _updateLegs(dt, game2, speed) {
      const world = game2.world;
      const s = this.stats;
      const legLen = this.size * s.legLength;
      const stepThresh = this.size * (0.85 + speed * 4e-3);
      let stepping = 0;
      for (const leg of this.legs) if (leg.stepping) stepping++;
      const leadX = this.vx * 0.11;
      const leadY = this.vy * 0.11;
      for (const leg of this.legs) {
        const a = this.bodyAngle + leg.restAngle;
        const anchorX = this.x + Math.cos(a) * this.size * leg.restDist * s.stanceWidth + leadX;
        const anchorY = this.y + Math.sin(a) * this.size * leg.restDist * s.stanceWidth + leadY;

        leg.anchorY = anchorY;
        if (leg.stepping) {
          leg.t += dt / leg.dur;
          const t = clamp01(leg.t);
          const e = easeOutCubic(t);
          leg.fx = lerp(leg.ax, leg.bx, e);
          leg.fy = lerp(leg.ay, leg.by, e);

            leg.fz = 0;

            stepping++;

            leg.ax = leg.fx;
            leg.ay = leg.fy;
            leg.bx = anchorX + (anchorX - leg.fx) * 0.32;
            leg.by = anchorY + (anchorY - leg.fy) * 0.32;
            leg.lift = this.size * (0.55 + Math.min(1, speed * 6e-3));
            leg.planted = false;

    _footPlant(leg, game2, speed) {

      if (speed > 12) {
        game2.particles.spawn("sand", leg.fx, leg.fy, {
          color: region.pal.hi,
          life: 0.4,
          size: 1,
          vz: 6,
          grav: 30,
          vx: -this.vx * 0.06,
          vy: -this.vy * 0.06,
          wind: 0.2
        });
      }
      const wet = game2.eco.moistureAt(leg.fx, leg.fy);
      game2.particles.decal("footprint", leg.fx, leg.fy, {
        size: this.size * 0.5,
        life: wet > 0.2 ? 40 : 16,
        color: wet > 0.2 ? rgba(region.pal.wet, 0.5) : rgba(region.pal.shadow, 0.32)

    _updateBody(dt, game2, speed) {
      let sum = 0, n = 0, fl = 0, fr = 0, ff = 0, fb = 0;
      const half = Math.max(1, this.legPairs);
      for (const leg of this.legs) {
        sum += leg.ground;
        n++;
        if (leg.side < 0) fl += leg.ground;
        else fr += leg.ground;
        if (leg.i < half / 2) ff += leg.ground;
        else fb += leg.ground;
      }

      this.tiltY = damp(this.tiltY, (fb / half - ff / half) * 0.03, 0.05, dt);

    _updateClaws(dt, game2) {
      const s = this.stats;
      const reach = this.size * 2.4 * s.clawSize;
      for (let i = 0; i < this.claws.length; i++) {
        const c = this.claws[i];
        c.swing = Math.max(0, c.swing - dt * 3.4 * s.attackSpeed);
        const base = this.bodyAngle + c.side * 0.62;
        let tx, ty;

        c.y += c.vy * dt;

    _updateEyes(dt, game2, speed) {

    constructor(game2) {

      this.nextRareT = 120;
      this.attractT = 12;

    update(dt) {
      this.t += dt;

      if (this.t > 1.4) {
        this.t = 0;

      if (this.attractT <= 0) {
        this.attractT = 18;
        this._attractToGrove();

      this.nextRareT -= dt;

        this._maybeRare();

      if (this.raid) this._updateRaid(dt);

    // -- population -----------------------------------------------------------
    _cull() {
      const g = this.game;
      for (let i = g.creatures.length - 1; i >= 0; i--) {
        const c = g.creatures[i];
        if (c.dead && c.deathT > 2.4) {
          g.creatures.splice(i, 1);
          continue;
        }
        if (c.tamed || c.sp.role === "boss" || c.raider) continue;
        const d = dist(c.x, c.y, g.crab.x, g.crab.y);
        if (d > 900) g.creatures.splice(i, 1);
      }
    }
    _wildCount() {
      let n = 0;
      for (const c of this.game.creatures) if (!c.tamed && !c.dead && !c.raider) n++;
      return n;
    }
    _maintain() {
      const g = this.game;
      const night = g.weather.isNight;
      const region = g.currentRegion;
      const tier = g.eco.tier.t;
      const wanted = clamp(
        6 + tier * 2 + (night ? 3 : 0) + Math.round(g.eco.biomass / 90),
        6,
        MAX_WILD
      );
      if (this._wildCount() >= wanted) return;
      const hostileChance = night ? 0.42 + tier * 0.02 : 0.13;
      const wantHostile = this.rng.bool(clamp01(hostileChance));
      const pool = speciesForRegion(region.id, {
        role: wantHostile ? "hostile" : null,
        ecoTier: tier + 1,
        night
      }).filter((s) => s.role !== "boss" && (wantHostile || s.role !== "hostile"));
      if (!pool.length) return;
      const sp = this.rng.weighted(pool.map((s) => ({ w: 1 / (s.rarity || 1), s }))).s;
      const pos = this._offscreenPoint();
      if (!pos) return;
      this.spawn(sp.id, pos.x, pos.y);
    }
    _offscreenPoint(minR = 190, maxR = 420) {
      const g = this.game;
      for (let i = 0; i < 12; i++) {
        const a = this.rng.float(TAU);
        const r = this.rng.float(minR, maxR);
        const x = g.crab.x + Math.cos(a) * r;
        const y = g.crab.y + Math.sin(a) * r;
        if (!g.world.inBounds(x, y)) continue;
        if (g.cam.isVisible(x, y, 40)) continue;
        return { x, y };
      }
      return null;
    }
    spawn(speciesId, x, y, opts = {}) {
      const g = this.game;
      const c = new Creature(g, speciesId, x, y, opts);
      g.creatures.push(c);
      g.discoverSpecies(speciesId);
      return c;
    }
    /** Plants that "attract" a species pull it toward the grove. */
    _attractToGrove() {
      const g = this.game;
      if (this._wildCount() >= MAX_WILD) return;
      const wanted = /* @__PURE__ */ new Set();
      for (const p of g.eco.plants) {
        if (p.dead || p.growth < 0.85) continue;
        const spec = PLANTS[p.type];
        for (const a2 of spec.attracts || []) wanted.add(a2 + "|" + Math.round(p.x) + "|" + Math.round(p.y));
      }
      if (!wanted.size) return;
      const pick = this.rng.pick([...wanted]).split("|");
      const spId = pick[0];
      const sp = SPECIES[spId];
      if (!sp) return;
      if (sp.ecoTier > g.eco.tier.t + 1) return;
      const have = g.creatures.filter((c2) => c2.sp.id === spId && !c2.dead).length;
      if (have >= 5) return;
      const a = this.rng.float(TAU);
      const r = this.rng.float(120, 220);
      const x = +pick[1] + Math.cos(a) * r;
      const y = +pick[2] + Math.sin(a) * r;
      if (!g.world.inBounds(x, y)) return;
      const c = this.spawn(spId, x, y);
      c.home = { x: +pick[1], y: +pick[2] };
      if (g.cam.isVisible(x, y, 100)) g.notify(`${sp.name} arrived.`, "good");
    }
    _maybeRare() {
      const g = this.game;
      const tier = g.eco.tier.t;
      if (tier < 4) return;
      const rares = SPECIES_LIST.filter((s) => s.role === "rare" && s.regions.includes(g.currentRegion.id) && (s.ecoTier || 0) <= tier);
      if (!rares.length) return;
      const sp = this.rng.pick(rares);
      if (g.creatures.some((c2) => c2.sp.id === sp.id && !c2.dead)) return;
      const pos = this._offscreenPoint(200, 340);
      if (!pos) return;
      const c = this.spawn(sp.id, pos.x, pos.y);
      g.notify(`Something rare is nearby: ${sp.name}`, "rare");
      g.audio.play("discover");
      g.particles.text("?", pos.x, pos.y - 20, { color: "#e2c0ff", scale: 2 });
      return c;
    }
    // -- night raids ----------------------------------------------------------
    startRaid() {
      const g = this.game;
      if (this.raid) return;
      const tier = g.eco.tier.t;
      if (tier < 1) return;
      const strength = 1 + tier + Math.floor(g.weather.day / 3);
      const pool = speciesForRegion(g.currentRegion.id, { role: "hostile", night: true }).filter((s) => s.role === "hostile");
      if (!pool.length) return;
      const count = clamp(1 + Math.floor(strength * 0.8), 2, 9);
      const grove = g.groveCenter;
      const a0 = this.rng.float(TAU);
      const spawned = [];
      for (let i = 0; i < count; i++) {
        const sp = this.rng.weighted(pool.map((s) => ({ w: 1 / (s.rarity || 1), s }))).s;
        const a = a0 + i / count * 1.2 + this.rng.float(-0.2, 0.2);
        const r = 300 + this.rng.float(0, 90);
        const x = grove.x + Math.cos(a) * r;
        const y = grove.y + Math.sin(a) * r;
        if (!g.world.inBounds(x, y)) continue;
        const c = this.spawn(sp.id, x, y, {});
        c.raider = true;
        c.home = { x: grove.x, y: grove.y };
        c.alarmed = 999;
        spawned.push(c);
      }
      if (!spawned.length) return;
      this.raid = { members: spawned, t: 0, count: spawned.length };
      g.onRaidStart(spawned.length);
    }
    _updateRaid(dt) {
      const g = this.game;
      this.raid.t += dt;
      const alive = this.raid.members.filter((c) => !c.dead);
      for (const c of alive) {
        if (!c.target && !c.hostile) continue;
        const d = dist(c.x, c.y, g.groveCenter.x, g.groveCenter.y);
        if (d > 400) c._seek(g.groveCenter.x, g.groveCenter.y, dt, 0.6);
      }
      if (!alive.length) {
        this.raidsSurvived++;
        this.raid = null;
        g.onRaidCleared();
        return;
      }
      if (!g.weather.isNight && this.raid.t > 5) {
        for (const c of alive) {
          c.raider = false;
          c.hostile = true;
          c.home = { x: c.x, y: c.y };
        }
        this.raidsSurvived++;
        this.raid = null;
        g.onRaidCleared(true);
      }
    }
    raidRemaining() {
      return this.raid ? this.raid.members.filter((c) => !c.dead).length : 0;
    }
  };

      const onCrab = dist(world.x, world.y, crab.x, crab.y) < crab.size * 2.2;
      if (onCrab) {
        crab.controlled = !crab.controlled;
        crab.moveTarget = null;
        this.cam.followEntity(crab);
        this.notify(crab.controlled ? "Direct control. WASD to move, click to strike." : "Command mode. Click the ground to send the crab.", "info");
        this.audio.play("uiBig");
        return;
      }
      const hit = this._pick(world.x, world.y);
      if (hit && hit.type === "creature") {
        const c = hit.ref;
        if (c.tamed) {
          this.selected = this.selected === c ? null : c;
          this.audio.play("ui");
          return;
        }
        if (crab.controlled && c.hostile) {
          crab.swingClaw(c.x, c.y);
          return;
        }
        if (c.canTame() && dist(crab.x, crab.y, c.x, c.y) < this.evo.stats.tameRange + 12) {
          this._tame(c);
          return;
        }
      }
      if (hit && hit.type === "plant" && hit.ref.type === "berry") {
        this._tryHarvest(hit.ref);
        return;
      }
      if (hit && hit.type === "poi") {
        this._tryAbsorb(hit.ref);
        return;
      }
      if (crab.controlled) {
        crab.swingClaw(world.x, world.y);
      } else {
        crab.commandMoveTo(world.x, world.y);
        this.selected = null;
        this.particles.ring(world.x, world.y, { r0: 2, r1: 10, life: 0.3, color: "#9fe4f4" });

    _contextName(act) {

      if (act.target.sp) {
        const cost = Math.ceil(act.target.sp.tame.cost * this.evo.stats.tameCost);
        return `${act.target.sp.name} (${cost} ${act.target.sp.tame.item})`;
      }
      return act.target.name || "water";
    }
    _nearestHostile() {
      let best = null, bd = 140;
      for (const c of this.creatures) {
        if (c.dead || !c.hostile) continue;
        const d = dist(this.crab.x, this.crab.y, c.x, c.y);
        if (d < bd) {
          bd = d;
          best = c;
        }
      }
      return best;
    }
    _pick(x, y) {
      let best = null, bd = Infinity;
      for (const c of this.creatures) {
        if (c.dead) continue;
        const d = dist(x, y, c.x, c.y - c.z * 0.5);
        const r = Math.max(7, c.radius + 5);
        if (d < r && d < bd) {
          bd = d;
          best = { type: "creature", ref: c };
        }
      }
      if (best) {
        const c = best.ref;
        const near = dist(this.crab.x, this.crab.y, c.x, c.y) < this.evo.stats.tameRange + 12;
        if (c.tamed) best.prompt = `${c.name || c.sp.name} - click to select`;
        else if (c.hostile) best.prompt = `${c.sp.name} - hostile`;
        else if (c.canTame()) best.prompt = near ? `${c.sp.name} - T to offer ${Math.ceil(c.sp.tame.cost * this.evo.stats.tameCost)} ${c.sp.tame.item}` : `${c.sp.name} - get closer to befriend`;
        else best.prompt = c.sp.name;
        return best;
      }
      for (const p of this.eco.plantsNear(x, y, 14)) {
        const d = dist(x, y, p.x, p.y);
        if (d < Math.max(6, p.r) && d < bd) {
          bd = d;
          best = { type: "plant", ref: p };
          const spec = PLANTS[p.type];
          best.prompt = p.dead ? `${spec.name} (dead)` : p.growth < 1 ? `${spec.name} - growing ${Math.floor(p.growth * 100)}%` : p.type === "berry" && p.berries >= 1 ? `${spec.name} - H to harvest` : spec.name;
        }
      }
      if (best) return best;
      for (const poi of this.world.pois) {
        const d = dist(x, y, poi.x, poi.y);
        if (d < poi.radius && d < bd) {
          bd = d;
          best = { type: "poi", ref: poi };
          best.prompt = poi.waterLeft > 0 ? `${poi.name} - R to absorb water (${Math.round(poi.waterLeft)})` : poi.name;

    // -- verbs ----------------------------------------------------------------
    _tryTame(target) {

        for (const o of this.creatures) {
          if (o.dead || o.tamed || !o.canTame()) continue;
          const d = dist(crab.x, crab.y, o.x, o.y);
          if (d < bd) {
            bd = d;
            c = o;
          }
        }
      }
      if (!c) {
        this.notify("Nothing nearby to befriend.", "bad");
        this.audio.play("deny");
        return;
      }
      this._tame(c);
    }
    _tame(c) {
      const pals = this.creatures.filter((x) => x.tamed && !x.dead).length;
      if (pals >= this.evo.stats.companionSlots) {
        this.notify("No room for another companion. (Nest Builder helps.)", "bad");
        this.audio.play("deny");
        return;
      }
      const cost = Math.ceil(c.sp.tame.cost * this.evo.stats.tameCost);
      const item = c.sp.tame.item;
      const have = item === "water" ? this.crab.water : this.res.food || 0;
      if (have < cost) {
        this.notify(`Need ${cost} ${item}. You have ${Math.floor(have)}.`, "bad");
        this.audio.play("deny");
        return;
      }
      if (item === "water") this.crab.water -= cost;
      else this.res.food -= cost;
      c.tame();
      c.home = { x: this.groveCenter.x, y: this.groveCenter.y };
      this.statsRun.tamed++;
      this.audio.play("pickup");
      this.notify(`${c.sp.name} joined you.`, "good");
      if (c.sp.unlock) this._unlockMechanic(c.sp.unlock, c);

    _unlockMechanic(id, c) {

        aquiferTap: "The Nautilus can open a permanent water line.",
        roamingGrove: "The Duneback will carry part of your grove with it."
      };
      this.notify(msgs[id] || "Something new is possible.", "rare");
      this.audio.play("evolve");
      this.renderer.doFlash("#9fe8ff", 0.5);
    }
    _tryHarvest(target) {
      let got = 0;
      const list = target ? [target] : this.eco.plantsNear(this.crab.x, this.crab.y, 34);
      for (const p of list) {
        const r = this.eco.harvest(p);
        if (r && r.food) {
          got += r.food;
          this.particles.burst("chunk", p.x, p.y - p.r, 4, { color: "#b5354b", speedMin: 8, speedMax: 24, life: 0.5, grav: 80 });
        }
      }
      if (got > 0) {
        this.gain("food", got, this.crab.x, this.crab.y - 14);
        this.audio.play("pickup");

        this.audio.play("deny");

    _tryAbsorb(target) {
      const crab = this.crab;
      const poi = target || this.world.nearestPoi(crab.x, crab.y, 90, (p) => p.waterLeft > 0);
      if (!poi) {
        this.notify("No water source in reach.", "bad");
        this.audio.play("deny");
        return;

      if (dist(crab.x, crab.y, poi.x, poi.y) > poi.radius + 24) {
        this.notify("Too far. Get closer to the water.", "bad");
        return;
      }
      const room = crab.waterMax - crab.water;
      if (room <= 0.5) {
        this.notify("You are completely full of water.", "bad");
        return;
      }
      const take = Math.min(room, poi.waterLeft, 40);
      poi.waterLeft -= take;
      crab.addWater(take);
      this.particles.burst("drop", poi.x, poi.y, 16, { color: "#9fe4f4", speedMin: 10, speedMax: 30, life: 0.7, grav: 30, glow: 4 });

    // -- passive ticks --------------------------------------------------------
    _hazards(dt) {
      const h = this.currentRegion.hazard;
      this.hazardSlow = 1;
      this.hazardDrain = 1;
      if (!h) return;
      if (h.id === "glare" && this.evo.flag("glareProof")) return;
      if (h.id === "rustspore" && this.evo.flag("rustProof")) return;
      const shaded = this.eco.plantsNear(this.crab.x, this.crab.y, 40).some((p) => !p.dead && p.growth > 0.7 && PLANTS[p.type].gives.shade);
      const mult = shaded ? 0.25 : 1;
      if (h.slow) this.hazardSlow = lerp(1, h.slow, mult);
      if (h.waterDrain) this.hazardDrain = 1 + h.waterDrain * mult;
      if (h.dps && this.state !== "dead") {
        this.crab.hp = Math.max(0, this.crab.hp - h.dps * dt * mult);
        if (Math.random() < dt * 1.4 * mult) {

            color: h.id === "ashfall" ? "#8e7d8f" : "#c47a44",
            life: 0.7,
            vz: 4,
            grav: 8,
            wind: 0.4
          });
        }
        if (this.crab.hp <= 0) this.onCrabDown({ hazard: h });
      }
      if (this.burrowT > 0) {
        this.burrowT -= dt;
        this.crab.buried = clamp01(this.burrowT / 0.4);
        if (this.burrowT <= 0) this.crab.buried = 0;
      }
    }
    _passive(dt) {
      const s = this.evo.stats;
      if (s.passiveNutrients) this.gain("nutrients", s.passiveNutrients * dt);
      if (this.evo.flag("rootFeet")) {
        const wet = this.eco.moistureAt(this.crab.x, this.crab.y);
        const moss = this.eco.plantsNear(this.crab.x, this.crab.y, 16).some((p) => p.type === "moss" && !p.dead);
        if (wet > 0.2 && moss && this.crab.hp < this.crab.hpMax) {
          this.crab.hp = Math.min(this.crab.hpMax, this.crab.hp + dt * 2.4);
          if (Math.random() < dt * 3) {
            this.particles.spawn("spark", this.crab.x + (Math.random() - 0.5) * 8, this.crab.y, {
              color: "#8fd47a",
              life: 0.6,
              vz: 10,
              grav: 4,
              glow: 3
            });
          }
        }
      }
      if (s.thorns > 0) {
        for (const c of this.creatures) {
          if (!c.hostile || c.dead) continue;
          if (dist(c.x, c.y, this.crab.x, this.crab.y) < this.crab.size * 1.6 && c.attackCd > 1) {
            c.hurt(s.thorns * dt * 4, this.crab.x, this.crab.y, this.crab);
          }
        }
      }
      if (this.eco.plants.length > 6) {
        let sx = 0, sy = 0, n = 0;
        for (const p of this.eco.plants) {
          if (p.dead) continue;
          sx += p.x;
          sy += p.y;
          n++;
        }
        if (n) {
          this.groveCenter.x = damp(this.groveCenter.x, sx / n, 0.5, dt);
          this.groveCenter.y = damp(this.groveCenter.y, sy / n, 0.5, dt);
        }
      }
      if (this.weather.rain > 0.4 && Math.random() < dt * 8) {
        const b = this.cam.bounds(40);
        this.particles.spawn("rain", lerp(b.x0, b.x1, Math.random()), lerp(b.y0, b.y1, Math.random()), {
          color: "#a8d8e8",
          life: 0.7,
          vz: -140,
          z: 60,
          grav: -220,
          layer: "over"
        });
      }
      if (this.weather.sand > 0.3 && Math.random() < dt * 22) {
        const b = this.cam.bounds(40);
        this.particles.spawn("sand", lerp(b.x0, b.x1, Math.random()), lerp(b.y0, b.y1, Math.random()), {
          color: this.currentRegion.pal.crest,
          life: 1.2,
          wind: 3,
          size: 1,
          drag: 0.99

    }
    _discoverPois() {
      for (const p of this.world.pois) {

        if (d < reveal) {

          this.tutorial.lastPoi = p;
          this.notify(`Found: ${p.name}`, "rare");

    _recomputeBonuses() {
      const b = { growth: 1, spread: 1, waterUse: 1, dayGrowth: 1, compost: false };
      this.bonusWaterMax = 0;
      let nightLight = 0;
      for (const c of this.creatures) {
        if (!c.tamed || c.dead || !c.work) continue;
        switch (c.work) {
          case "pollinate":
            b.growth += 0.35;
            break;
          case "till":
            b.spread += 0.5;
            break;
          case "refract":
            b.dayGrowth += 0.4;
            break;
          case "purify":
            this.bonusWaterMax += 12;
            b.waterUse *= 0.9;
            break;
          case "compost":
            b.compost = true;
            break;
          case "nightsee":

            break;

        }

      this.eco.bonuses = b;

    /** One tick of a companion doing its job. Called by Creature. */
    doCreatureWork(c) {
      const grove = this.groveCenter;
      const rand = (a, b) => a + Math.random() * (b - a);
      switch (c.work) {
        case "forage": {
          const pool = ["nutrients", "food", "nutrients", "silica", "iron", "salt", "calcium", "ash"];
          const kind = pool[Math.floor(Math.random() * pool.length)];
          const amt = kind === "nutrients" ? rand(2, 6) : 1;
          this.gain(kind, amt, c.x, c.y - 10);
          c.workTarget = { x: grove.x + rand(-80, 80), y: grove.y + rand(-80, 80) };
          this.particles.spawn("spark", c.x, c.y, { color: "#ffe9a0", life: 0.8, glow: 4, vz: 10, grav: 6 });
          break;
        }
        case "seed": {
          const parents = this.eco.plants.filter((p2) => !p2.dead && p2.growth > 0.8);
          if (!parents.length) break;
          const p = parents[Math.floor(Math.random() * parents.length)];
          const a = Math.random() * TAU, d = rand(16, 46);
          const nx = p.x + Math.cos(a) * d, ny = p.y + Math.sin(a) * d;
          if (this.eco.moistureAt(nx, ny) > 0.08 && this.eco.canPlant(p.type, nx, ny)) {
            this.eco.plant(p.type, nx, ny);
            this.particles.spawn("spark", nx, ny, { color: "#8fd47a", life: 0.8, glow: 3, vz: 8, grav: 5 });
          }
          c.workTarget = { x: nx, y: ny };
          break;
        }
        case "digwater": {
          const a = Math.random() * TAU, d = rand(30, 120);
          const x = grove.x + Math.cos(a) * d, y = grove.y + Math.sin(a) * d;
          this.eco.addWater(x, y, 22, 26);
          this.particles.burst("drop", x, y, 8, { color: "#9fe4f4", speedMin: 6, speedMax: 22, life: 0.6, grav: 40, glow: 3 });
          c.workTarget = { x, y };
          if (Math.random() < 0.12) {
            const seep = this.world.nearestPoi(x, y, 900, (p) => p.kind === "seep" && !p.discovered);
            if (seep) {
              seep.discovered = true;
              this.notify(`${c.sp.name} sniffed out ${seep.name}.`, "good");
            }
          }
          break;
        }
        case "haul": {
          const src = this.world.nearestPoi(grove.x, grove.y, 1400, (p) => p.waterLeft > 4);
          if (src) {
            const take = Math.min(12, src.waterLeft);
            src.waterLeft -= take;
            this.eco.addWater(grove.x + rand(-40, 40), grove.y + rand(-40, 40), take * 3, 28);

          }
          break;
        }
        case "scout": {
          const undisc = this.world.pois.filter((p) => !p.discovered);
          if (undisc.length) {
            undisc.sort((a, b2) => dist(a.x, a.y, c.x, c.y) - dist(b2.x, b2.y, c.x, c.y));
            const p = undisc[0];

          break;
        }
        case "rain": {
          if (this.weather.kind !== "rain" && Math.random() < 0.4) {
            this.weather.force("rain", 40);
            this.notify(`${c.sp.name} pulled a cloud over.`, "rare");
          }
          break;
        }
        case "aquifer": {
          this.crab.addWater(6);
          this.eco.addWater(grove.x, grove.y, 30, 40);
          this.particles.ring(grove.x, grove.y, { r0: 4, r1: 44, life: 0.6, color: "#7fe0d0" });
          break;
        }
        case "guard":
        case "nightsee":
        case "pollinate":
        case "till":
        case "refract":
        case "purify":
        case "compost":

          c.workTarget = { x: grove.x + rand(-70, 70), y: grove.y + rand(-70, 70) };
          break;
      }
    }
    organScreenPos() {

      return {

    onCrabDown(source) {

      this.renderer.doFlash("#802020", 0.7);
      this.cam.addShake(8);
      this.particles.burst("chunk", this.crab.x, this.crab.y, 20, {
        color: "#b8543a",
        speedMin: 20,
        speedMax: 60,
        life: 1.2,
        grav: 120,
        lift: 30
      });
    }
    _revive() {
      this.state = "play";
      this.crab.hp = this.crab.hpMax * 0.5;
      this.crab.water = Math.max(2, this.crab.water * 0.5);
      this.crab.invuln = 3;
      this.crab.buried = 0;
      this.burrowT = 0;
      this.crab.x = this.groveCenter.x;
      this.crab.y = this.groveCenter.y;
      this.crab._resetFeet();
      this.cam.followEntity(this.crab, true);
      this.res.nutrients = Math.floor(this.res.nutrients * 0.75);
      this.notify("You woke up again. Something dragged you home.", "info");
      for (const c of this.creatures) if (c.hostile) c.state = "wander";
    }
    onRaidStart(n) {
      this.notify(`Something is coming for the grove. (${n})`, "bad");
      this.audio.play("growl");
      this.audio.setMood("danger");
      this.renderer.doFlash("#601818", 0.35);
      this.cam.addShake(3);
    }
    onRaidCleared(dawn) {
      this.notify(dawn ? "The sun came up. They scattered." : "The grove held.", "good");
      this.audio.setMood(this.weather.isNight ? "night" : this.currentRegion.ambience);
      this.gain("nutrients", 12, this.crab.x, this.crab.y - 16);
      this.audio.play("discover");
    }
    onDusk() {
      this.audio.setMood("night");
      this.audio.play("night");
      this.notify("Night.", "info");
      if (Math.random() < 0.62) this.spawner.startRaid();
    }
    onDawn() {
      this.audio.setMood(this.currentRegion.ambience);
      this.audio.play("dawn");
      this.notify("Dawn.", "good");
      this.crab.vigor = 1;
    }
    onNewDay(day) {
      this.notify(`Day ${day}.`, "info");
      if (day % 2 === 0) this.save();
    }
    onWeather(kind) {
      const msg = {
        sandstorm: "Sandstorm rolling in.",
        heatwave: "The air is boiling.",
        rain: "It is raining. Actual rain.",
        lightning: "Dry lightning over the flats.",
        fogbank: "Fog, thick as wool."
      }[kind];
      if (msg) this.notify(msg, kind === "rain" ? "rare" : "info");
    }
    onTutorialComplete() {
      this.notify("Dr. Pell has taught you everything he knows. Which was six things.", "good");
      this.pell.chirp("You have got this. I will be over here, digging.", 5);
    }
    // -- render ---------------------------------------------------------------
    draw() {
      const r = this.renderer;
      const ctx = r.scene;
      const cam = this.cam;
      r.beginFrame(0);
      if (this.state === "title") {
        this._drawTitle(ctx, r);
        return;
      }
      this.world.draw(ctx, cam, this.weather.shadow);
      drawWetGround(ctx, cam, this);
      this.particles.drawDecals(ctx, cam);
      const bounds = cam.bounds(80);
      const visiblePois = this.world.pois.filter((p) => p.x > bounds.x0 - 160 && p.x < bounds.x1 + 160 && p.y > bounds.y0 - 160 && p.y < bounds.y1 + 160);
      const FLAT = ["oasis", "seep", "crater", "well"];
      for (const p of visiblePois) if (FLAT.includes(p.kind)) drawPoi(ctx, cam, this, p);
      const list = [];
      for (const d of this.world.decorNear(bounds)) list.push({ y: d.y, kind: "decor", ref: d });
      for (const p of this.eco.plantsInBounds(bounds)) list.push({ y: p.y, kind: "plant", ref: p });
      for (const c of this.creatures) {
        if (!cam.isVisible(c.x, c.y, 60)) continue;
        list.push({ y: c.y, kind: "creature", ref: c });
      }
      for (const p of visiblePois) if (!FLAT.includes(p.kind)) list.push({ y: p.y, kind: "poi", ref: p });
      list.push({ y: this.crab.y, kind: "crab", ref: this.crab });
      if (!this.pell.hidden && cam.isVisible(this.pell.x, this.pell.y, 60)) {
        list.push({ y: this.pell.y, kind: "pell", ref: this.pell });
      }
      list.sort((a, b) => a.y - b.y);
      for (const e of list) {
        switch (e.kind) {
          case "decor":
            drawDecorShadow(ctx, cam, this.weather, e.ref);
            break;
          case "plant":
            drawPlantShadow(ctx, cam, this.weather, e.ref);
            break;
          case "creature":
            drawCreatureShadow(ctx, cam, this.weather, e.ref);
            break;
          case "crab":
            e.ref.drawShadow(ctx, cam, this.weather);
            break;
          case "pell":
            e.ref.drawShadow(ctx, cam, this.weather);
            break;
          default:
            break;
        }
      }
      this.particles.draw(ctx, cam, "under");
      for (const e of list) {
        switch (e.kind) {
          case "decor":
            drawDecor(ctx, cam, this, e.ref);
            break;
          case "plant":
            drawPlant(ctx, cam, this, e.ref);
            break;
          case "creature":
            e.ref.draw(ctx, cam, this);
            break;
          case "poi":
            drawPoi(ctx, cam, this, e.ref);
            break;
          case "crab":
            e.ref.draw(ctx, cam, this);
            break;
          case "pell":
            e.ref.draw(ctx, cam, this);
            break;
          default:
            break;
        }
      }
      if (this.selected && !this.selected.dead) {
        const s = cam.worldToScreen(this.selected.x, this.selected.y);
        selectionRing(ctx, s.x, s.y, this.selected.radius * cam.zoom + 4, "#ffb45a", this.time * 2);
      }
      if (this.uiHover && this.uiHover.type === "creature" && this.uiHover.ref !== this.selected) {
        const s = cam.worldToScreen(this.uiHover.ref.x, this.uiHover.ref.y);
        selectionRing(ctx, s.x, s.y, this.uiHover.ref.radius * cam.zoom + 4, "rgba(255,233,160,0.6)", -this.time * 1.4);
      }
      if (this.crab.controlled) {
        const s = cam.worldToScreen(this.crab.x, this.crab.y);
        selectionRing(ctx, s.x, s.y, this.crab.size * cam.zoom * 2, "rgba(159,228,244,0.5)", this.time);
      }
      this.particles.draw(ctx, cam, "over");
      for (const p of visiblePois) drawPoiLabel(ctx, cam, this, p);
      this.particles.drawTexts(ctx, cam);
      r.beginLights(this.weather);
      this.crab.drawLights(r, cam, this);
      for (const c of this.creatures) {
        if (cam.isVisible(c.x, c.y, 80)) c.drawLights(r, cam);
      }
      for (const p of visiblePois) {
        if (p.waterLeft > 0 && (p.kind === "oasis" || p.kind === "seep" || p.kind === "well")) {
          const s = cam.worldToScreen(p.x, p.y);
          r.addLight(s.x, s.y, p.radius * cam.zoom * 0.8, "#6fd8ee", 0.28);
        }
      }
      if (this.nightLight && this.weather.isNight) {
        const s = cam.worldToScreen(this.groveCenter.x, this.groveCenter.y);
        r.addLight(s.x, s.y, 120 * cam.zoom, "#ffb45a", 0.35 * Math.min(2, this.nightLight));
      }
      this.particles.drawLights(r.light, cam);
      r.endLights();
      const ui = r.ui;
      this.hud.draw(ui, this);
      this.panels.draw(ui, this);
      this.cutscene.draw(ui, this);
      this.touch.draw(ui, this);
      if (this.state === "dead") this._drawDeath(ui, r);
      r.composite(this.weather, this);
    }
    _drawDeath(ctx, r) {
      ctx.fillStyle = "rgba(40,8,8,0.5)";
      ctx.fillRect(0, 0, r.vw, r.vh);
      drawText(ctx, "YOU WERE EATEN", r.vw / 2, r.vh / 2 - 16, {
        color: "#ff8a7a",
        align: "center",
        scale: 3,
        outline: true,
        outlineColor: "#1a0808"
      });
      drawText(ctx, "a thousand years of sleep, ended by a scorpion", r.vw / 2, r.vh / 2 + 8, {
        color: "#e8c0b8",
        align: "center",
        scale: 1
      });
      if (this.deathT > 3 && Math.floor(this.time * 2) % 2 === 0) {
        drawText(ctx, "click to wake up again", r.vw / 2, r.vh / 2 + 22, {
          color: "#ffe9a0",
          align: "center",
          scale: 1
        });
      }
    }
    _drawTitle(ctx, r) {
      const vw = r.vw, vh = r.vh;
      const t = this.time;
      const g = ctx.createLinearGradient(0, 0, 0, vh);
      g.addColorStop(0, "#2a1f38");
      g.addColorStop(0.45, "#8a4a44");
      g.addColorStop(0.62, "#e08a4a");
      g.addColorStop(1, "#e8c88d");
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, vw, vh);
      const sy = vh * 0.6;
      ctx.fillStyle = "#ffd68a";
      ctx.beginPath();
      ctx.arc(vw * 0.5, sy, 26, 0, TAU);
      ctx.fill();
      for (let layer = 0; layer < 4; layer++) {
        const yBase = vh * (0.58 + layer * 0.11);
        const col = ["#a8683c", "#8a5230", "#6b3d24", "#4a281a"][layer];
        ctx.fillStyle = col;
        ctx.beginPath();
        ctx.moveTo(0, vh);
        for (let x = 0; x <= vw; x += 4) {
          const yy = yBase + Math.sin(x * 0.013 + layer * 2.1 + t * 0.02 * (layer + 1)) * (8 + layer * 4) + Math.sin(x * 0.031 + layer) * 3;
          ctx.lineTo(x, yy);
        }
        ctx.lineTo(vw, vh);
        ctx.closePath();
        ctx.fill();
      }
      const cx = t * 14 % (vw + 60) - 30;
      const cy = vh * 0.9 + Math.sin(cx * 0.02) * 4;
      ctx.fillStyle = "#2a170f";
      for (let i = 0; i < 8; i++) {
        const side = i < 4 ? -1 : 1;
        const ph = t * 9 + i * 1.1;
        const lx = cx + side * (5 + Math.sin(ph) * 3);
        const ly = cy + 3 + Math.abs(Math.cos(ph)) * -2;
        pxLine(ctx, cx, cy, lx, ly, "#2a170f", 1);
      }
      pxEllipse(ctx, cx, cy, 6, 4, "#2a170f");
      pxEllipse(ctx, cx - 1, cy - 4, 2, 2, "#4fd0e0");
      const ui = r.ui;
      const bob = Math.sin(t * 1.2) * 1.5;
      drawText(ui, "CRABDEN", vw / 2, vh * 0.2 + bob, {
        color: "#ffe9c0",
        align: "center",
        scale: 5,
        outline: true,
        outlineColor: "#3a1a10"
      });
      drawText(ui, "wake up. make water. fix everything.", vw / 2, vh * 0.2 + 42 + bob, {
        color: "#ffd9a0",
        align: "center",
        scale: 1,
        outline: true,
        outlineColor: "#3a1a10"
      });
      const touch = this.touch.active;
      if (Math.floor(t * 1.6) % 2 === 0) {
        drawText(ui, touch ? "tap to begin" : "click to begin", vw / 2, vh * 0.78, {
          color: "#fff4dc",
          align: "center",
          scale: 2,
          outline: true,
          outlineColor: "#3a1a10"
        });
      }
      this._titleContinue = null;
      if (hasSave()) {
        const info = saveInfo();
        const label = `continue - day ${info?.day ?? 1}`;
        if (touch) {
          const bw = textWidth(label, 1) + 20;
          const bh = 18;
          const bx = Math.round(vw / 2 - bw / 2), by = Math.round(vh * 0.87);
          this._titleContinue = { x: bx, y: by, w: bw, h: bh };
          panel(ui, bx, by, bw, bh, "rgba(28,18,12,0.85)", "#e0c088");
          drawText(ui, label, vw / 2, by + (bh - 7) / 2, { color: "#ffe9c0", align: "center", scale: 1 });
        } else {
          drawText(ui, `press L to continue  (day ${info?.day ?? 1})`, vw / 2, vh * 0.88, {
            color: "rgba(255,244,220,0.75)",
            align: "center",
            scale: 1,
            outline: true,
            outlineColor: "#3a1a10"
          });
        }
      }
      if (touch && vw < vh) {
        drawText(ui, "turn your phone sideways for more room", vw / 2, vh * 0.94, {
          color: "rgba(255,240,214,0.6)",
          align: "center",
          scale: 1,
          outline: true,
          outlineColor: "#3a1a10"
        });
      }
      drawText(ui, "a game about a very old crab and a very dry planet", vw / 2, vh - 12, {
        color: "rgba(255,240,214,0.55)",
        align: "center",
        scale: 1
      });
      r.hazeAmount = 0.9;
      r.composite(this.weather, this);
    }
  };

  // js/main.js
  var canvas = document.getElementById("game");
  var boot = document.getElementById("boot");
  var game;
  try {
    game = new Game(canvas);
    window.CRABDEN = game;
  } catch (err) {
    showError(err);
    throw err;
  }
  if (boot) boot.remove();
  var kick = () => {
    game.audio.resume();
    window.removeEventListener("pointerdown", kick);
    window.removeEventListener("keydown", kick);
  };
  window.addEventListener("pointerdown", kick);
  window.addEventListener("keydown", kick);
  var last = performance.now();
  function frame(now) {
    requestAnimationFrame(frame);
    let dt = (now - last) / 1e3;
    last = now;
    if (dt > 0.25) dt = 0.25;
    if (dt <= 0) return;
    try {
      game.update(dt);
      game.draw();
      game.input.endFrame();
    } catch (err) {
      showError(err);
      throw err;
    }
  }
  requestAnimationFrame(frame);
  document.addEventListener("visibilitychange", () => {
    last = performance.now();
  });
  window.addEventListener("orientationchange", () => {
    setTimeout(() => {
      game.renderer.resize();
      game.input.scale = game.renderer.scale;
    }, 120);
  });
  function showError(err) {
    const box = document.createElement("div");
    box.className = "crash";
    box.innerHTML = `<h1>the crab has encountered a problem</h1><pre></pre>
    <p>reload to try again. if it keeps happening, clear the save from the browser console:
    <code>localStorage.clear()</code></p>`;
    box.querySelector("pre").textContent = err && err.stack || String(err);
    document.body.appendChild(box);
  }
})();
</script>
</body>
